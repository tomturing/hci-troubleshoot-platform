        command_or_path: acli task get -k "获取快照类型失败" -t <故障日期> -s -l 1
        command_example: acli task get -k "获取快照类型失败" -t 2023-10-01 -s -l 1
        expected_result: 命令返回的任务列表中包含一条错误码为0x0000000000FF1D84的记录，并显示任务生成时间及所在节点。
        matched_signals:
