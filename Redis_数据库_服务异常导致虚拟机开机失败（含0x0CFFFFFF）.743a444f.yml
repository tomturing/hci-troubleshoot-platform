  - branch_id: branch-B
    branch_name: asv服务组件异常（exporter/prometheus）导致虚拟机开机失败
    branch_type: runbook
    branch_summary: 本分支覆盖因asv服务中的exporter或prometheus组件异常导致虚拟机开机失败，界面提示“虚拟机未运行”的场景。核心检查路径：检查exporter服务状态及文件是否存在，检查prometheus服务状态及/sf/data/local分区使用率。修复路径：手动启动exporter服务，清理/sf/data/local分区空间。
    branch_summary_source_type: explicit
    source_case_ids:
      - manual-vm-power-llm-0030
    scene_titles:
      - Exporter/Prometheus服务异常致开机失败
    routing_signals:
      - 虚拟机未运行
    root_causes:
      - exporter 服务未正常运行或组件文件缺失
      - 磁盘空间不足（/sf/data/local 分区满）导致 prometheus 服务异常
    checks:
      - step_id: check-1
        action: 检查 exporter 服务状态，执行命令 acli service asv exporter status，确认服务是否为 running 状态
        command_or_path: acli service asv exporter status
        command_example: acli service asv exporter status
        expected_result: 服务状态为 running
        matched_signals:
          - 返回状态为非 running（如 stopped、not running 等）
        is_high_risk_operation: false
        command_line_executable: true
        if_true_next: check-1.1
        if_false_next: check-2
        if_true_exit_reason: ''
        if_false_exit_reason: ''
        source_type: explicit
        evidence_quotes:
          - acli service asv exporter status
          - 预期结果：服务状态为 running
      - step_id: check-1.1
        action: 当 exporter 服务状态异常时，进入系统 Shell 并检查 /sf/bin/exporter 文件是否存在（关键命令/路径：acli system && ls /sf/bin/exporter）
        command_or_path: acli system && ls /sf/bin/exporter
        command_example: acli system && ls /sf/bin/exporter
        expected_result: 文件存在（终端回显该文件路径）
        matched_signals:
          - 文件不存在
        is_high_risk_operation: false
        command_line_executable: true
        if_true_next: solution-1
        if_false_next: '[EXIT]'
        if_true_exit_reason: ''
        if_false_exit_reason: manual_review
        source_type: explicit
        evidence_quotes:
          - ls /sf/bin/exporter
          - 预期结果：文件存在
      - step_id: check-2
