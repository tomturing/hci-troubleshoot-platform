entry:
  summary: 本节点覆盖HCI平台虚拟机开机失败场景，涵盖因Redis服务异常（OOM/连接超时）、vn-node-agent-api服务内存过高、go-zero框架CPU计算异常、asv服务组件异常（exporter/prometheus）、MySQL连接数满、MySQL配置缺失（server-id）、数据库只读/配置异常、数据库死锁/IO超时等根因导致的虚拟机开机失败问题。
  symptoms:
    - 虚拟机开机任务失败
    - 前端报错：服务不可用，可能由于系统繁忙导致，请刷新页面重试
    - 错误码：0x0CFFFFFF
    - 虚拟机未运行
    - 获取快照类型失败！错误码：0x0000000000FF1D84
    - 更新网卡设备信息失败：数据处理失败
    - 错误码：0x0100186D
    - 创建虚拟机网卡连接失败
  alerts_or_keywords:
    - 服务不可用，可能由于系统繁忙导致
    - 0x0CFFFFFF
    - 虚拟机未运行
    - 获取快照类型失败
    - 0x0000000000FF1D84
    - 更新网卡设备信息失败
    - 0x0100186D
    - 创建虚拟机网卡连接失败
  prerequisites:
    - 具备acli命令行工具访问权限
    - 具备SSH登录集群节点权限
    - 故障发生日期
  environment_scope:
    - HCI-VT平台
    - HCI 6.8.0（x86架构）
    - 超融合平台
flow:
  - step_id: entry-1
    action: 查询失败任务详情，确认错误码和报错信息（关键命令/路径：acli task get -k '可能由于系统繁忙导致' -t <故障日期> -s -1）
    command_or_path: acli task get -k '可能由于系统繁忙导致' -t <故障日期> -s -1
    command_example: acli task get -k '可能由于系统繁忙导致' -t 2024-08-15 -s -1
    expected_result: 返回状态为“失败”、描述包含“服务不可用，可能由于系统繁忙导致”的任务记录
    matched_signals:
      - 状态：失败
      - 描述：服务不可用，可能由于系统繁忙导致
    is_high_risk_operation: false
    command_line_executable: true
    branches:
      - when: 任务记录中存在错误码0x0CFFFFFF
        goto_branch_id: branch-A
    if_no_match_next: entry-2
    if_no_match_exit_reason: ''
    source_case_ids:
      - manual-vm-power-llm-0023
      - manual-vm-power-llm-0024
      - manual-vm-power-llm-0026
      - manual-vm-power-llm-0027
    source_type: explicit
    evidence_quotes:
      - 前端报错“服务不可用，可能由于系统繁忙导致，请刷新页面重试”，错误码为0x0CFFFFFF
    source_case_count: 4
  - step_id: entry-2
    action: 查询失败任务详情，确认报错信息是否为“虚拟机未运行”（关键命令/路径：acli task get -k '虚拟机未运行' -t <故障日期> -s -1）
    command_or_path: acli task get -k '虚拟机未运行' -t <故障日期> -s -1
    command_example: acli task get -k '虚拟机未运行' -t 2024-08-15 -s -1
    expected_result: 返回状态为“失败”、描述包含“虚拟机未运行”的任务记录
    matched_signals:
      - 虚拟机未运行
    is_high_risk_operation: false
    command_line_executable: true
    branches:
      - when: 任务记录中包含“虚拟机未运行”
        goto_branch_id: branch-B
    if_no_match_next: entry-3
    if_no_match_exit_reason: ''
    source_case_ids:
      - manual-vm-power-llm-0030
    source_type: explicit
    evidence_quotes:
      - 界面提示：“虚拟机未运行”
    source_case_count: 1
  - step_id: entry-3
    action: 查询失败任务详情，确认报错信息是否为“获取快照类型失败”（关键命令/路径：acli task get -k '获取快照类型失败' -t <故障日期> -s -1）
    command_or_path: acli task get -k '获取快照类型失败' -t <故障日期> -s -1
    command_example: acli task get -k '获取快照类型失败' -t 2024-08-15 -s -1
    expected_result: 返回状态为“失败”、描述包含“获取快照类型失败”的任务记录
    matched_signals:
      - 获取快照类型失败
    is_high_risk_operation: false
    command_line_executable: true
    branches:
      - when: 任务记录中包含错误码0x0000000000FF1D84
        goto_branch_id: branch-C
    if_no_match_next: entry-4
    if_no_match_exit_reason: ''
    source_case_ids:
      - manual-vm-power-llm-0034
    source_type: explicit
    evidence_quotes:
      - 启动虚拟机任务报错：获取快照类型失败！错误码：0x0000000000FF1D84
    source_case_count: 1
  - step_id: entry-4
    action: 查询失败任务详情，确认报错信息是否为“更新网卡设备信息失败”或“创建虚拟机网卡连接失败”（关键命令/路径：acli task get -k '更新网卡设备信息失败|创建虚拟机网卡连接失败' -t <故障日期> -s -1）
    command_or_path: acli task get -k '更新网卡设备信息失败|创建虚拟机网卡连接失败' -t <故障日期> -s -1
    command_example: acli task get -k '更新网卡设备信息失败|创建虚拟机网卡连接失败' -t 2024-08-15 -s -1
    expected_result: 返回状态为“失败”、描述包含“更新网卡设备信息失败”或“创建虚拟机网卡连接失败”的任务记录
    matched_signals:
      - 更新网卡设备信息失败
      - 创建虚拟机网卡连接失败
    is_high_risk_operation: false
    command_line_executable: true
    branches:
      - when: 任务记录中包含“更新网卡设备信息失败”
        goto_branch_id: branch-D
      - when: 任务记录中包含“创建虚拟机网卡连接失败”
        goto_branch_id: branch-E
    if_no_match_next: entry-5
    if_no_match_exit_reason: ''
    source_case_ids:
      - manual-vm-power-llm-0039
      - manual-vm-power-llm-0040
      - manual-vm-power-llm-0041
    source_type: explicit
    evidence_quotes:
      - 更新网卡设备信息失败：数据处理失败
      - 创建虚拟机网卡连接失败
    source_case_count: 3
  - step_id: entry-5
    action: 查询失败任务详情，确认报错信息是否为MySQL服务健康检查失败或未生成启动任务（关键命令/路径：acli platform check -p mysql）
    command_or_path: acli platform check -p mysql
    command_example: acli platform check -p mysql
    expected_result: 返回MySQL服务健康检查结果
    matched_signals:
      - '[fail]'
    is_high_risk_operation: false
    command_line_executable: true
    branches:
      - when: MySQL服务健康检查返回[fail]
        goto_branch_id: branch-F
    if_no_match_next: '[EXIT]'
    if_no_match_exit_reason: fallback_parent
    source_case_ids:
      - manual-vm-power-llm-0054
    source_type: explicit
    evidence_quotes:
      - MySQL 服务健康检查结果为 [fail]
    source_case_count: 1
branches:
  - branch_id: branch-A
    branch_name: Redis服务异常导致虚拟机开机失败（错误码0x0CFFFFFF）
    branch_type: runbook
    branch_summary: 本分支覆盖因Redis服务异常（OOM或连接超时）、vn-node-agent-api服务内存过高、go-zero框架CPU计算异常导致的虚拟机开机失败场景，入口症状为前端报错“服务不可用，可能由于系统繁忙导致”，错误码0x0CFFFFFF。合并自4个案例：manual-vm-power-llm-0023（Redis OOM）、manual-vm-power-llm-0027（Redis连接超时）、manual-vm-power-llm-0024（vn-node-agent-api内存过高）、manual-vm-power-llm-0026（go-zero框架异常）。这些案例共享相同的入口检查（确认错误码0x0CFFFFFF的任务）和相似的修复路径（重启相关服务），但根因细节不同，需通过后续检查分支区分。核心检查路径：检查vtpdaemon日志中Redis OOM关键字、检查vtpdaemon日志中Redis连接超时关键字、检查vn-node-agent-api日志中“Too man”关键字、检查statuscenterd.log中go-zero框架drop请求日志。修复路径：根据根因分别执行重启Redis服务、排查网络放通6379端口、重启vn-node-agent-api服务、安装补丁或升级版本。
    branch_summary_source_type: mixed
    source_case_ids:
      - manual-vm-power-llm-0023
      - manual-vm-power-llm-0024
      - manual-vm-power-llm-0026
      - manual-vm-power-llm-0027
    scene_titles:
      - Redis OOM导致虚拟机开机失败
      - 虚拟机开机失败 Redis连接超时
      - 虚拟机开机失败服务不可用
      - 虚拟机开机失败错误码0x0CFFFFFF
    routing_signals:
      - 错误码：0x0CFFFFFF
      - 服务不可用，可能由于系统繁忙导致
    root_causes:
      - 后台 Redis 服务已使用内存超过 maxmemory 限制，导致写命令被拒绝（OOM）
      - 集群主机间的Redis服务端口6379被网络设备或主机防火墙拦截，导致vtpdaemon无法建立到Redis的连接
      - vn-node-agent-api服务内存占用过高，导致API服务不可用
      - go-zero框架CPU计算异常：x86架构下，go-zero框架在计算CPU负载时出现数值无限大的异常，错误触发过载保护，丢弃与虚拟机启动相关的HTTP请求
    checks:
      - step_id: check-1
        action: 使用 acli task get 命令搜索包含“可能由于系统繁忙导致”的失败任务，确认是否存在状态为“失败”、错误码为 0x0CFFFFFF 的任务记录（关键命令/路径：acli task get -k "可能由于系统繁忙导致" -t <故障日期> -s -1）
        command_or_path: acli task get -k "可能由于系统繁忙导致" -t <故障日期> -s -1
        command_example: acli task get -k "可能由于系统繁忙导致" -t 2024-01-01 -s -1
        expected_result: 返回状态为“失败”、错误码为 0x0CFFFFFF 的任务记录
        matched_signals:
          - 任务状态：失败
          - 错误码：0x0CFFFFFF
        is_high_risk_operation: false
        command_line_executable: true
        if_true_next: check-2
        if_false_next: '[EXIT]'
        if_true_exit_reason: ''
        if_false_exit_reason: not_match
        source_type: explicit
        evidence_quotes:
          - 使用 acli task get 命令搜索包含“可能由于系统繁忙导致”的失败任务
          - 返回状态为“失败”、错误码为 0x0CFFFFFF 的任务记录
      - step_id: check-2
        action: 在 sfvt_vtpdaemon.log 日志中搜索 Redis OOM 关键字，确认是否存在 OOM 报错（关键命令/路径：acli log get -k 'OOM command not allowed when used memory' -p /sf/log/<日志日期>/ -f sfvt_vtpdaemon.log）
        command_or_path: acli log get -k 'OOM command not allowed when used memory' -p /sf/log/<日志日期>/ -f sfvt_vtpdaemon.log
        command_example: acli log get -k 'OOM command not allowed when used memory' -p /sf/log/20240101/ -f sfvt_vtpdaemon.log
        expected_result: 输出中包含 OOM command not allowed when used memory > 'maxmemory' 的日志行
        matched_signals:
          - OOM command not allowed when used memory > 'maxmemory'
        is_high_risk_operation: false
        command_line_executable: true
        if_true_next: solution-1
        if_false_next: check-3
        if_true_exit_reason: ''
        if_false_exit_reason: ''
        source_type: explicit
        evidence_quotes:
          - 在 sfvt_vtpdaemon.log 日志中搜索 Redis OOM 关键字
          - OOM command not allowed when used memory > 'maxmemory'
      - step_id: check-3
        action: "在 sfvt_vtpdaemon.log 日志中搜索 Redis 连接超时关键字，确认是否存在连接超时报错（关键命令/路径：acli log get -E -k \"Cloud not connect to Redis server at .*:6379: Connection timed out\" -p '/sf/log/${date}/' -f 'sfvt_vtpdaemon.log'）"
        command_or_path: "acli log get -E -k \"Cloud not connect to Redis server at .*:6379: Connection timed out\" -p '/sf/log/${date}/' -f 'sfvt_vtpdaemon.log'"
        command_example: "acli log get -E -k \"Cloud not connect to Redis server at .*:6379: Connection timed out\" -p '/sf/log/2024-08-15/' -f 'sfvt_vtpdaemon.log'"
        expected_result: '日志行中包含 Cloud not connect to Redis server at .*:6379: Connection timed out'
        matched_signals:
          - 'Cloud not connect to Redis server at .*:6379: Connection timed out'
        is_high_risk_operation: false
        command_line_executable: true
        if_true_next: check-4
        if_false_next: check-5
        if_true_exit_reason: ''
        if_false_exit_reason: ''
        source_type: explicit
        evidence_quotes:
          - 'Cloud not connect to Redis server at .*:6379: Connection timed out'
      - step_id: check-4
        action: 在出现故障的节点上，使用 telnet 工具测试到其他集群主机管理 IP 的 6379 端口连通性（关键命令/路径：acli system telnet <对端主机管理IP> 6379）
        command_or_path: acli system telnet <对端主机管理IP> 6379
        command_example: acli system telnet 192.168.1.100 6379
        expected_result: telnet 连接失败（连接超时或拒绝）
        matched_signals:
          - Connection timed out
          - Connection refused
        is_high_risk_operation: false
        command_line_executable: true
        if_true_next: check-4.1
        if_false_next: check-4.1
        if_true_exit_reason: ''
        if_false_exit_reason: ''
        source_type: explicit
        evidence_quotes: []
      - step_id: check-4.1
        action: 确认本机及对端主机的 Redis 服务均在运行（关键命令/路径：acli service asv redis status）
        command_or_path: acli service asv redis status
        command_example: acli service asv redis status
        expected_result: Redis 服务状态为运行中
        matched_signals:
          - running
        is_high_risk_operation: false
        command_line_executable: true
        if_true_next: solution-5
        if_false_next: '[EXIT]'
        if_true_exit_reason: ''
        if_false_exit_reason: manual_review
        source_type: explicit
        evidence_quotes: []
      - step_id: check-5
        action: 查看 vn-node-agent-api 服务日志，检索内存相关错误关键字“Too man”（关键命令/路径：acli log get -k 'Too man' -p /sf/log/<日期> -f vn-node-agent-api.log）
        command_or_path: acli log get -k 'Too man' -p /sf/log/<日期> -f vn-node-agent-api.log
        command_example: acli log get -k 'Too man' -p /sf/log/2025-03-20 -f vn-node-agent-api.log
        expected_result: 日志中出现“Too man”关键字
        matched_signals:
          - Too man
        is_high_risk_operation: false
        command_line_executable: true
        if_true_next: solution-8
        if_false_next: check-6
        if_true_exit_reason: ''
        if_false_exit_reason: ''
        source_type: explicit
        evidence_quotes:
          - acli log get -k 'Too man' -p /sf/log/${date} -f vn-node-agent-api.log
      - step_id: check-6
        action: 查看故障当天 statuscenterd.log 中是否存在 go-zero 框架丢弃请求的日志（包含 dropreq 或 [http] dropped 关键字）（关键命令/路径：acli log get -E -k 'dropreq|[http] dropped' -p /sf/log/<故障日期>/statuscenterd.log）
        command_or_path: acli log get -E -k 'dropreq|[http] dropped' -p /sf/log/<故障日期>/statuscenterd.log
        command_example: acli log get -E -k 'dropreq|[http] dropped' -p /sf/log/YYYY-MM-DD/statuscenterd.log
        expected_result: "输出中包含类似 'load/apaptivesshedder.go:197 dropreq，cpu：9xxxxxxxxxxxx, maxPass: xx' 和 'handler/sheddinghandle.go:38 [http] dropped' 的日志行"
        matched_signals:
          - 'load/apaptivesshedder.go:197 dropreq，cpu：9xxxxxxxxxxxx, maxPass: xx'
          - handler/sheddinghandle.go:38 [http] dropped
        is_high_risk_operation: false
        command_line_executable: true
        if_true_next: solution-10
        if_false_next: '[EXIT]'
        if_true_exit_reason: ''
        if_false_exit_reason: not_match
        source_type: explicit
        evidence_quotes:
          - acli log get -E -k 'dropreq|[http] dropped' -p /sf/log/YYYY-MM-DD/statuscenterd.log
          - 如果日志命中上述特征，则确认为 go-zero 框架问题
    solution_steps:
      - step_id: solution-1
        action: 确认当前 HCI 系统版本
        command_or_path: ''
        command_example: ''
        expected_result: 获取到系统版本信息
        matched_signals: []
        is_high_risk_operation: false
        command_line_executable: false
        if_success_next: solution-2
        if_failure_next: '[EXIT]'
        if_success_exit_reason: ''
        if_failure_exit_reason: manual_review
        source_type: explicit
        evidence_quotes:
          - 确认当前 HCI 系统版本
      - step_id: solution-2
        action: 根据确认的系统版本，执行对应的 Redis 重启命令：版本为 680 之前执行 /sf/etc/init.d/redis-server restart；版本为 680 及以上执行 acli service asv redis-server restart（关键命令/路径：if [ "$version" -lt 680 ]; then /sf/etc/init.d/redis-server restart; else acli service asv redis-server restart; fi）
        command_or_path: if [ "$version" -lt 680 ]; then /sf/etc/init.d/redis-server restart; else acli service asv redis-server restart; fi
        command_example: /sf/etc/init.d/redis-server restart
        expected_result: Redis 服务重启成功
        matched_signals: []
