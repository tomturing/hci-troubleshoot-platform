apiVersion: v1
kind: Pod
metadata:
  name: live-e2e-bridge
  labels:
    app: live-e2e-bridge
spec:
  containers:
    - name: bridge
      image: ghcr.io/tomturing/hci-troubleshoot-platform/terminal-bridge:20261010-1016-f683868
      args: ["--mode=cluster", "--allowed-origins=*"]
      ports:
        - containerPort: 9999
      env:
        - name: HCI_BRIDGE_LOG_LEVEL
          value: "DEBUG"
        - name: HCI_BRIDGE_HOST_KEY_POLICY
          value: "insecure"
        - name: HCI_BRIDGE_LOG_DIR
          value: "/var/lib/terminal-bridge"
      volumeMounts:
        - name: bridge-data
          mountPath: /var/lib/terminal-bridge
  volumes:
    - name: bridge-data
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: live-e2e-bridge
spec:
  selector:
    app: live-e2e-bridge
  ports:
    - port: 9999
      targetPort: 9999
