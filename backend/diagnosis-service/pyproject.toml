[project]
name = "hci-diagnosis-service"
version = "0.4.0"
description = "HCI 智能排障平台 — 离线诊断领域服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.9.1",
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "cryptography>=43.0.0",
    "jsonschema>=4.21.0",
    "httpx>=0.28.0,<1.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-logging",
    "langfuse>=3.0,<4.0",
    "prometheus-client>=0.19.0",
]

[tool.uv]
package = false
