[project]
name = "auth-service"
version = "0.1.0"
description = "统一认证服务：账号密码登录（customer/admin）、JWT(RS256+JWKS)签发、会话与登录审计"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = [".", "../.."]
testpaths = ["app/tests"]
