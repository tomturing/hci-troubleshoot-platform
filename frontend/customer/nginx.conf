server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # HTML 文件不缓存（防止 SPA 路由变更后浏览器使用旧缓存）
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # 静态下载文件（terminal_bridge.exe 等）
    # 强制浏览器触发文件下载，而非尝试打开或拒绝
    location /downloads/ {
        root /usr/share/nginx/html;
        add_header Content-Disposition "attachment";
        add_header Content-Type "application/octet-stream";
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # 运行时配置：Helm 可在不重新构建前端镜像的情况下切换 desktop/cluster Bridge。
    location = /runtime-config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 'window.__HCI_RUNTIME_CONFIG__ = Object.freeze({ terminalBridgeUrl: "${TERMINAL_BRIDGE_URL}", terminalBridgeExecTimeoutSeconds: "${TERMINAL_BRIDGE_EXEC_TIMEOUT_SECONDS}" });';
    }

    # Vue Router history 模式
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # 诊断证据分片使用 UI 同源地址，但绕过 API Gateway（接口网关）直达数据面。
    # 关闭请求缓冲，避免 Nginx 先把整个分片写入临时文件；单片协议上限为 64 MiB。
    location /api/direct/diagnosis-uploads/ {
        resolver ${DNS_RESOLVER} valid=30s;
        set $upstream http://diagnosis-service:8008;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 64m;
    }

    # API 代理到 gateway（动态 DNS 解析，解决启动时 upstream 未就绪问题）
    location /api/ {
        resolver ${DNS_RESOLVER} valid=30s;  # Docker 嵌入式 DNS（K8s 部署时改为 cluster DNS IP）
        set $upstream http://api-gateway:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 正式环境透传浏览器 OIDC 身份；本地 Compose 由服务端注入开发身份。
        # 内部令牌不得进入静态 JS、浏览器存储或构建日志。
        proxy_set_header Authorization "${CUSTOMER_API_AUTHORIZATION}";
        proxy_set_header X-Tenant-ID "${CUSTOMER_API_TENANT_ID}";
        proxy_set_header X-Actor-ID "${CUSTOMER_API_ACTOR_ID}";

        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # WebSocket 代理到 gateway（动态 DNS 解析）
    location /ws/ {
        resolver ${DNS_RESOLVER} valid=30s;  # Docker 嵌入式 DNS（K8s 部署时改为 cluster DNS IP）
        set $upstream http://api-gateway:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
