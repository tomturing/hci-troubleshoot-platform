server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 使 301/302 重定向发出相对路径（不含 scheme+host），避免 Traefik 反代后浏览器拿到内部地址
    absolute_redirect off;

    # admin-ui 挂在 /admin/ 子路径下（Traefik 不剥离前缀）
    # alias 将 /admin/* 映射到文件系统 /usr/share/nginx/html/*
    # vite base='/admin/' 使得 assets 引用为 /admin/assets/*，同样命中此 location
    location /admin/ {
        alias /usr/share/nginx/html/;
        index index.html;
        # HTML 不缓存，防止路由变更后浏览器使用旧版本
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        # SPA fallback：内部重定向到 /index.html，由下方 location / 最终处理
        try_files $uri $uri/ /index.html;
    }

    # /admin 不带斜线 → 302 重定向（临时，避免浏览器缓存旧 Location）
    location = /admin {
        return 302 /admin/;
    }

    # 根路径：健康检查（kube-probe GET /）和 SPA fallback 最终落点
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # 诊断证据分片使用 UI 同源地址，但绕过 API Gateway（接口网关）直达数据面。
    # 关闭请求缓冲，避免 Nginx 先把整个分片写入临时文件；单片协议上限为 64 MiB。
    location /api/direct/diagnosis-uploads/ {
        resolver ${DNS_RESOLVER} valid=30s;
        set $upstream http://diagnosis-service:8008;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 64m;
    }

    # API 代理到 gateway（动态 DNS 解析，解决启动时 upstream 未就绪问题）
    location /api/ {
        resolver ${DNS_RESOLVER} valid=30s;  # Docker 嵌入式 DNS（K8s 部署时改为 cluster DNS IP）
        set $upstream http://api-gateway:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 正式环境透传浏览器 OIDC 身份；本地 Compose 由服务端注入开发身份，
        # 内部令牌不会进入静态 JS、浏览器存储或构建日志。
        proxy_set_header Authorization "${ADMIN_API_AUTHORIZATION}";
        proxy_set_header X-Tenant-ID "${ADMIN_API_TENANT_ID}";
        proxy_set_header X-Actor-ID "${ADMIN_API_ACTOR_ID}";

        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
