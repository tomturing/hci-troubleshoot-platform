server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 使 301/302 重定向发出相对路径（不含 scheme+host），避免 Traefik 反代后浏览器拿到内部地址
    absolute_redirect off;

    # admin-ui 挂在 /admin/ 子路径下（Traefik 不剥离前缀）
    # alias 将 /admin/* 映射到文件系统 /usr/share/nginx/html/*
    # vite base='/admin/' 使得 assets 引用为 /admin/assets/*，同样命中此 location
    location /admin/ {
        alias /usr/share/nginx/html/;
        index index.html;
        # HTML 不缓存，防止路由变更后浏览器使用旧版本
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        # SPA fallback：内部重定向到 /index.html，由下方 location / 最终处理
        try_files $uri $uri/ /index.html;
    }

    # /admin 不带斜线 → 302 重定向（临时，避免浏览器缓存旧 Location）
    location = /admin {
        return 302 /admin/;
    }

    # 根路径：健康检查（kube-probe GET /）和 SPA fallback 最终落点
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # 诊断证据分片使用 UI 同源地址，但绕过 API Gateway（接口网关）直达数据面。
    # 关闭请求缓冲，避免 Nginx 先把整个分片写入临时文件；单片协议上限为 64 MiB。
    location /api/direct/diagnosis-uploads/ {
        resolver ${DNS_RESOLVER} valid=30s;
        set $upstream ${DIAGNOSIS_SERVICE_UPSTREAM};
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 64m;
    }

    # API 代理到 gateway（动态 DNS 解析，解决启动时 upstream 未就绪问题）
    location /api/ {
        resolver ${DNS_RESOLVER} valid=30s;  # Docker 嵌入式 DNS（K8s 部署时改为 cluster DNS IP）
        # Nginx 的动态 resolver 不使用 Pod 的 DNS search 列表；K8s 必须注入完整 Service FQDN。
        set $upstream ${API_GATEWAY_UPSTREAM};
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 管理 API 反代：透明转发浏览器 Authorization（登录签发的 JWT），不再回退共享内部令牌。
        # 安全重构 L1（SRC 管理台强制认证）：删除"浏览器无凭证则注入共享令牌"的回退，
        # 杜绝管理端身份穿透——未携带有效 JWT 的请求由网关 require_admin 拒绝（401/403）。
        # 前端路由守卫已强制登录后才发起请求，故正常流量恒带 JWT；回退删除后 nginx 不再使用
        # ADMIN_API_AUTHORIZATION（其 chart 注入将在网关后端强制阶段 PR-D 一并清理）。
        # 安全重构 L1（SRC 管理台身份上下文收敛）：X-Tenant-ID / X-Actor-ID 的唯一可信来源
        # 是 api-gateway 对 admin JWT 的派生（routes/diagnosis.py _resigned_upstream_headers：
        # realm=admin → AUTH_DEFAULT_TENANT_ID + user_id）。nginx 既不得静态写死、也不得以
        # $http_* 透传客户端头（透传=把浏览器伪造能力重新引入，比静态注入更危险）。
        # 网关对下游身份头是白名单重建（FORWARDED_REQUEST_HEADERS 不含这两头），故此处不发即安全。
        proxy_set_header Authorization $http_authorization;

        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Docker Compose 的 DSH 与管理台不在同一个容器，必须由管理台提供同源
    # /dsh 反代；Kubernetes 中该路径通常由独立 DSH Ingress 接管，此 location
    # 仍保留作为管理入口直达 DSH Service 的兜底。
    location = /dsh {
        return 302 /dsh/;
    }

    location /dsh/ {
        # Compose 使用 dsh:8080，Kubernetes 使用完整 Service FQDN；两者都通过
        # 动态 resolver 在请求期解析，避免 DSH Service 尚未出现时 admin Nginx 启动失败。
        # Compose 不再使用 host.docker.internal，因此不会触发宿主机 IPv6/端口回环问题。
        resolver ${DNS_RESOLVER} valid=30s;
        set $dsh_upstream ${DSH_UPSTREAM};
        proxy_pass $dsh_upstream;
        proxy_http_version 1.1;
        # 必须保留浏览器原始 Host 端口：Compose 访问是 localhost:3002，
        # 上游 DSH 会用它校验 public-url/Origin；$host 会丢掉 :3002，导致 API/WS 403。
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # HCI 单 Agent 离线诊断实例：与旧 /dsh 使用独立的 Service、会话家目录和
    # public-url。Kubernetes 由独立 DSH Ingress 接管，这里保留同源兜底；Compose
    # 则通过 DSH_OFFLINE_UPSTREAM 连接宿主机 3082 端口。
    location = /dsh-offline {
        return 302 /dsh-offline/;
    }

    location /dsh-offline/ {
        # 与旧 DSH 相同：Compose 使用 dsh-offline:8080，Kubernetes 使用完整 FQDN，
        # 均在请求期解析，保持独立 release 启停时 admin-ui 自身可用。
        resolver ${DNS_RESOLVER} valid=30s;
        set $dsh_offline_upstream ${DSH_OFFLINE_UPSTREAM};
        proxy_pass $dsh_offline_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Session BI 前端使用绝对路径 /api/deepseek-harness-session-bi/*，不会自动
    # 带上 /dsh-offline/ 前缀。返回 307 保留 GET/POST 方法和请求体，把它改写到
    # DSH 自己的前缀下；浏览器会携带 Path=/dsh-offline/ 的 DSH Cookie，
    # 同时避免把高权限 DSH Cookie 扩大到整个平台 /api/ 路径。
    location /api/deepseek-harness-session-bi/ {
        return 307 /dsh-offline$request_uri;
    }

    # 工单日志同步服务：跑在宿主机（systemd + uvicorn :18080），不是集群内 Service，
    # 因此按节点 IP 直连。proxy_pass 末尾的 / 会剥掉 /ticket-sync/ 前缀，
    # 使后端仍看到它在本地开发时的 /jobs、/health 路径。
    location /ticket-sync/ {
        proxy_pass ${TICKET_SYNC_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 同源转发登录 JWT：同步服务本身不校验，但保持与其他管理接口一致的请求形态。
        proxy_set_header Authorization $http_authorization;
        # 单次请求都是轻量的受理/查进度，不需要为它保留长超时。
        proxy_read_timeout 30s;
    }

    # Docker Compose / 本地仿真入口。Kubernetes 中该路径会由 Ingress 直接
    # 路由到受管 terminal-bridge；本地则由 Admin UI 同源反代到桌面 Bridge，
    # 从而与前端固定的 /terminal-bridge 契约保持一致。
    location /terminal-bridge {
        # 这里必须让 Nginx 启动期通过 libc 解析 upstream。若改为变量式
        # proxy_pass，Nginx 会绕过容器 /etc/hosts 中 Docker Desktop 注入的
        # host.docker.internal，最终把本地 WebSocket 错误地变成 502。
        proxy_pass ${TERMINAL_BRIDGE_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
