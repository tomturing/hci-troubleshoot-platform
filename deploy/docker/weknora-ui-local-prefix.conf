# 本地 Compose 专用：把 /weknora/ 前缀剥掉后转发给镜像自带的 80 端口 server。
#
# 为什么需要这一层：前缀版 UI 镜像以 VITE_BASE_PATH=/weknora/ 构建，静态资源引用与
# axios baseURL 都自带 /weknora/ 前缀。集群里这层前缀由 admin-ui nginx 剥掉
# （frontend/admin/nginx.conf 的 location /weknora/），本地 Compose 没有 admin-ui
# 那一层，直连容器会出两类故障：
#   1. /weknora/assets/*.js 落到 SPA 兜底，返回 index.html，MIME 变成 text/html → 白屏；
#   2. /weknora/api/* 不会被反代到 weknora-app，前端所有请求 404。
# 这里用与 admin-ui 相同的做法（strip 前缀 → 反代）补齐，使本地 18080 与线上经
# admin-ui 访问的行为等价。
#
# 挂载点由 deploy/docker/docker-compose.weknora.yml 声明；Helm 部署不加载本文件，
# 集群里仍由 admin-ui nginx 承担同一职责。

# 两层 nginx 串联时 WebSocket 需要显式传递 Upgrade；map 必须定义在 http 上下文，
# 而 conf.d/*.conf 正是被 include 在 http 内。
map $http_upgrade $weknora_local_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8081;
    server_name _;

    # 外层只做透传，真正的分路由上限（知识库 50M / 技能包 512M）在镜像自带的
    # /etc/nginx/conf.d/default.conf 里按 location 生效，这里不能设得比它小。
    client_max_body_size 512m;

    location = /weknora {
        return 302 /weknora/;
    }

    location /weknora/ {
        rewrite ^/weknora/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $weknora_local_connection_upgrade;
        # 会话流式输出与沙箱终端都是长连接，必须关掉缓冲并放宽读超时。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
