services:
  # ============================================================
  # db-migrate — 声明式 Schema 迁移（每次启动自动执行）
  # 与 Helm db-migrate Job 使用相同的 Dockerfile.migrations 镜像
  # 通过 volume 挂载本地文件，schema 变更无需重新构建镜像
  # ============================================================
  db-migrate:
    build:
      context: ../..
      dockerfile: Dockerfile.migrations
      args:
        # 与 Helm / CI 的 build-push-action 保持同源：Dockerfile.migrations 默认 MIRROR_MODE=on
        # （阿里云源，供国内本地开发）；GitHub 托管 Runner 在海外，必须显式传 off 走官方源，
        # 否则阿里云 CDN 边缘同步滞后时会命中 apk "HTTP 404" 而阻断构建。
        MIRROR_MODE: ${MIRROR_MODE:-on}
    container_name: hci-db-migrate
    environment:
      # 迁移工具必须使用 libpq URL，禁止复用后端服务的 postgresql+asyncpg:// DATABASE_URL。
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://${POSTGRES_USER:-hci_admin}:${POSTGRES_PASSWORD:-dev_password_123}@postgres:5432/${POSTGRES_DB:-hci_troubleshoot}?sslmode=disable}
      # DEV_URL：Atlas 规范化 SQL 所需的空数据库（与 Helm initContainer 一致：独立 atlas_dev 数据库）
      DEV_URL: ${MIGRATION_DEV_URL:-postgres://${POSTGRES_USER:-hci_admin}:${POSTGRES_PASSWORD:-dev_password_123}@postgres:5432/atlas_dev?sslmode=disable}
    # 覆盖 ENTRYPOINT：与 Helm initContainer + PreSync/PostSync 逻辑一致
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo ">>> 初始化 Atlas dev 数据库..."
        # 创建 atlas_dev 数据库（幂等）
        psql "$$DATABASE_URL" -tc \
          "SELECT 1 FROM pg_database WHERE datname='atlas_dev';" \
          | grep -q 1 || \
          psql "$$DATABASE_URL" -c "CREATE DATABASE atlas_dev;"
        # 为 atlas_dev 安装必要扩展（desired_schema.sql 使用 vector/pgcrypto 类型）
        psql "$$DEV_URL" -c "
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
        "
        echo ">>> 开始数据库迁移（PreSync 等价）..."
        /db-migrate.sh
        echo ">>> 加载种子数据（PostSync 等价）..."
        for f in /seeds/*.sql; do
          echo "  执行: $$(basename $$f)"
          psql -v ON_ERROR_STOP=1 "$$DATABASE_URL" -f "$$f"
        done
        echo ">>> 数据库就绪"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 挂载本地 schema/种子文件覆盖镜像内版本，本地修改实时生效
      # 注意：脚本不挂载（使用镜像内已 chmod +x 的版本，脚本变更频率低）
      - ../../database/desired_schema.sql:/desired_schema.sql:ro
      - ../../database/desired_extras.sql:/desired_extras.sql:ro
      - ../../database/data-migrations/:/data-migrations/:ro
      - ../../database/seeds/:/seeds/:ro
    restart: "no"
    networks:
      - hci-troubleshoot-platform_default

  postgres:
    image: pgvector/pgvector:pg15
    container_name: hci-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hci_troubleshoot}
      POSTGRES_USER: ${POSTGRES_USER:-hci_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
    ports:
      - 15432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hci_admin} -d ${POSTGRES_DB:-hci_troubleshoot}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hci-troubleshoot-platform_default

  redis:
    image: redis:7
    container_name: hci-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hci-troubleshoot-platform_default

  api-gateway:
    build:
      context: ../..
      dockerfile: backend/api-gateway/Dockerfile
      args:
        MIRROR_MODE: ${MIRROR_MODE:-on}
    container_name: hci-api-gateway
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://hci_admin:dev_password_123@postgres:5432/hci_troubleshoot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CASE_SERVICE_URL: ${CASE_SERVICE_URL:-http://case-service:8001}
      CONVERSATION_SERVICE_URL: ${CONVERSATION_SERVICE_URL:-http://conversation-service:8002}
      SCHEDULER_SERVICE_URL: ${SCHEDULER_SERVICE_URL:-http://scheduler-service:8003}
      KB_SERVICE_URL: ${KB_SERVICE_URL:-http://kb-service:8004}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://agent-service:8005}
      DIAGNOSIS_SERVICE_URL: ${DIAGNOSIS_SERVICE_URL:-http://diagnosis-service:8008}
      DSH_SERVICE_URL: ${DSH_SERVICE_URL:-http://dsh:8080}
      DSH_PUBLIC_PATH: ${DSH_PUBLIC_PATH:-/dsh/}
      DSH_OFFLINE_SERVICE_URL: ${DSH_OFFLINE_SERVICE_URL:-http://dsh-offline:8080}
      DSH_OFFLINE_PUBLIC_PATH: ${DSH_OFFLINE_PUBLIC_PATH:-/dsh-offline/}
      DIAGNOSIS_IDENTITY_MODE: ${DIAGNOSIS_IDENTITY_MODE:-internal}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:3002}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-hci-dev-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      diagnosis-service:
        condition: service_healthy
    volumes:
      - ../../backend/api-gateway:/app
      - ../../backend/shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - hci-troubleshoot-platform_default

  auth-service:
    build:
      context: ../..
      dockerfile: backend/auth-service/Dockerfile
      args:
        MIRROR_MODE: ${MIRROR_MODE:-on}
    container_name: hci-auth-service
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://hci_admin:dev_password_123@postgres:5432/hci_troubleshoot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-hci-dev-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../backend/auth-service:/app
      - ../../backend/shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8007 --reload
    networks:
      - hci-troubleshoot-platform_default

  case-service:
    build:
      context: ../..
      dockerfile: backend/case-service/Dockerfile
      args:
        MIRROR_MODE: ${MIRROR_MODE:-on}
    container_name: hci-case-service
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://hci_admin:dev_password_123@postgres:5432/hci_troubleshoot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CASE_SERVICE_URL: ${CASE_SERVICE_URL:-http://case-service:8001}
      CONVERSATION_SERVICE_URL: ${CONVERSATION_SERVICE_URL:-http://conversation-service:8002}
      SCHEDULER_SERVICE_URL: ${SCHEDULER_SERVICE_URL:-http://scheduler-service:8003}
      KB_SERVICE_URL: ${KB_SERVICE_URL:-http://kb-service:8004}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://agent-service:8005}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-hci-dev-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../backend/case-service:/app
      - ../../backend/shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - hci-troubleshoot-platform_default

  diagnosis-service:
    build:
      context: ../..
      dockerfile: backend/diagnosis-service/Dockerfile
      args:
        MIRROR_MODE: ${MIRROR_MODE:-on}
    container_name: hci-diagnosis-service
    environment:
      PYTHONPATH: /app
      SERVICE_PORT: 8008
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://hci_admin:dev_password_123@postgres:5432/hci_troubleshoot}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-hci-dev-internal-token}
      IDENTITY_MODE: ${DIAGNOSIS_IDENTITY_MODE:-internal}
      OIDC_PUBLIC_KEY_PEM_B64: ${OIDC_PUBLIC_KEY_PEM_B64:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      # 公开的确定性开发密钥仅用于本地闭环；生产 Helm 必须通过独立 Secret 注入真实密钥。
      COLLECTOR_SIGNING_PRIVATE_KEY_B64: ${COLLECTOR_SIGNING_PRIVATE_KEY_B64:-eIykAEAZ0PyOgbBAkK+pPj2nQAvqAsnOz0qrdFD7FjQ=}
      COLLECTOR_SIGNING_KEY_ID: ${COLLECTOR_SIGNING_KEY_ID:-local-dev-collector-signing-v1}
      DIAGNOSIS_ENCRYPTION_PRIVATE_KEY_B64: ${DIAGNOSIS_ENCRYPTION_PRIVATE_KEY_B64:-}
      DIAGNOSIS_ENCRYPTION_KEY_ID: ${DIAGNOSIS_ENCRYPTION_KEY_ID:-}
      DIAGNOSIS_OBJECT_STORAGE_ROOT: /var/lib/hci-diagnosis
      # 返回相对地址，浏览器从 Customer/Admin UI 同源上传，Nginx 再直达诊断服务数据面。
      DIAGNOSIS_DIRECT_UPLOAD_BASE_URL: ${DIAGNOSIS_DIRECT_UPLOAD_BASE_URL:-/}
      DIAGNOSIS_ALLOWED_ORIGINS: ${DIAGNOSIS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:3002}
      DIAGNOSIS_OBJECT_STORAGE_MODE: local
      DIAGNOSIS_ENABLE_AUTOMATIC_SUPPLEMENT: ${DIAGNOSIS_ENABLE_AUTOMATIC_SUPPLEMENT:-false}
      DIAGNOSIS_WORKER_METRICS_PORT: 9108
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-server:3000}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../backend/diagnosis-service:/app
      - ../../backend/shared:/app/shared
      - diagnosis_data:/var/lib/hci-diagnosis
    ports:
      - "18008:8008"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8008/health/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8008 --reload
    networks:
      - hci-troubleshoot-platform_default

  diagnosis-worker:
    build:
      context: ../..
      dockerfile: backend/diagnosis-service/Dockerfile
      args:
        MIRROR_MODE: ${MIRROR_MODE:-on}
    container_name: hci-diagnosis-worker
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://hci_admin:dev_password_123@postgres:5432/hci_troubleshoot}
      DIAGNOSIS_ENCRYPTION_PRIVATE_KEY_B64: ${DIAGNOSIS_ENCRYPTION_PRIVATE_KEY_B64:-}
      DIAGNOSIS_ENCRYPTION_KEY_ID: ${DIAGNOSIS_ENCRYPTION_KEY_ID:-}
      DIAGNOSIS_OBJECT_STORAGE_ROOT: /var/lib/hci-diagnosis
      DIAGNOSIS_OBJECT_STORAGE_MODE: local
      DIAGNOSIS_ENABLE_AUTOMATIC_SUPPLEMENT: ${DIAGNOSIS_ENABLE_AUTOMATIC_SUPPLEMENT:-false}
    depends_on:
      postgres:
        condition: service_healthy
      diagnosis-service:
        condition: service_healthy
    volumes:
      - ../../backend/diagnosis-service:/app
      - ../../backend/shared:/app/shared
      - diagnosis_data:/var/lib/hci-diagnosis
    tmpfs:
      # 解密后的明文只进入临时内存文件系统，容器停止即消失。
      - /var/lib/hci-diagnosis/work:size=2147483648,mode=0700
    command: python -m app.worker
    restart: unless-stopped
    networks:
      - hci-troubleshoot-platform_default

  conversation-service:
    build:
      context: ../..
      dockerfile: backend/conversation-service/Dockerfile
      args:
        MIRROR_MODE: ${MIRROR_MODE:-on}
    container_name: hci-conversation-service
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://hci_admin:dev_password_123@postgres:5432/hci_troubleshoot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CASE_SERVICE_URL: ${CASE_SERVICE_URL:-http://case-service:8001}
      CONVERSATION_SERVICE_URL: ${CONVERSATION_SERVICE_URL:-http://conversation-service:8002}
      SCHEDULER_SERVICE_URL: ${SCHEDULER_SERVICE_URL:-http://scheduler-service:8003}
      KB_SERVICE_URL: ${KB_SERVICE_URL:-http://kb-service:8004}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://agent-service:8005}
      KB_ENABLED: ${KB_ENABLED:-true}
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.1}"
      LLM_TEMPERATURE_S0: "${LLM_TEMPERATURE_S0:-0.3}"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-hci-dev-internal-token}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kb-service:
        condition: service_healthy
    volumes:
      - ../../backend/conversation-service:/app
      - ../../backend/shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    networks:
      - hci-troubleshoot-platform_default

  scheduler-service:
    build:
      context: ../..
      dockerfile: backend/scheduler-service/Dockerfile
      args:
        MIRROR_MODE: ${MIRROR_MODE:-on}
    container_name: hci-scheduler-service
    environment:
      PYTHONPATH: /app
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      K8S_NAMESPACE: ${K8S_NAMESPACE:-hci-troubleshoot}
      CASE_SERVICE_URL: ${CASE_SERVICE_URL:-http://case-service:8001}
      CONVERSATION_SERVICE_URL: ${CONVERSATION_SERVICE_URL:-http://conversation-service:8002}
      SCHEDULER_SERVICE_URL: ${SCHEDULER_SERVICE_URL:-http://scheduler-service:8003}
      KB_SERVICE_URL: ${KB_SERVICE_URL:-http://kb-service:8004}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://agent-service:8005}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-hci-dev-internal-token}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../backend/scheduler-service:/app
      - ../../backend/shared:/app/shared
      - /var/run/docker.sock:/var/run/docker.sock # For local dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload
    networks:
      - hci-troubleshoot-platform_default

  kb-service:
    build:
      context: ../..
      dockerfile: backend/kb-service/Dockerfile
      args:
        MIRROR_MODE: ${MIRROR_MODE:-on}
    container_name: hci-kb-service
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://hci_admin:dev_password_123@postgres:5432/hci_troubleshoot}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://coding.dashscope.aliyuncs.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      CASE_SERVICE_URL: ${CASE_SERVICE_URL:-http://case-service:8001}
      CONVERSATION_SERVICE_URL: ${CONVERSATION_SERVICE_URL:-http://conversation-service:8002}
      SCHEDULER_SERVICE_URL: ${SCHEDULER_SERVICE_URL:-http://scheduler-service:8003}
      KB_SERVICE_URL: ${KB_SERVICE_URL:-http://kb-service:8004}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://agent-service:8005}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-hci-dev-internal-token}
      VISION_MODEL: ${VISION_MODEL:-}
      LLM_VISION_BASE_URL: ${LLM_VISION_BASE_URL:-}
      LLM_VISION_API_KEY: ${LLM_VISION_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120.0}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-false}
      VISION_MAX_TOKENS: ${VISION_MAX_TOKENS:-8192}
      VISION_LLM_MAX_ATTEMPTS: ${VISION_LLM_MAX_ATTEMPTS:-2}
      VISION_GLOBAL_CONCURRENCY: ${VISION_GLOBAL_CONCURRENCY:-3}
      LLM_GLOBAL_CONCURRENCY: ${LLM_GLOBAL_CONCURRENCY:-3}
      CLASSIFY_MODEL: ${CLASSIFY_MODEL:-}
      CLASSIFY_BASE_URL: ${CLASSIFY_BASE_URL:-}
      CLASSIFY_API_KEY: ${CLASSIFY_API_KEY:-}
      CLASSIFY_MAX_TOKENS: ${CLASSIFY_MAX_TOKENS:-2048}
      EXTRACT_SIGNALS_MODEL: ${EXTRACT_SIGNALS_MODEL:-}
      EXTRACT_SIGNALS_BASE_URL: ${EXTRACT_SIGNALS_BASE_URL:-}
      EXTRACT_SIGNALS_API_KEY: ${EXTRACT_SIGNALS_API_KEY:-}
      EXTRACT_SIGNALS_MAX_TOKENS: ${EXTRACT_SIGNALS_MAX_TOKENS:-16384}
      EXTRACT_SIGNALS_FORMAT_MAX_ATTEMPTS: ${EXTRACT_SIGNALS_FORMAT_MAX_ATTEMPTS:-2}
      KBD_BATCH_STALE_AFTER_SECONDS: ${KBD_BATCH_STALE_AFTER_SECONDS:-600}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-server:3000}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-true}
      LANGFUSE_CAPTURE_EXTRACT_SIGNALS_CONTENT: ${LANGFUSE_CAPTURE_EXTRACT_SIGNALS_CONTENT:-true}
    ports:
      - "18004:8004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../backend/kb-service:/app
      - ../../backend/shared:/app/shared
      - ../../backend/kb-service/config:/data/config:ro             # jieba 词典等配置（只读）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload
    networks:
      - hci-troubleshoot-platform_default

  agent-service:
    build:
      context: ../..
      dockerfile: backend/agent-service/Dockerfile
      args:
        MIRROR_MODE: ${MIRROR_MODE:-on}
    container_name: hci-agent-service
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://hci_admin:dev_password_123@postgres:5432/hci_troubleshoot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      CASE_SERVICE_URL: ${CASE_SERVICE_URL:-http://case-service:8001}
      CONVERSATION_SERVICE_URL: ${CONVERSATION_SERVICE_URL:-http://conversation-service:8002}
      SCHEDULER_SERVICE_URL: ${SCHEDULER_SERVICE_URL:-http://scheduler-service:8003}
      KB_SERVICE_URL: ${KB_SERVICE_URL:-http://kb-service:8004}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://agent-service:8005}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-hci-dev-internal-token}
      KB_ENABLED: ${KB_ENABLED:-true}
      REACT_ENABLED: ${REACT_ENABLED:-false}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-server:3000}
      GLM_MODEL: ${GLM_MODEL:-deepseek-v4-flash}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-deepseek-v4-flash}
      AI_DEFAULT_ASSISTANT_TYPE: ${AI_DEFAULT_ASSISTANT_TYPE:-htp-agent}
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.1}"
      LLM_TEMPERATURE_S0: "${LLM_TEMPERATURE_S0:-0.3}"
      LLM_TEMPERATURE_REACT: "${LLM_TEMPERATURE_REACT:-0.0}"
      LLM_TOP_P: "${LLM_TOP_P:-0.3}"
      LLM_LOGPROBS: "${LLM_LOGPROBS:-false}"
      LLM_TOP_LOGPROBS: "${LLM_TOP_LOGPROBS:-0}"
      ASSISTANT_REGISTRY_JSON: ${ASSISTANT_REGISTRY_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kb-service:
        condition: service_healthy
    volumes:
      - ../../backend/agent-service:/app
      - ../../backend/shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005 --reload
    networks:
      - hci-troubleshoot-platform_default

  # ============ DSH（DeepSeek Harness）====================================
  # dsh 仍只监听共享网络命名空间内的 127.0.0.1:3080；nginx sidecar 使用
  # network_mode: service:dsh 共享该 loopback，admin-ui 通过 Compose 网络访问 sidecar。
  dsh:
    # 当前 DSH 0.2.1-rc.2 的 ARM64 原生 binding 不完整，生产目标固定 Linux x86。
    platform: linux/amd64
    # 旧、新两个 DSH 服务共用同一份镜像；profile、插件、家目录和 token 仍由各自服务隔离。
    image: docker-dsh:latest
    build:
      context: ../..
      dockerfile: dsh/Dockerfile
      args:
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.2}
        # 本地开发使用国内 npm 镜像；CI 不经过 Compose，Dockerfile 默认走官方源。
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: hci-dsh
    entrypoint: ["/usr/local/bin/docker-compose-entrypoint.sh"]
    environment:
      DSH_PORT: 3080
      DSH_PROFILE: ${DSH_PROFILE:-web}
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:-http://localhost:3002/dsh/}
      DSH_TRUSTED_HOST: ${DSH_TRUSTED_HOST:-localhost}
      DSH_QWEN_API_KEY: ${DSH_QWEN_API_KEY:-}
      DSH_LLM_PROVIDER_ID: ${DSH_LLM_PROVIDER_ID:-aliyun-maas}
      DSH_LLM_API: ${DSH_LLM_API:-openai-completions}
      DSH_LLM_BASE_URL: ${DSH_LLM_BASE_URL:-https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      DSH_LLM_MODEL: ${DSH_LLM_MODEL:-qwen3.8-flash}
      DSH_PLUGIN_PACKAGES: ${DSH_PLUGIN_PACKAGES:-/opt/dsh-plugins/deepseek-harness-wecom-offline-0.1.22.tgz}
      WECOM_BOT_ID: ${WECOM_BOT_ID:-}
      WECOM_BOT_SECRET: ${WECOM_BOT_SECRET:-}
      WECOM_WORKSPACE_ROOT: ${WECOM_WORKSPACE_ROOT:-/work/wecom}
    volumes:
      - dsh_home:/home/dsh
      - dsh_workspace:/work
      - dsh_token:/run/dsh
      # 本地插件源码直接覆盖镜像内目录，不需要发布 npm；DSH_PLUGIN_PACKAGES
      # 使用 /opt/dsh-plugins/<插件目录> 指向这里的子目录。
      - ../../dsh/plugins:/opt/dsh-plugins:ro
      - ${DSH_CUSTOMER_LOGS_PATH:-../../dsh/data/customer-logs}:/data/customer-logs:ro
      - ${DSH_TICKETS_PATH:-../../dsh/data/tickets}:/data/tickets:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - hci-troubleshoot-platform_default

  dsh-proxy:
    platform: linux/amd64
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: hci-dsh-proxy
    network_mode: service:dsh
    depends_on:
      dsh:
        condition: service_started
    volumes:
      - ../../dsh/docker-compose-nginx.conf:/etc/nginx/nginx.conf:ro
      - dsh_token:/run/dsh:ro

  # ============ 前端服务 ============

  customer-ui:
    environment:
      - DNS_RESOLVER=127.0.0.11
      - TERMINAL_BRIDGE_URL=${TERMINAL_BRIDGE_URL:-}
      - TERMINAL_BRIDGE_EXEC_TIMEOUT_SECONDS=${TERMINAL_BRIDGE_EXEC_TIMEOUT_SECONDS:-120}
      # B1（SRC-2026-5358）：Customer UI 不再注入服务端身份。客户身份由 API Gateway
      # 依据服务端签发的身份 Cookie 重签，与 K8s 部署行为保持一致。
    build:
      context: ../..
      dockerfile: frontend/customer/Dockerfile
    container_name: hci-customer-ui
    ports:
      - "3001:80"
    depends_on:
      - api-gateway
    networks:
      - hci-troubleshoot-platform_default

  # ============ HCI 单 Agent 离线诊断 DSH ================================
  # 与旧 dsh 使用独立家目录、工作区、token 卷和网络别名；两套 profile 可同时运行。
  dsh-offline:
    platform: linux/amd64
    # 与旧 dsh 共用已由 compose-build-services 构建的镜像，支持 dev-up 的 --no-build。
    image: docker-dsh:latest
    build:
      context: ../..
      dockerfile: dsh/Dockerfile
      args:
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.2}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: hci-dsh-offline
    entrypoint: ["/usr/local/bin/docker-compose-entrypoint.sh"]
    environment:
      # 容器内端口固定为 3080；由同网络的 dsh-offline-proxy 承载访问。
      DSH_PORT: 3080
      # 以下 DSH_* 变量由 DSH_OFFLINE_* 宿主机配置映射而来，避免与旧 dsh 共用配置。
      DSH_PROFILE: ${DSH_OFFLINE_PROFILE:-web}
      DSH_PUBLIC_URL: ${DSH_OFFLINE_PUBLIC_URL:-http://localhost:3002/dsh-offline/}
      DSH_TRUSTED_HOST: ${DSH_OFFLINE_TRUSTED_HOST:-localhost}
      DSH_QWEN_API_KEY: ${DSH_OFFLINE_QWEN_API_KEY:-}
      DSH_LLM_PROVIDER_ID: ${DSH_OFFLINE_LLM_PROVIDER_ID:-aliyun-maas}
      DSH_LLM_API: ${DSH_OFFLINE_LLM_API:-openai-completions}
      DSH_LLM_BASE_URL: ${DSH_OFFLINE_LLM_BASE_URL:-https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      DSH_LLM_MODEL: ${DSH_OFFLINE_LLM_MODEL:-qwen3.8-flash}
      DSH_PLUGIN_PACKAGES: ${DSH_OFFLINE_PLUGIN_PACKAGES:-/opt/dsh-plugins/deepseek-harness-wecom-0.1.33.tgz /opt/dsh-plugins/deepseek-harness-session-bi-0.1.21.tgz /opt/dsh-plugins/hci-offline-diagnosis-bundle-0.4.1.tgz}
      # 插件读取的容器内变量；值分别来自新实例独立的 DSH_OFFLINE_* 配置。
      WECOM_BOT_ID: ${DSH_OFFLINE_WECOM_BOT_ID:-}
      WECOM_BOT_SECRET: ${DSH_OFFLINE_WECOM_BOT_SECRET:-}
      WECOM_WORKSPACE_ROOT: ${DSH_OFFLINE_WECOM_WORKSPACE_ROOT:-/data/tickets}
      WECOM_RULE_WORKSPACE_ROOT: ${DSH_OFFLINE_WECOM_RULE_WORKSPACE_ROOT:-/home/dsh/.dsh/session-bi/work-ticket-rules}
      WECOM_AGENT_PRESET: ${DSH_OFFLINE_WECOM_AGENT_PRESET:-hci-offline}
      # HCI bundle 的知识根目录；支持包由 WECOM_WORKSPACE_ROOT 的会话工单目录绑定，
      # Session BI 目录由独立 DSH_HOME 的插件默认值派生。
      HCI_KNOWLEDGE_ROOT: ${DSH_OFFLINE_HCI_KNOWLEDGE_ROOT:-/data/tickets/knowledge}
    volumes:
      - dsh_offline_home:/home/dsh
      - dsh_offline_workspace:/work
      - dsh_offline_token:/run/dsh
      # 插件制品只读挂载；路径必须与 DSH_OFFLINE_PLUGIN_PACKAGES 对应。
      - ../../dsh/plugins:/opt/dsh-plugins:ro
      # 客户日志是宿主机路径，容器内固定为只读 /data/customer-logs。
      - ${DSH_OFFLINE_CUSTOMER_LOGS_PATH:-../../dsh/data/customer-logs}:/data/customer-logs:ro
      # 工单宿主机路径挂载到 WECOM_WORKSPACE_ROOT；两者必须保持同一容器路径。
      - ${DSH_OFFLINE_TICKETS_PATH:-../../dsh/data/tickets}:${DSH_OFFLINE_WECOM_WORKSPACE_ROOT:-/data/tickets}:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - hci-troubleshoot-platform_default

  dsh-offline-proxy:
    platform: linux/amd64
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: hci-dsh-offline-proxy
    network_mode: service:dsh-offline
    depends_on:
      dsh-offline:
        condition: service_started
    volumes:
      - ../../dsh/docker-compose-nginx-offline.conf:/etc/nginx/nginx.conf:ro
      - dsh_offline_token:/run/dsh:ro

  admin-ui:
    environment:
      - DNS_RESOLVER=127.0.0.11
      # admin-ui 与两个 DSH sidecar 共用 Compose 网络，直接走服务名，避免经宿主机
      # 发布端口回环导致 host.docker.internal 的 IPv6/IPv4 选择和端口转发差异。
      - DSH_UPSTREAM=${DSH_UPSTREAM:-http://dsh:8080}
      - DSH_OFFLINE_UPSTREAM=${DSH_OFFLINE_UPSTREAM:-http://dsh-offline:8080}
      # Admin 仿真页面固定使用同源 /terminal-bridge；Nginx 在本地转发到桌面 Bridge。
      - TERMINAL_BRIDGE_UPSTREAM=http://host.docker.internal:9999
      # 本地管理入口由 Nginx 服务端注入开发身份，禁止把内部令牌打包进浏览器静态资源。
      # 安全重构 L1：删除 ADMIN_API_TENANT_ID/ADMIN_API_ACTOR_ID——管理台身份上下文改由网关从
      # admin JWT 派生，Nginx 不再注入/透传 X-Tenant-ID/X-Actor-ID（与集群 Helm 形态保持一致）。
      - ADMIN_API_AUTHORIZATION=Bearer ${INTERNAL_API_TOKEN:-hci-dev-internal-token}
    build:
      context: ../..
      dockerfile: frontend/admin/Dockerfile
    container_name: hci-admin-ui
    ports:
      - "3002:80"
    depends_on:
      - api-gateway
      - dsh-proxy
      - dsh-offline-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hci-troubleshoot-platform_default

volumes:
  postgres_data:
  redis_data:
  diagnosis_data:
  dsh_home:
  dsh_workspace:
  dsh_token:
  dsh_offline_home:
  dsh_offline_workspace:
  dsh_offline_token:

networks:
  hci-troubleshoot-platform_default:
    name: hci-troubleshoot-platform_default
    external: true
