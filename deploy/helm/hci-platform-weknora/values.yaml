# HCI 平台 vendored 副本 — WeKnora Helm Chart Values
#
# 来源：https://github.com/Tencent/WeKnora/helm/values.yaml @ v0.9.0
# 平台化改动（其余保持上游原样，便于升级时 diff）：
#   - 支持 global.imageRegistry 私有镜像前缀；直拉/镜像副本由环境仓 values 决定
#   - 关闭 chart 自带 Ingress：/weknora/ 由 admin-ui 同源反代 + 前缀剥离
#   - 资源上限按单节点 staging 收敛
#   - 新增 imagePullSecret / embed 两段平台参数
#   - 补齐 full 形态（核心服务 + Neo4j + MinIO）的可部署模板
#
# 环境级密钥、模型 key、embed token 一律由 hci-platform-env 注入，
# 本文件只放结构与安全默认值。
#
# Best Practices References:
# - https://helm.sh/docs/chart_best_practices/values/
# - https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
# - https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml

# -- Global configuration shared across all components
# @default -- See values.yaml
global:
  # -- 私有镜像仓库前缀（须以 / 结尾）。由环境仓库注入，
  # 例如 "ghcr.io/tomturing/hci-troubleshoot-platform/"。空值时下面的
  # repository 被视为完整地址（本地 helm template 调试用）。
  # 与平台其他 chart 保持同一变量名，回写脚本才能只替换 tag 而不破坏地址。
  imageRegistry: ""
  # -- Storage class for all PersistentVolumeClaims
  # Set to "-" to use cluster default, or specify a storage class name
  storageClass: ""

  # -- Image pull secrets for private registries
  # hci-weknora 是独立命名空间，hci-staging 的 ghcr-pull-secret 不能复用，
  # 由下方 imagePullSecret 段在本命名空间内自行渲染。
  imagePullSecrets:
    - name: ghcr-pull-secret

  # -- Maximum upload size in MB, applied to the frontend (nginx
  # client_max_body_size), the app (upload limit) and docreader (gRPC message
  # limit). Same knob as MAX_FILE_SIZE_MB in docker-compose.yml.
  maxFileSizeMB: 50

  # -- Default security context for all pods
  # Note: Official images (nginx, postgres, redis) run as root by default
  # Enable runAsNonRoot only if using non-root compatible images
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  # -- Default security context for all containers
  # Note: readOnlyRootFilesystem disabled as images require writable filesystem
  containerSecurityContext:
    allowPrivilegeEscalation: false

# =============================================================================
# 平台参数（非上游字段）
# =============================================================================

# ghcr 拉取凭证。hci-weknora 与 hci-staging 跨命名空间，Secret 不能复用，
# 因此在本命名空间自行渲染；token 由 hci-platform-env 注入，仓库不留明文。
imagePullSecret:
  # 同一命名空间内如有第二个 release，可置 false 复用既有 Secret，
  # 避免两个 Application 争抢同名资源。
  create: false
  name: ghcr-pull-secret
  registry: ghcr.io
  username: ""
  token: ""

# 网页嵌入（embed channel）参数。
# 渠道在 WeKnora 控制台「设置 → 网页嵌入」创建，绑定 Agent 与允许域名后，
# 把 channelId 与 em_ 发布令牌注入这里。api-gateway 的
# GET /api/weknora/launch 会用 publishToken 在服务端换取 30 分钟的 ems_ 短令牌，
# 浏览器永远拿不到长期令牌。
#
# 未配置时问答入口返回 503（前端提示"尚未创建知识库问答渠道"），
# 管理台入口仍然可用。
embed:
  channelId: ""
  # em_ 前缀的发布令牌，仅落集群 Secret
  publishToken: ""
  # 允许嵌入的宿主 origin，必须与浏览器地址栏完全一致（含端口），
  # 例如 https://acli.sangfor.com.cn:4443
  origin: ""

# -- ServiceAccount configuration
# Ref: https://helm.sh/docs/chart_best_practices/rbac/
serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- ServiceAccount name (auto-generated if empty)
  name: ""
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Labels to add to the ServiceAccount
  labels: {}
  # -- Automount API credentials for the ServiceAccount
  automountServiceAccountToken: false

# -----------------------------------------------------------------------------
# App (Backend API Server)
# -----------------------------------------------------------------------------
app:
  # -- Enable the app component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  # -- App update strategy. Leave empty to select a safe default from the
  # data-files storage: `Recreate` for a persistent single-writer claim, and
  # `RollingUpdate` when persistence is disabled or `ReadWriteMany` is used.
  # Set this explicitly to override the derived strategy.
  strategy:
    type: ""
    # -- Only used with RollingUpdate; integers and percentages are supported.
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  image:
    # -- Image repository（私有 registry 副本，见 weknora/scripts/sync-upstream-images.sh）
    repository: weknora-app
    # -- Image tag（由 hci-platform-env 注入，必须与上游 tag 一致：v0.9.0）
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  # 上游默认 1Gi 对 Go + 向量检索偏紧，且 OOMKilled 会表现为"上传文档后无响应"，
  # 极难定位；这里给到 2Gi，节点余量足够。
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # -- Pod security context override
  podSecurityContext: {}

  # -- Container security context override
  # Note: App requires write access for file storage
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    allowPrivilegeEscalation: false

  # -- Environment variables for the app container
  # Ref: https://github.com/Tencent/WeKnora/blob/main/docker-compose.yml
  env:
    GIN_MODE: release
    # -- Retrieval driver: postgres, elasticsearch_v7, elasticsearch_v8, qdrant
    RETRIEVE_DRIVER: postgres
    # -- Storage type: local, minio, cos, tos, s3
    STORAGE_TYPE: local
    LOCAL_STORAGE_BASE_DIR: /data/files
    AUTO_RECOVER_DIRTY: "true"
    STREAM_MANAGER_TYPE: redis
    CONCURRENCY_POOL_SIZE: "5"
    TZ: UTC
    # Docker sandbox talks to a local Engine API (often docker.sock = host root).
    # Leave false unless this is a private single-node install that also mounts
    # the daemon socket or points at a remote tcp:// daemon with TLS.
    WEKNORA_SANDBOX_DOCKER_ENABLED: "false"

  # -- Additional environment variables
  extraEnv: []
  # - name: OLLAMA_BASE_URL
  #   value: "http://ollama:11434"

  # -- Service configuration
  service:
    # -- Service name override (empty keeps "app")
    name: ""
    type: ClusterIP
    port: 8080

  # -- Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

  # -- Extra volumes for the app pod. Rendered verbatim into spec.template.spec.volumes.
  # Use together with extraVolumeMounts to mount ConfigMaps/Secrets/PVCs into the app container.
  extraVolumes: []
  # - name: my-config
  #   configMap:
  #     name: my-config

  # -- Extra volume mounts for the app container. Rendered verbatim into the app container's volumeMounts.
  extraVolumeMounts: []
  # - name: my-config
  #   mountPath: /etc/my-config
  #   readOnly: true

  # -- Extra annotations for the app Pod template metadata (not the Deployment
  # metadata). Rendered verbatim into spec.template.metadata.annotations. Use
  # for platform-level sidecar injection or metrics auto-discovery.
  podAnnotations: {}
  #   example.com/sidecar-inject: 'true'

# -----------------------------------------------------------------------------
# Frontend (Web UI)
# -----------------------------------------------------------------------------
frontend:
  # -- Enable the frontend component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  image:
    # -- Image repository
    # 自建前缀镜像（VITE_BASE_PATH=/weknora/），不是上游 wechatopenai/weknora-ui：
    # 上游镜像把静态资源与 API base 固定在站点根，无法挂在 /weknora/ 子路径。
    # 构建定义见 weknora/ui/Dockerfile，tag 由 CI 产出、env 仓库注入。
    repository: weknora-ui
    # -- Image tag（CI 构建的 date-sha；为空时退回 Chart.appVersion，仅用于本地调试）
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Container security context
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    # readOnlyRootFilesystem: true  # Disabled - images require writable fs
    allowPrivilegeEscalation: false

  # -- Service configuration
  service:
    # -- Service name override (empty keeps "frontend")
    name: ""
    type: ClusterIP
    port: 80

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Docreader (Document Parser - gRPC)
# -----------------------------------------------------------------------------
docreader:
  # -- Enable the docreader component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  image:
    # -- Image repository（私有 registry 副本）
    repository: weknora-docreader
    # -- Image tag（由 hci-platform-env 注入）
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  # 文档解析（PDF/Office/OCR）瞬时内存远超 requests，512Mi 上限会把大文件解析
  # 直接 OOMKill 成"文档一直解析中"；这里放宽到 1Gi。
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # -- Container security context
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    allowPrivilegeEscalation: false

  # -- Environment variables
  env:
    STORAGE_TYPE: local

  # -- Service configuration
  service:
    # -- Service name override (empty keeps "docreader")
    name: ""
    type: ClusterIP
    port: 50051

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# PostgreSQL (ParadeDB - Vector + BM25 Search)
# -----------------------------------------------------------------------------
postgresql:
  # -- Enable PostgreSQL
  enabled: true

  service:
    # -- Service name override (empty keeps "postgres")
    name: ""

  image:
    # -- Image repository (ParadeDB for vector search，私有 registry 副本)
    repository: weknora-postgres
    # -- Image tag
    # 与上游 docker-compose.yml 对齐（chart 默认停在 v0.18.9-pg17，
    # 与 0.9.0 的 app 迁移脚本不一致，会在建索引时报扩展版本错误）。
    tag: v0.25.11-pg17

  # -- Resource requests and limits
  # pgvector/pg_bm25 建索引是内存密集操作，512Mi 会直接 OOM 并表现为
  # "知识库创建后一直初始化中"。
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # -- Container security context
  # Note: PostgreSQL requires specific user permissions
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    allowPrivilegeEscalation: false

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Redis (Stream & Task Queue)
# -----------------------------------------------------------------------------
redis:
  # -- Enable Redis
  enabled: true

  service:
    # -- Service name override (empty keeps "redis")
    name: ""

  image:
    # -- Image repository（私有 registry 副本）
    repository: weknora-redis
    # -- Image tag
    tag: 7.0-alpine

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Container security context
  securityContext:
    # runAsNonRoot: true  # Disabled - official images run as root
    # readOnlyRootFilesystem: true  # Disabled - images require writable fs
    allowPrivilegeEscalation: false

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 1Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Data Files Storage
# -----------------------------------------------------------------------------
dataFiles:
  persistence:
    # -- Enable persistence for uploaded files
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Access modes for the created `data-files` claim. The chart's default
    # single-writer claim requires `app.strategy.type: Recreate` (see
    # `app.strategy`); set `ReadWriteMany` here when the storage class supports
    # it (NFS, CephFS, EFS, ...) and the App can keep rolling updates.
    accessModes:
      - ReadWriteOnce
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

# -----------------------------------------------------------------------------
# Ingress Configuration
# -----------------------------------------------------------------------------
ingress:
  # -- Enable ingress
  enabled: false

  # -- Ingress class name
  className: nginx

  # -- Ingress hostname
  host: weknora.example.com

  # -- TLS configuration
  tls:
    # -- Enable TLS
    enabled: false
    # -- TLS secret name
    secretName: ""

  # -- Additional annotations
  # Ref: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# -----------------------------------------------------------------------------
# Secrets Configuration
# -----------------------------------------------------------------------------
# IMPORTANT: Do NOT use default values in production!
# Use --set or external secret management (External Secrets Operator, Vault, etc.)
#
# Example installation:
#   helm install weknora ./helm \
#     --set secrets.dbPassword=<secure-password> \
#     --set secrets.redisPassword=<secure-password> \
#     --set secrets.jwtSecret=<secure-random-string>
#
secrets:
  # -- Database username
  dbUser: postgres
  # -- Database password (REQUIRED: change in production)
  dbPassword: ""
  # -- Database name
  dbName: weknora
  # -- Redis username (OPTIONAL: for Redis 6.0+ ACL)
  redisUsername: ""
  # -- Redis password (REQUIRED: change in production)
  redisPassword: ""
  # -- JWT signing secret (REQUIRED: change in production)
  jwtSecret: ""
  # -- System AES-256 key for database field encryption (must be exactly 32 bytes).
  # Encrypts: tenants.api_key, model API keys, vector store credentials,
  # web search provider keys, WeKnoraCloud.AppSecret.
  # STRONGLY RECOMMENDED to set this explicitly in production. If left empty, a
  # random 32-char value is generated on first install and reused on subsequent
  # `helm upgrade` via Secret lookup. However, if the Secret is ever
  # deleted/recreated (e.g. namespace recreated, GitOps prune, cluster rebuilt)
  # a new random value will be generated and any data encrypted with the old
  # key becomes UNRECOVERABLE (the UI will display ciphertext like "enc:v1:..."
  # instead of plaintext).
  # NOTE: TENANT_AES_KEY is deprecated since v0.4.0 — encryption now uses
  # SYSTEM_AES_KEY exclusively. The Go app no longer reads TENANT_AES_KEY and
  # it has been removed from the Secret.
  systemAesKey: ""

  # -- Use existing secret instead of creating one
  # The secret must contain keys: DB_USER, DB_PASSWORD, DB_NAME, REDIS_USERNAME, REDIS_PASSWORD, JWT_SECRET, SYSTEM_AES_KEY
  existingSecret: ""

# -----------------------------------------------------------------------------
# Optional Components (Profiles from docker-compose)
# -----------------------------------------------------------------------------

# -- MinIO configuration (S3-compatible storage)
# Equivalent to: docker compose --profile minio
minio:
  # -- Enable MinIO
  enabled: false

  service:
    # -- Service 名称覆盖；空值保持 "minio"
    name: ""
    type: ClusterIP
    apiPort: 9000
    consolePort: 9001

  image:
    # -- 私有 registry 副本；上游 v0.9.0 Compose 使用同一固定版本。
    repository: weknora-minio
    tag: RELEASE.2026-08-04T00-00-00Z
    pullPolicy: IfNotPresent

  # -- Root user
  rootUser: minioadmin
  # -- Root password (REQUIRED if enabled)
  rootPassword: ""

  # -- WeKnora app 使用的默认 bucket；MinIO 启动时幂等预建。
  bucketName: weknora
  # -- 可选对象 key 前缀
  pathPrefix: ""
  # -- 集群内 Service 使用明文 HTTP；外部托管 MinIO 才应开启。
  useSSL: "false"

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi

  securityContext:
    allowPrivilegeEscalation: false

  persistence:
    enabled: true
    size: 20Gi
    # -- 复用既有 PVC；空值时由 Chart 创建
    existingClaim: ""

  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Neo4j configuration (Knowledge Graph)
# Equivalent to: docker compose --profile neo4j
# Required for GraphRAG feature (sets NEO4J_ENABLE=true automatically when enabled)
neo4j:
  # -- Enable Neo4j for GraphRAG
  enabled: false

  service:
    # -- Service name override (empty keeps "neo4j")
    name: ""

  image:
    # -- 私有 registry 副本
    repository: weknora-neo4j
    # -- Image tag (matches docker-compose.yml)
    tag: "2025.10.1"

  # -- Neo4j authentication username
  username: neo4j
  # -- Neo4j authentication password (REQUIRED if enabled)
  password: ""

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # -- Container security context
  securityContext:
    allowPrivilegeEscalation: false

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -- Qdrant configuration (Vector Database)
# Equivalent to: docker compose --profile qdrant
qdrant:
  # -- Enable Qdrant as alternative vector store
  enabled: false
  image:
    repository: qdrant/qdrant
    tag: latest
  persistence:
    enabled: true
    size: 10Gi
