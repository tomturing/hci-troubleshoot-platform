# ghcr.io 为私有仓库（匿名拉取 401），必须提供拉取凭证。
#
# 注意：hci-platform chart 只把 ghcr-pull-secret 渲染到 hci-staging，
# 跨命名空间不能复用（Secret 是 namespace 级资源），所以本 chart 在
# hci-weknora 内自行渲染同名 Secret。凭证由 hci-platform-env 注入，
# 本仓库不保存任何真实 token。
{{- if .Values.imagePullSecret.create }}
{{- $username := required "imagePullSecret.username is required when imagePullSecret.create=true" .Values.imagePullSecret.username }}
{{- $token := required "imagePullSecret.token is required when imagePullSecret.create=true" .Values.imagePullSecret.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{"%s":{"username":"%s","password":"%s","auth":"%s"}}}` .Values.imagePullSecret.registry $username $token (printf "%s:%s" $username $token | b64enc) | b64enc }}
{{- end }}
