# =============================================================================
# hci-platform-dsh — DSH（DeepSeek Harness）诊断工作台配置
# 部署目标：namespace hci-dsh（由本 Chart 自行创建）
#
# 上手前必读：docs/solution/events/2026-10-22-DSH诊断集成.md
# 该文档记录了三条不可违背的上游契约，以及本 Chart 为何采用
# 「dsh 绑 loopback + nginx sidecar 反代」的双容器形态。
# =============================================================================

# DSH 部署的命名空间（本 Chart 自行创建）
namespace: hci-dsh

# ======================== 全局路由配置 ========================================
global:
  # 平台对外公开 URL（协议+域名），用于推导 dsh 的 --public-url / --trusted-host
  # 与 Ingress 的 host。由环境仓库 environments/<env>/values.yaml 注入。
  publicUrl: ""
  # 私有镜像仓库前缀（须以 / 结尾），由环境仓库注入，例如
  # "ghcr.io/tomturing/hci-troubleshoot-platform/"。
  # DSH 镜像由本仓库 CI 构建推送，最终地址为 <imageRegistry><repository>:<tag>。
  imageRegistry: ""
  # ghcr.io 为私有仓库，必须提供拉取凭证。
  # 注意：hci-platform chart 只把 credential 渲染到 hci-staging，
  # 而 DSH 位于独立命名空间 hci-dsh，跨命名空间无法复用，
  # 因此本 Chart 需要自行渲染同名 Secret（见 templates/secret.yaml）。
  imagePullSecretName: ""
  imagePullUser: ""

# ======================== 敏感凭据 ===========================================
# 由环境仓库 environments/<env>/values.yaml 注入，本 Chart 只负责用它渲染
# hci-dsh 命名空间内的 ghcr 拉取凭证，不内置任何默认值。
secrets:
  ghcrToken: ""
  # LLM API Key，由环境仓库注入（与环境内其他服务共用同一个 MaaS 凭证）。
  # 本 Chart 用它渲染 hci-dsh 命名空间内的 dsh-llm-credentials，
  # 容器以 dsh.llm.apiKeyEnv 指定的变量名读取。
  llmApiKey: ""

# ======================== Ingress (Traefik) ==================================
ingress:
  enabled: true
  className: traefik
  # /dsh 的挂载路径，必须与 api-gateway 的 DSH_PUBLIC_PATH 保持一致，
  # 且与 dsh 的 --public-url 结尾保持一致。
  path: /dsh
  # 路由优先级需高于主站 / 回退路由，否则 /dsh 会被 customer-ui 吞掉
  # （参照既有取值：grafana 2000、langfuse 3000）
  routerPriority: "2500"
  tls: false
  annotations: {}

# ======================== 网络隔离 ===========================================
# ⚠️ 当前设备 CNI 为 k3s 默认 flannel，NetworkPolicy 不会被强制执行。
# 因此默认关闭——开启只会制造「看起来生效其实没生效」的假象，比不开更危险。
# 集群切换到 Calico/Cilium 后，将 enabled 置 true 即真正生效。
networkPolicy:
  enabled: false
  # 允许访问 DSH 的命名空间：Traefik 所在命名空间（入站）
  ingressNamespaces:
    - kube-system
  # 允许访问 DSH 的命名空间：api-gateway 所在命名空间（取 token）
  clientNamespaces:
    - hci-staging
  # 是否放开出网（DSH 作为 Agent 需要调用外部 LLM API，默认必须放开）
  allowEgress: true

# ======================== DSH 主容器 =========================================
dsh:
  replicaCount: 1
  image:
    # ⚠️ 短名，必须与 CI 构建矩阵的服务名一致（无 hci- 前缀）。
    # 完整地址为 <global.imageRegistry><repository>:<tag>。
    # 若写成完整路径或加 hci- 前缀，会与 CI 推送地址不一致导致 ImagePullBackOff。
    repository: dsh
    # CI 同时推送 <日期-时间-sha7> 与 latest 两个 tag；
    # 环境仓库会由 env-repo-sync 覆写为精确 tag，此处默认取 latest。
    tag: "latest"
    pullPolicy: IfNotPresent
  # dsh 自身监听端口。固定为 127.0.0.1 上的该端口，仅本 Pod 内可达。
  port: 3080
  # ======================== LLM 提供商 ======================================
  # DSH 是 Agent 运行时，没有 LLM 就只能启动、不能干活。
  # 本段会渲染成 $DSH_HOME/profiles/web/cordis.patch.yml
  # （见 templates/configmap-llm.yaml），由 initContainer 播种到家目录卷。
  #
  # ⚠️ 下面三个取值是对目标端点的**实测结论**，不是经验推荐，改动前请重新实测：
  #   1. api 用 openai-completions —— 端点是 /compatible-mode/v1；
  #   2. compat.supportsDeveloperRole 必须为 false —— 端点实测拒绝 developer
  #      角色（400: developer is not one of [system, assistant, user, tool, function]），
  #      pi-ai 对声明了推理能力的模型默认用 developer 角色发系统提示词；
  #   3. max_completion_tokens 端点实测接受，故**不要**覆写 maxTokensField。
  llm:
    enabled: true
    # Provider ID 一旦确定就永久生效（请求、已保存会话、凭据引用都用它），
    # 改名只能新增再删除。
    providerId: aliyun-maas
    # 凭证通过环境变量注入，密钥不落配置文件
    apiKeyEnv: DSH_QWEN_API_KEY
    api: openai-completions
    baseUrl: ""
    model: ""
    # 关闭思维链。qwen3.8-flash 默认思考会让单次调用达到 70s 级，
    # Agent 多轮调用会不可用（环境仓库既有服务也因此统一关闭思维链）。
    # DSH 内置 qwen 思维链格式，off 会下发 enable_thinking=false（已实测端点接受）。
    disableThinking: true

  # 外部 LLM 凭据 Secret 名称（可选）。
  # 本 Chart 已能用 secrets.llmApiKey 自动渲染 dsh-llm-credentials，通常无需设置。
  llmSecretName: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# ======================== nginx 反代 sidecar =================================
# 承担三件 Traefik 做不到的事：
#   1. 剥离 /dsh 前缀（上游只认 origin-root 路由）；
#   2. 还原上游 302 的 Location（Traefik 的 stripPrefix 无法反向补前缀）；
#   3. 把上游 Path=/ 的 cookie 收拢到 /dsh/，避免会话凭据串到 /admin/、/api/。
proxy:
  image:
    # 非 root 变体：以 101 用户运行，与 Pod 的 runAsNonRoot 基线一致
    repository: nginxinc/nginx-unprivileged
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  # 对外与对内的统一端口（Ingress 与 Service 均指向此端口）
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ======================== 客户故障日志挂载 ===================================
# /sf/log 存放客户侧回收的 HCI 故障日志压缩包，DSH 以只读方式读取分析。
#
# 权限说明：该目录实测为 755、属主 support:support(1001)，others 已具备 r-x，
# 因此**只读访问无需任何 securityContext 补充组配置**。
# 同时本 Chart 刻意不在 Pod 级设置 fsGroup：只读卷理论上不会触发 chown，
# 但一旦行为与预期不符，误改该目录属主会直接破坏整条日志回收链路，
# 风险对称性上不值得为了便利去赌。
customerLogs:
  enabled: true
  hostPath: /sf/log
  mountPath: /data/customer-logs
  # ⚠️ 单节点前提：hostPath 与当前节点绑定。集群扩容到多节点后，
  # 必须改为共享存储或配合节点亲和，否则 Pod 被调度到其他节点将读不到日志。

# ======================== 工单日志同步 ======================================
# 「输入工单号 → 从 0.2 同步 → 递归解压 → 设为工作区」的产物目录。
# 刻意用独立 hostPath，而不是复用下面的 workspace(emptyDir 5Gi)：
#   - 工单解到叶子后体积可达压缩包的 20 倍（实测 7MB→139.8MB），
#     5Gi 会被瞬间写满，而 sizeLimit 触顶会让 kubelet 驱逐 Pod；
#   - /sf/log 是只读且属主为 support，既不能写，写坏还会断掉日志回收链路。
# ⚠️ 宿主机必须先预置属主：install -d -m 0750 -o 1000 -g 1000 /sf/tickets
tickets:
  enabled: true
  hostPath: /sf/tickets
  mountPath: /data/tickets
  # 传输实现：http（0.2 只读静态服务，推荐）/ ssh（退路）/ local（测试）
  syncer: http
  sourceUrl: http://192.168.0.2:8081
  # 容量护栏（字节）：单工单上限 20GiB、展开比上界 20x、
  # 单工单解压上限 400GiB、剩余红线 60GiB、本地总量上限 400GiB。
  maxTicketBytes: 21474836480
  expansionFactor: 20
  maxExtractBytes: 429496729600
  minFreeBytes: 64424509440
  maxTotalBytes: 429496729600
  maxFiles: 50000
  maxDepth: 4
  keepTickets: 3
  # zip 密码走 Secret（key: defaultPassword），不写进 values。
  passwordSecretName: dsh-ticket-archive

# ======================== 分析工作区 =========================================
# DSH 解压/分析日志压缩包时的临时可写空间，随 Pod 生命周期释放。
workspace:
  sizeLimit: 5Gi

# ======================== DSH 家目录 =========================================
# 存放 DSH 的凭据与会话。刻意使用 emptyDir 而非 PVC：
#   - 避免为 PVC 引入 fsGroup（会波及只读的 /sf/log，见上）；
#   - 本方案的前端每次进入页面都重新索取 token，Pod 重建导致会话丢失
#     不影响可用性（丢失的只是历史会话，属于已知取舍）。
home:
  sizeLimit: 2Gi
