{{/*
DSH 运行期补丁文件，渲染为 $DSH_HOME/profiles/web/cordis.patch.yml。

为什么一个 ConfigMap 里同时放 LLM 与工单同步：
上游只认 profile 目录下的**单个** `cordis.patch.yml`，entrypoint/initContainer
也只播种这一个文件；拆成两个 ConfigMap 反而需要额外的合并逻辑。

LLM 三个 compat 取值均来自对目标端点的实测，不是经验推荐：
- api=openai-completions：端点是 /compatible-mode/v1；
- supportsDeveloperRole=false：端点实测拒绝 developer 角色
  （400: developer is not one of [system, assistant, user, tool, function]），
  而 pi-ai 对声明了推理能力的模型默认用 developer 角色承载系统提示词；
- thinkingFormat=qwen：DSH 内置的 qwen 思维链格式，off 下发 enable_thinking=false。

注意 'off' 必须加引号：YAML 1.1 会把裸 off 解析成布尔 false，
而这里需要的是字符串键名。
*/}}
{{- if or .Values.dsh.llm.enabled .Values.tickets.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsh-llm-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  cordis.patch.yml: |
    # 由 Helm 渲染，请勿在集群内直接修改。
    # 真实来源：deploy/helm/hci-platform-dsh/values.yaml
{{- if .Values.dsh.llm.enabled }}
    - id: llm-pi-ai
      config:
        providers:
          {{ .Values.dsh.llm.providerId }}:
            apiKeyEnv: {{ .Values.dsh.llm.apiKeyEnv }}
            api: {{ .Values.dsh.llm.api }}
            baseURL: {{ .Values.dsh.llm.baseUrl }}
            compat:
              supportsDeveloperRole: false
              {{- if .Values.dsh.llm.disableThinking }}
              thinkingFormat: qwen
              {{- end }}
            {{- if .Values.dsh.llm.disableThinking }}
            reasoning: 'off'
            {{- end }}
            models:
              - id: {{ .Values.dsh.llm.model }}
                {{- if .Values.dsh.llm.disableThinking }}
                reasoningEfforts:
                  'off':
                {{- end }}
{{- end }}
{{- if .Values.tickets.enabled }}
    # 工单同步：不注入 config 时插件会用 $DSH_HOME/tickets（emptyDir 2Gi），
    # 与 hostPath /data/tickets 完全不搭界 —— 这层映射是必需的，不是可选优化。
    - id: ticket-sync
      config:
        ticketsRoot: {{ .Values.tickets.mountPath }}
        syncer: {{ .Values.tickets.syncer }}
        sourceUrl: {{ .Values.tickets.sourceUrl }}
        maxTicketBytes: {{ int64 .Values.tickets.maxTicketBytes }}
        expansionFactor: {{ int64 .Values.tickets.expansionFactor }}
        maxExtractBytes: {{ int64 .Values.tickets.maxExtractBytes }}
        minFreeBytes: {{ int64 .Values.tickets.minFreeBytes }}
        maxTotalBytes: {{ int64 .Values.tickets.maxTotalBytes }}
        maxFiles: {{ .Values.tickets.maxFiles }}
        maxDepth: {{ .Values.tickets.maxDepth }}
        keepTickets: {{ .Values.tickets.keepTickets }}
{{- end }}
{{- end }}
