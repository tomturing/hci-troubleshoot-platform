{{/*
ghcr.io 私有镜像拉取凭证。

为什么 DSH 需要自己渲染一份：
hci-platform chart 会把 ghcr-pull-secret 渲染到 hci-staging，但 DSH 部署在
独立命名空间 hci-dsh，Secret 不能跨命名空间引用。若不在此处重新渲染，
Pod 会因 ghcr 匿名拉取返回 401 而 ImagePullBackOff。
*/}}
{{- if .Values.secrets.ghcrToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.imagePullSecretName | default "ghcr-pull-secret" }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"ghcr.io\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .Values.global.imagePullUser .Values.secrets.ghcrToken (printf "%s:%s" .Values.global.imagePullUser .Values.secrets.ghcrToken | b64enc) | b64enc }}
{{- end }}
{{- if and .Values.dsh.llm.enabled .Values.secrets.llmApiKey }}
---
{{/*
LLM 凭证。DSH 的 cordis.patch.yml 通过 apiKeyEnv 引用环境变量，
因此这里只需以该变量名作为键注入，密钥本身不进入配置文件。
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: dsh-llm-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 键名必须与 dsh.llm.apiKeyEnv 完全一致，DSH 按该变量名读取凭证
  {{ .Values.dsh.llm.apiKeyEnv }}: {{ .Values.secrets.llmApiKey | quote }}
{{- end }}
