apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dsh.replicaCount }}
  # 工单产物落在 hostPath 上，且「同一时刻只能有一个写者」：滚动更新默认会
  # 先起新 Pod 再停旧 Pod，两个进程会同时写 /sf/tickets/<id> 互相踩目录。
  # Recreate 用短暂中断换掉这个竞态（replicaCount 恒为 1）。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hci.selectorLabels" (dict "name" "dsh" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hci.podLabels" (dict "name" "dsh" "Release" .Release "Chart" .Chart) | nindent 8 }}
    spec:
      # DSH 具备命令执行能力，Pod 不需要访问 kube-apiserver，
      # 挂上 ServiceAccount token 只会平白增加一个可被窃取的高价值凭据。
      automountServiceAccountToken: false
      {{- if .Values.global.imagePullSecretName }}
      # ghcr.io 为私有仓库（匿名拉取 401），必须挂拉取凭证；
      # 该 Secret 由本 Chart 的 templates/secret.yaml 在 hci-dsh 内渲染。
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecretName }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # 刻意不设置 fsGroup。原因见 values.yaml 的 customerLogs 说明：
        # /sf/log 是客户日志回收链路的共享目录，一旦 kubelet 对其误改属主，
        # 会直接破坏其他消费者。风险对称性上不值得为了便利去赌。
      {{- if or .Values.dsh.llm.enabled .Values.tickets.enabled }}
      initContainers:
        # 把 GitOps 声明的 cordis.patch.yml 播种到可写的家目录卷。
        #
        # 为什么不直接以只读方式挂载 ConfigMap：DSH 的「设置 → 模型」页也会
        # 写这份文件，只读挂载会让页面保存失败。用 initContainer 拷贝可兼顾两头——
        # GitOps 是基线，运行时可改，Pod 重建后回到基线。
        - name: seed-dsh-llm-config
          image: "{{ .Values.global.imageRegistry }}{{ .Values.dsh.image.repository }}:{{ .Values.dsh.image.tag }}"
          imagePullPolicy: {{ .Values.dsh.image.pullPolicy }}
          # profile 名必须与镜像 entrypoint 里的 `dsh --profile web` 一致，
          # 因此这里固定为 web，不做成可配项以免两处漂移。
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /home/dsh/.dsh/profiles/web
              cp /seed/cordis.patch.yml /home/dsh/.dsh/profiles/web/cordis.patch.yml
              echo "[seed] 已播种 LLM 配置到 /home/dsh/.dsh/profiles/web/cordis.patch.yml"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/dsh
            - name: llm-config
              mountPath: /seed
              readOnly: true
      {{- end }}
      containers:
        # ── 主容器：DSH ──────────────────────────────────────────────
        - name: dsh
          # 完整地址 = <imageRegistry><repository>:<tag>，必须与 CI 推送地址严格一致：
          # ghcr.io/tomturing/hci-troubleshoot-platform/dsh:<tag>
          image: "{{ .Values.global.imageRegistry }}{{ .Values.dsh.image.repository }}:{{ .Values.dsh.image.tag }}"
          imagePullPolicy: {{ .Values.dsh.image.pullPolicy }}
          # 监听地址固定在 127.0.0.1：上游在配置加载期会直接拒绝
          # 0.0.0.0 等 unspecified address，且非 loopback 绑定会触发暴露告警。
          # 对外暴露全部由同 Pod 的 dsh-proxy 承担。
          env:
            - name: DSH_PORT
              value: {{ .Values.dsh.port | quote }}
            - name: DSH_PUBLIC_URL
              value: {{ include "dsh.publicUrl" . | quote }}
            {{- $host := include "dsh.publicHost" . }}
            {{- if $host }}
            - name: DSH_TRUSTED_HOST
              value: {{ $host | quote }}
            {{- end }}
            - name: HOME
              value: /home/dsh
          {{- if and .Values.dsh.llm.enabled .Values.secrets.llmApiKey }}
          # LLM 凭证：Secret 的键名即 dsh.llm.apiKeyEnv，
          # cordis.patch.yml 通过 apiKeyEnv 引用它，密钥本身不进入配置文件。
          envFrom:
            - secretRef:
                name: dsh-llm-credentials
          {{- else if .Values.dsh.llmSecretName }}
          # 预建的外部 LLM 凭证 Secret（本 Chart 不内置任何凭据）
          envFrom:
            - secretRef:
                name: {{ .Values.dsh.llmSecretName }}
          {{- end }}
            {{- if .Values.tickets.enabled }}
            # 工单包 zip 密码：只进进程内存，DSH 不写盘也不打日志。
            - name: DSH_TICKET_ARCHIVE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tickets.passwordSecretName }}
                  key: defaultPassword
                  optional: true
            {{- end }}
          # token 是否落盘是 DSH 真正可用的标志：entrypoint 只在抓到
          # 上游就绪行后才写入，因此它比 TCP 探活更能反映真实可用状态。
          startupProbe:
            exec:
              command: ["sh", "-c", "test -s /run/dsh/token"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -s /run/dsh/token"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -s /run/dsh/token"]
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.dsh.resources | nindent 12 }}
          volumeMounts:
            # 客户 HCI 故障日志压缩包：只读，DSH 据此做诊断分析
            {{- if .Values.customerLogs.enabled }}
            - name: customer-logs
              mountPath: {{ .Values.customerLogs.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.tickets.enabled }}
            # 工单日志产物（可写，独立卷；属主 1000 由宿主机预置）
            - name: tickets
              mountPath: {{ .Values.tickets.mountPath }}
            {{- end }}
            # 解压/分析临时产物
            - name: workspace
              mountPath: /work
            # DSH 凭据与会话
            - name: home
              mountPath: /home/dsh
            # 与 dsh-proxy 共享：本容器写 token，sidecar 读 token
            - name: token
              mountPath: /run/dsh
            - name: tmp
              mountPath: /tmp

        # ── sidecar：nginx 反代 ──────────────────────────────────────
        - name: dsh-proxy
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.proxy.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /__internal/healthz
              port: {{ .Values.proxy.port }}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /__internal/healthz
              port: {{ .Values.proxy.port }}
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: token
              mountPath: /run/dsh
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.customerLogs.enabled }}
        - name: customer-logs
          hostPath:
            path: {{ .Values.customerLogs.hostPath }}
            type: Directory
        {{- end }}
        {{- if .Values.tickets.enabled }}
        - name: tickets
          hostPath:
            path: {{ .Values.tickets.hostPath }}
            type: Directory
        {{- end }}
        - name: workspace
          emptyDir:
            sizeLimit: {{ .Values.workspace.sizeLimit }}
        - name: home
          emptyDir:
            sizeLimit: {{ .Values.home.sizeLimit }}
        - name: token
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir: {}
        - name: proxy-config
          configMap:
            name: dsh-proxy
        {{- if or .Values.dsh.llm.enabled .Values.tickets.enabled }}
        # 只交给 initContainer 读取一次，再播种到家目录卷。
        # 工单同步的 ticketsRoot 等参数与 LLM 配置共用同一份 cordis.patch.yml。
        - name: llm-config
          configMap:
            name: dsh-llm-config
        {{- end }}
