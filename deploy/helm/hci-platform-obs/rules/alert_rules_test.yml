---
# GatewayRouterServerErrorFirstSeen 的单元测试（promtool test rules）。
#
# 为什么要单测而不是只在集群里注入：这条规则的判据是「序列刚诞生」，
# 而在真实环境里制造一个「全新的 5xx code」需要同时操纵入口与 service 两个维度，
# 成本高且不可重复；一旦哪天 503 序列已经存在，就再也造不出「刚诞生」的现场。
# 单测能精确构造时间轴，并把正例与两个反例固定下来。
#
# 运行：promtool test rules deploy/helm/hci-platform-obs/rules/alert_rules_test.yml
# CI 里由 helm-validate 的「告警规则单测」步骤执行。
rule_files:
  - alert_rules.yml

evaluation_interval: 1m

tests:
  # ── 正例：入口出现新的 503、service 维度从未有过 503 → 必须 firing ──
  # 这正是 2026-11-01 staging 实测的那类故障（Service 没有 endpoint），
  # 旧的三条规则对它是全静默的。
  - interval: 1m
    input_series:
      # 背景流量：保证 offset 门控（count by () (entrypoint offset 10m) > 0）能开
      - series: 'traefik_entrypoint_requests_total{code="200",entrypoint="websecure"}'
        values: '1000+10x30'
      # 503 序列在 t=10m 才诞生：前 10 分钟该序列不存在
      - series: 'traefik_entrypoint_requests_total{code="503",entrypoint="websecure"}'
        values: '_x10 3 3 3 3 3 3 3 3'
      # service 维度只有 200，从来没有 503 —— 这是本规则的前置条件
      - series: 'traefik_service_requests_total{code="200",service="hci-staging-customer-ui-80@kubernetes"}'
        values: '500+5x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: GatewayRouterServerErrorFirstSeen
        exp_alerts:
          - exp_labels:
              code: "503"
              severity: warning
              team: platform
            exp_annotations:
              summary: "网关自身返回 503，未落到任何后端"
              description: "该 5xx 只出现在入口维度、service 维度没有这个 code 的序列，说明请求没走到后端 就失败了：常见成因是路由未匹配（host/path 写错）、Service 没有 endpoint（selector 不 匹配 Pod）、middleware 直接拒绝。这类故障此前完全不进告警，因为 service 维度结构性 地看不见它。排查看对应 Ingress 的 host/path 与 Service 的 endpoints 是否为空。"

  # ── 反例一：service 维度也有 503 → 不是「网关自身」产生的，本规则不得 firing ──
  # 这个反例同时证明新规则不会与 GatewayServerErrorFirstSeen 重复告警。
  - interval: 1m
    input_series:
      - series: 'traefik_entrypoint_requests_total{code="200",entrypoint="websecure"}'
        values: '1000+10x30'
      - series: 'traefik_entrypoint_requests_total{code="503",entrypoint="websecure"}'
        values: '_x10 3 3 3 3 3 3 3 3'
      # 关键差异：service 维度也存在 503 序列
      - series: 'traefik_service_requests_total{code="503",service="hci-staging-probe-backend-down-80@kubernetes"}'
        values: '_x10 3 3 3 3 3 3 3 3'
    alert_rule_test:
      - eval_time: 12m
        alertname: GatewayRouterServerErrorFirstSeen
        exp_alerts: []

  # ── 反例二：503 序列早已存在（不是刚诞生）→ 不得 firing ──
  # 防止规则退化成「只要 service 缺该 code 就永久告警」的噪声源。
  - interval: 1m
    input_series:
      - series: 'traefik_entrypoint_requests_total{code="200",entrypoint="websecure"}'
        values: '1000+10x30'
      - series: 'traefik_entrypoint_requests_total{code="503",entrypoint="websecure"}'
        values: '2+1x30'
      - series: 'traefik_service_requests_total{code="200",service="hci-staging-customer-ui-80@kubernetes"}'
        values: '500+5x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: GatewayRouterServerErrorFirstSeen
        exp_alerts: []
  # ══════════════════════════════════════════════════════════════════════════
  # ticket-sync 与节点磁盘余量（2026-11-12 全栈中断后新增）
  #
  # 为什么这几条必须有单测：它们的判据是「余量绝对值」，而真实环境里把 2.1T
  # 盘写到 500 GiB 以下是破坏性操作，不可重复构造。更要紧的是——11-12 那次
  # 事故的教训就是「规则写了但没数据源、也没人验证它能响」，所以这里用
  # promtool 把「该响时响」和「不该响时不响」都钉住。
  # ══════════════════════════════════════════════════════════════════════════

  # ── 正例：余量 450 GiB（低于 500 GiB 阈值），越过 5 分钟 for → 必须 firing ──
  - interval: 1m
    input_series:
      - series: 'ticket_sync_disk_free_bytes{instance="ticket-sync-host",job="ticket-sync"}'
        values: '483183820800x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: TicketSyncDiskLow
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              instance: ticket-sync-host
              job: ticket-sync
            exp_annotations:
              summary: "ticket-sync 所在磁盘余量低于 500 GiB"
              description: "当前余量 450GiB。低于 400 GiB 会触发主动淘汰，低于 250 GiB 会熔断拒绝新任务。"

  # ── 反例一：余量 600 GiB 高于阈值 → 不得 firing ──
  # 防止阈值被改小或比较方向写反（< 写成 >）之后仍然绿着。
  - interval: 1m
    input_series:
      - series: 'ticket_sync_disk_free_bytes{instance="ticket-sync-host",job="ticket-sync"}'
        values: '644245094400x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: TicketSyncDiskLow
        exp_alerts: []

  # ── 反例二：余量刚好在 500 GiB 边界上（不小于阈值）→ 不得 firing ──
  # 边界值最容易被后续改动碰坏，单独钉一次。
  - interval: 1m
    input_series:
      - series: 'ticket_sync_disk_free_bytes{instance="ticket-sync-host",job="ticket-sync"}'
        values: '536870912000x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: TicketSyncDiskLow
        exp_alerts: []

  # ── 熔断正例：水位拒绝次数在增长 → immediately firing ──
  - interval: 1m
    input_series:
      - series: 'ticket_sync_waterline_blocks_total{instance="ticket-sync-host",job="ticket-sync"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TicketSyncWaterlineBlocking
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              instance: ticket-sync-host
              job: ticket-sync
            exp_annotations:
              summary: "ticket-sync 因磁盘水位拒绝新任务"
              description: "最近 10 分钟出现因余量低于硬阈值而被拒绝的写入。说明清理跑不过写入速度，需人工介入。"

  # ── 采集自检：target down 超过 2 分钟 → firing ──
  - interval: 1m
    input_series:
      - series: 'up{instance="ticket-sync-host",job="ticket-sync"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: TicketSyncDown
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              instance: ticket-sync-host
              job: ticket-sync
            exp_annotations:
              summary: "ticket-sync 指标采集失败"
              description: "无法抓取 192.168.0.4:18080/metrics 超过 2 分钟。可能原因：宿主机服务已停止（崩溃循环 5 次后 systemd 不再重启）、节点 IP 变更、或 18080 端口被占用。该服务长期不可用会导致新工单日志无法落盘。"

  # ══════════════════════════════════════════════════════════════════════════
  # 抓取目标与核心服务可用性（2026-11-13 新增/修正）
  #
  # 背景：同一天查出三个同源缺陷——ServiceDown / KBServiceDown 按 job 名过滤，
  # 而本集群所有注解发现的 Pod 都归 job="hci-services"，服务名在 service_name
  # 标签上；两条规则实测恒为空向量。加上原本没有任何规则覆盖非核心 target，
  # semantica/knowledge-explorer 的 up=0 静默了 7 天。
  #
  # 这些用例的作用是钉住「标签口径」：以后谁把 service_name 改回 job，
  # 正例会立刻失败，而不是又静默 7 天。
  # ══════════════════════════════════════════════════════════════════════════

  # ── ScrapeTargetDown 正例：单 target 掉线 12 分钟 → firing ──
  - interval: 1m
    input_series:
      - series: 'up{job="hci-services",instance="10.42.0.126:8000",service_name="knowledge-explorer"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ScrapeTargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              instance: "10.42.0.126:8000"
              job: hci-services
              service_name: knowledge-explorer
            exp_annotations:
              summary: "抓取目标 10.42.0.126:8000 持续不可达"
              description: "服务 knowledge-explorer 的指标端点连续 10 分钟抓取失败。可能是 Pod 异常、端口不通或 NetworkPolicy 拒绝，请检查 Prometheus target 的 lastError。"

  # ── 反例一：target 健康 → 静默 ──
  - interval: 1m
    input_series:
      - series: 'up{job="hci-services",instance="10.42.0.126:8000",service_name="knowledge-explorer"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ScrapeTargetDown
        exp_alerts: []

  # ── 反例二：掉线仅 6 分钟，未达 for: 10m → 静默（避开 Pod 正常重启）──
  - interval: 1m
    input_series:
      - series: 'up{job="hci-services",instance="10.42.0.126:8000",service_name="knowledge-explorer"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 6m
        alertname: ScrapeTargetDown
        exp_alerts: []

  # ── ServiceDown 正例：按 service_name 聚合，全部副本掉线 → firing ──
  - interval: 1m
    input_series:
      - series: 'up{job="hci-services",service_name="api-gateway",instance="10.42.0.1:8000"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              service_name: api-gateway
            exp_annotations:
              summary: "服务 api-gateway 全部实例不可用"
              description: "服务 api-gateway 的所有 Prometheus 抓取目标均不可达，请立即检查。"

  # ── ServiceDown 反例：只有一个副本掉线，另一个健康 → 不得 firing ──
  - interval: 1m
    input_series:
      - series: 'up{job="hci-services",service_name="api-gateway",instance="10.42.0.1:8000"}'
        values: '0x5'
      - series: 'up{job="hci-services",service_name="api-gateway",instance="10.42.0.2:8000"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ServiceDown
        exp_alerts: []

  # ── KBServiceDown 正例：标签口径修正后必须能触发 ──
  - interval: 1m
    input_series:
      - series: 'up{job="hci-services",service_name="kb-service",instance="10.42.0.3:8000"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: KBServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              service_name: kb-service
              job: hci-services
              instance: "10.42.0.3:8000"
            exp_annotations:
              summary: "KB Service 不可用，RAG 功能已降级"
              description: "kb-service 已有 1 分钟不可达，所有 AI 回答将无法检索知识库，请立即处理。"

  # ── 日志收集契约告警（PR #1510）───────────────────────────────────────
  # 正例：落库码绕过契约，序列从 0 跳到 1，必须 firing。
  - interval: 1m
    input_series:
      - series: 'hci_log_collect_contract_drift_total{service="case-service"}'
        values: '0x10 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 12m
        alertname: LogCollectContractDrift
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
            exp_annotations:
              summary: "日志收集落库错误码绕过契约"
              description: "有 error_code 不在 contracts/log_collect_display.json 的码表中，说明某个调用点又手写了一套码。按 trace_id 查 log_collect_task.detail.error_code_derivation 定位来源。"

  # 反例：指标恒为 0（有序列、无漂移），不得 firing。
  - interval: 1m
    input_series:
      - series: 'hci_log_collect_contract_drift_total{service="case-service"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: LogCollectContractDrift
        exp_alerts: []

  # 反例：指标序列完全不存在时，未归因告警不得凭空 firing（空序列静默陷阱）。
  - interval: 1m
    input_series:
      - series: 'hci_log_collect_attribution_total{source="declared",code="LC-SPC-001"}'
        values: '0+1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: LogCollectAttributionUnattributedHigh
        exp_alerts: []
