# =============================================================================
# HCI 平台 Prometheus 告警规则（Helm Chart 版本）
# 来源：K3s集群健壮性改进计划 H-4
# 此文件由 Helm prometheus-alert-rules ConfigMap 自动加载
# =============================================================================

groups:
  # ────────────────────────── 日志采集流水线 ──────────────────────────
  - name: alloy_log_pipeline
    rules:
      - alert: AlloyTargetDown
        expr: absent(up{app="alloy"}) or up{app="alloy"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Alloy 指标端点不可达"
          description: "Alloy 已连续 2 分钟无法被 Prometheus 抓取，Pod Ready 状态不足以证明日志链路健康。"

      - alert: AlloyLokiEntriesDropped
        expr: increase(loki_write_dropped_entries_total{component_id="loki.write.default"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Alloy 正在丢弃日志"
          description: "Alloy 在最近 5 分钟发生 Loki 写入丢弃，请按 reason 标签定位限流、行过长或 ingester 错误。"

      - alert: AlloyLokiWriteRetriesHigh
        expr: increase(loki_write_batch_retries_total{component_id="loki.write.default"}[10m]) > 5
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Alloy 写入 Loki 持续重试"
          description: "Alloy 在最近 10 分钟重试 Loki 写入超过 5 次，日志可见性存在延迟或中断风险。"

      - alert: AlloyLogPipelineStalled
        expr: sum(increase(loki_source_file_read_lines_total{component_id="loki.source.file.pod_logs"}[10m])) > 0 and sum(increase(loki_write_sent_entries_total{component_id="loki.write.default"}[10m])) == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Alloy 日志读取与写入链路停滞"
          description: "Alloy 仍在读取容器日志，但最近 10 分钟没有任何日志成功写入 Loki。"

  # ────────────────────────── 可用性告警 ──────────────────────────
  - name: hci_availability
    rules:
      # Pod 非预期重启（OOMKill、CrashLoop）
      - alert: PodRestartingFrequently
        expr: |
          increase(kube_pod_container_status_restarts_total{
            namespace=~"hci-.*"
          }[15m]) > 3
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Pod {{ $labels.pod }} 15分钟内重启超过3次"
          description: "命名空间 {{ $labels.namespace }} 中的 Pod {{ $labels.pod }} 容器 {{ $labels.container }} 频繁重启，请检查日志。"

      # 服务全部实例不可用
      - alert: ServiceDown
        expr: |
          sum by (job) (
            up{job=~"api-gateway|case-service|conversation-service|scheduler-service|kb-service"}
          ) == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "服务 {{ $labels.job }} 全部实例不可用"
          description: "服务 {{ $labels.job }} 的所有 Prometheus 抓取目标均不可达，请立即检查。"

  # ────────────────────────── 业务告警（H-4）──────────────────────────
  - name: hci_business
    rules:
      # KB Service 不可用（RAG 功能降级）
      - alert: KBServiceDown
        expr: |
          up{job="kb-service"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "KB Service 不可用，RAG 功能已降级"
          description: "kb-service 已有 1 分钟不可达，所有 AI 回答将无法检索知识库，请立即处理。"

      # Pod 池耗尽（活跃分配存在但无空闲 Pod — 资源泄漏信号）
      - alert: PodPoolExhausted
        expr: |
          hci_warm_pool_size{state="idle"} == 0
          AND
          hci_warm_pool_size{state="active"} > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Pod 池已耗尽，可能存在资源泄漏"
          description: "空闲 Pod 数为 0 但活跃分配数为 {{ $value }}，已持续 5 分钟，可能存在 Pod 未正确释放。检查 hci_pod_release_failures_total。"

      # AI 流式请求错误率超过 10%
      - alert: AIStreamErrorRateHigh
        expr: |
          rate(hci_ai_requests_total{status="error"}[5m])
          / rate(hci_ai_requests_total[5m])
          > 0.10
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "AI 流式请求错误率超过 10%（{{ $labels.job }}）"
          description: "conversation-service AI 流式请求错误率 {{ $value | humanizePercentage }}，超过 10% 阈值，持续 2 分钟。"

      # Pod 释放失败计数持续上升（H-3 相关）
      - alert: PodReleaseFailing
        expr: |
          rate(hci_pod_release_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Pod 释放持续失败（{{ $labels.reason }}）"
          description: "hci_pod_release_failures_total 在过去 10 分钟内持续增长（reason={{ $labels.reason }}），可能导致 Pod 资源泄漏，需人工检查调度器状态。"

  # ────────────────────────── 调度器热备池 ──────────────────────────
  - name: hci_pool
    rules:
      # 热备 Pod 池耗尽
      - alert: WarmPoolExhausted
        expr: hci_warm_pool_size{state="idle"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "scheduler-service 热备 Pod 池耗尽"
          description: "热备池中无空闲 Pod，新工单将无法即时分配 AI 助手，用户体验受损。"

      # 热备池空闲数低于最小阈值
      - alert: WarmPoolLow
        expr: hci_warm_pool_size{state="idle"} < 2
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "热备 Pod 池空闲数不足（< 2）"
          description: "当前空闲 Pod 数为 {{ $value }}，低于建议最小值 2。可能是创建延迟或僵尸 Pod 占用。"

  # ────────────────────────── 性能告警 ──────────────────────────
  - name: hci_performance
    rules:
      # API P95 延迟超过 2秒
      - alert: HighApiLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le, job) (
              rate(http_request_duration_seconds_bucket{
                job=~"api-gateway|case-service|conversation-service"
              }[5m])
            )
          ) > 2.0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "{{ $labels.job }} P95 延迟超过 2s"
          description: "{{ $labels.job }} P95 延迟为 {{ $value | humanizeDuration }}，超过阈值 2s。"

  # ────────────────────────── 基础设施 ──────────────────────────
  - name: hci_infrastructure
    rules:
      # 磁盘使用率超过 80%
      - alert: DiskUsageHigh
        expr: |
          (
            node_filesystem_size_bytes{fstype!~"tmpfs|squashfs|overlay"}
            - node_filesystem_avail_bytes{fstype!~"tmpfs|squashfs|overlay"}
          )
          / node_filesystem_size_bytes{fstype!~"tmpfs|squashfs|overlay"}
          > 0.80
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "节点 {{ $labels.instance }} 磁盘使用率超过 80%"
          description: "挂载点 {{ $labels.mountpoint }} 使用率 {{ $value | humanizePercentage }}。"

      # 内存使用率超过 85%
      - alert: MemoryUsageHigh
        expr: |
          (1 - (
            node_memory_MemAvailable_bytes /
            node_memory_MemTotal_bytes
          )) > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "节点 {{ $labels.instance }} 内存使用率超过 85%"
          description: "节点内存使用率 {{ $value | humanizePercentage }}，AI claw Pod 可能面临 OOM 风险。"

  # ────────────────────────── 发布可用性（网关层）──────────────────────────
  # 发布期间「Pod 换了」与「用户拿到 502」是两件事：KSM 只能看到前者。
  # 网关 5xx 才是用户侧真实不可用的直接证据，也是衡量「发布窗口是否归零」的
  # 唯一客观口径（此前只能靠 Pod 时间戳推导）。
  - name: gateway_availability
    rules:
      - alert: GatewayServerErrorSpike
        expr: sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[2m])) > 0.05
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "网关 {{ $labels.service }} 持续返回 5xx"
          description: "最近 2 分钟该服务 5xx 速率 > 0.05/s，超过 1 分钟。发布/重启窗口常见；若持续，检查对应 Deployment 的 Ready 状态与优雅期。注意本告警用 rate()，对「序列诞生前的增量」是瞎的，那一段由 GatewayServerErrorFirstSeen 兜住。"

      # 首样本盲区：delta 类函数（rate/increase/irate/delta）永远看不见
      # 「序列诞生前已发生的增量」。Traefik 的 code 标签是懒创建的，某服务第一次
      # 出 5xx 时序列才诞生，Prometheus 看到的第一个样本就已经是 N，之后每个样本
      # 都停在 N，于是 rate()/increase() 在任何窗口上都恒为 0。
      #
      # 2026-10-30 staging 实测：case-service 的 502 序列首样本就是 10:47:49Z = 28，
      # 之后常数；同期 sum(increase(...[15m])) = 0。也就是说「5xx 增量为 0」这条
      # 验收口径在低流量环境下结构性失效——而这恰恰是告警最该响的首次故障。
      #
      # 兜底方式不看增量，只问「这条 5xx 序列是不是刚出现」：现在有值、10 分钟前
      # 还不存在（或为 0），说明它的首次增量必然发生在第一次抓取之前。
      # 它是一次性事件告警，序列满 10 分钟后自动消解，不会长期占用告警列表。
      #
      # 但「offset 处没有数据」有两种成因，必须区分，否则后者会变成成片误报：
      #   (a) 序列真的刚诞生 —— 该报；
      #   (b) offset 落进了本实例根本没有的那段数据 —— 不该报。
      # (b) 不是理论风险：staging 的 Prometheus 数据目录是 emptyDir，每次重启
      # TSDB 全清。2026-10-30 15:49 合入本规则后，15:50:4x checksum/rules 触发重启，
      # 15:51:22 首次评估就把 9 条发布前早已存在的 5xx 序列全部判成「新出现」，
      # 一次性 firing 9 条 warning。
      #
      # 修法是给表达式加一道「数据连续性门控」：只有当被判断依据的那个指标族
      # 在 offset 时刻确实有数据时，才认为「序列不存在」等价于「序列刚诞生」。
      # 门控用指标族自身而不是 up：全局 up 只要 18 个 target 里有一个健康就非空，
      # 单 Traefik 抓取中断 10 分钟同样会漏开门控。
      # 实测（emptyDir 重启后 30 分钟处即真实空档）：裸表达式命中 10 条，
      # 加指标族门控命中 0 条；数据齐全处（offset 8m/10m/15m/20m）门控不误挡真实新序列。
      - alert: GatewayServerErrorFirstSeen
        # 两层括号都不能省：offset 只能直接跟在向量选择器后面
        # （`... > 0 offset 10m` 直接 parse error）；unless 与 and 左结合，
        # 不括起来门控会挂错结合对象。
        expr: |
          (
            (traefik_service_requests_total{code=~"5.."} > 0)
            unless
            ((traefik_service_requests_total{code=~"5.."} offset 10m) > 0)
          )
          and on()
          (count by () (traefik_service_requests_total offset 10m) > 0)
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "网关 {{ $labels.service }} 出现新的 5xx 序列（{{ $labels.code }}/{{ $labels.method }}）"
          description: "该 5xx 计数器刚出现，当前值 {{ $value | humanize }} 全部发生在首次抓取之前，rate()/increase() 看不到它们。这通常是一次发布/重启窗口：先 看对应 Deployment 的 Pod 是否在此时重启，以及 preStop 是否生效。若整批 5xx 序列 在同一时刻集体 firing，则更可能是 Prometheus 实例自己的数据目录被清空（早期用 emptyDir 时必然如此；2026-10-31 起改为 PVC，出现时应先查 prometheus-data 是否被重建而不是怀疑业务），门控已排除这种成片假象。"

      # 反向自守：监控自己"静默瘫掉"比任何业务告警都危险。
      # 2026-10-30 前，staging 就是因为命名空间白名单漏了而没有任何指标，
      # 却没有任何告警提示这件事。
      - alert: GatewayMetricsMissing
        expr: absent(traefik_service_requests_total)
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "网关指标已消失（可用性度量失效）"
          description: "traefik_service_requests_total 已 15 分钟无数据：可能是 Traefik 未开 metrics/prometheus 或注解端口不对，此时发布窗口无法被度量。"

      # ── 网关自身产生的 5xx：service 维度结构性地看不见 ──
      # 上面三条都建立在 traefik_service_requests_total 上，而它只统计「已经落到某个
      # Service 上」的请求。路由未匹配、Service 没有 endpoint、middleware 直接拒绝——
      # 这几类 5xx 根本走不到 service 层，只存在于 traefik_entrypoint_requests_total。
      #
      # 2026-11-01 staging 实测（同一时刻、同一类故障，两个维度结论相反）：
      #   · Service 没有 endpoint 的 Ingress，请求 3 次 → Loki 里 3 条 503 有记录、
      #     入口维度 code=503 计数上涨，而 `count(traefik_service_requests_total{code=~"5.."})`
      #     恒为 0 → 上面三条告警全部静默；
      #   · 对照组：Service 有 endpoint 但 targetPort 打错（真实转发失败）→ service
      #     维度立刻出现 code="502" v=3，GatewayServerErrorFirstSeen 正常 firing。
      # 所以前者的「0 告警」不是「没有故障」，是维度选错了。
      #
      # 判据取「该 5xx code 在入口刚出现，而 service 维度从来没有这个 code 的序列」。
      # 不用两个计数器的数值差，是因为差值在「service 侧完全缺该 code」时会因找不到
      # 匹配的右操作数而把整条序列丢掉——丢掉的恰好是本规则要抓的那一类。
      # 口径对齐的前提已实测：200/201/401/403 两维度差值全为 0，只有 404 差 184
      # （路由未匹配，正是同类现象），说明 service 维度是入口维度的真子集。
      #
      # 与 GatewayServerErrorFirstSeen 同构（一次性事件，序列满 10 分钟后自动消解），
      # 且因为「service 维度没有该 code」是硬前提，不会与它重复告警。
      #
      # 已知漏报边界：同一个 code 如果既然后端产生、又有网关自身产生，service 维度
      # 就存在该 code，本规则会因 unless 而放弃。混合场景目前看不出来，需要时再补
      # increase() 差值（低流量下 increase 有首样本盲区，另议）。
      - alert: GatewayRouterServerErrorFirstSeen
        expr: |
          (
            (sum by (code) (traefik_entrypoint_requests_total{code=~"5.."}) > 0)
            unless on (code)
            (sum by (code) (traefik_entrypoint_requests_total{code=~"5.."} offset 10m) > 0)
            unless on (code)
            (sum by (code) (traefik_service_requests_total{code=~"5.."}) > 0)
          )
          and on()
          (count by () (traefik_entrypoint_requests_total offset 10m) > 0)
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "网关自身返回 {{ $labels.code }}，未落到任何后端"
          description: "该 5xx 只出现在入口维度、service 维度没有这个 code 的序列，说明请求没走到后端 就失败了：常见成因是路由未匹配（host/path 写错）、Service 没有 endpoint（selector 不 匹配 Pod）、middleware 直接拒绝。这类故障此前完全不进告警，因为 service 维度结构性 地看不见它。排查看对应 Ingress 的 host/path 与 Service 的 endpoints 是否为空。"
