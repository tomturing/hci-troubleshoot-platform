apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  tempo.yaml: |
    stream_over_http_enabled: true
    server:
      http_listen_port: 3200
      grpc_listen_port: 9095

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

    ingester:
      max_block_duration: 1m

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: hci-k3s

    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/blocks

    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # Docker runtime 使用 JSON 格式（containerd/CRI 才用 cri: {}）
          - docker: {}
        relabel_configs:
          # 先过滤：只采集有 app.kubernetes.io/name 标签的 Pod（排除无标签的系统 Pod）
          - action: drop
            regex: ""
            source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          # 设置日志文件路径（关键！缺少此规则 Promtail 不会读取任何文件）
          - action: replace
            source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            regex: (.+)/(.+)
            replacement: /var/log/pods/*$1/$2/*.log
            target_label: __path__
          # 设置 Label
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          # service_name 与 OTel 保持一致，方便 Grafana 统一查询
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: service_name
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        editable: true

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        editable: true
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            tags:
              - key: service.name
                value: service_name
            filterByTraceID: true
            filterBySpanID: false
          serviceMap:
            datasourceUid: loki
          nodeGraph:
            enabled: true

      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        editable: true
        jsonData:
          timeInterval: 15s
---
# Dashboard Provisioning 配置：告知 Grafana 从 ConfigMap 挂载路径加载 dashboard JSON
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: HCI Platform
        orgId: 1
        folder: HCI
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards
---
# HCI 系统概览 Dashboard（ConfigMap 方式内嵌，避免依赖 hostPath）
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  hci-overview.json: |
    {
      "title": "HCI 智能排障平台 — 系统概览",
      "uid": "hci-overview",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "tags": ["hci", "overview"],
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "HTTP 请求速率（QPS）",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (job) (rate(http_requests_total[5m]))",
              "legendFormat": "{{ "{{job}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "lineWidth": 2 }
            }
          }
        },
        {
          "id": 2,
          "title": "HTTP 5xx 错误率",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (job) (rate(http_requests_total{status=~\"5..\"}[5m])) / sum by (job) (rate(http_requests_total[5m]))",
              "legendFormat": "{{ "{{job}}" }} 错误率"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "steps": [
                  { "value": 0, "color": "green" },
                  { "value": 0.01, "color": "yellow" },
                  { "value": 0.05, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "HTTP P95 延迟",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{ "{{job}}" }} P95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "steps": [
                  { "value": 0, "color": "green" },
                  { "value": 1, "color": "yellow" },
                  { "value": 2, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "AI 首 Token 延迟 (TTFT) P50/P95",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(hci_ai_ttft_seconds_bucket[5m])))",
              "legendFormat": "TTFT P50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(hci_ai_ttft_seconds_bucket[5m])))",
              "legendFormat": "TTFT P95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "steps": [
                  { "value": 0, "color": "green" },
                  { "value": 5, "color": "yellow" },
                  { "value": 10, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Pod 池状态（空闲 / 活跃）",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (assistant_type) (hci_pod_pool_idle)",
              "legendFormat": "空闲 {{ "{{assistant_type}}" }}"
            },
            {
              "expr": "sum by (assistant_type) (hci_pod_pool_active)",
              "legendFormat": "活跃 {{ "{{assistant_type}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short" }
          }
        },
        {
          "id": 6,
          "title": "KB 检索耗时 P95",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(hci_kb_search_seconds_bucket[5m])))",
              "legendFormat": "KB Search P95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "steps": [
                  { "value": 0, "color": "green" },
                  { "value": 0.5, "color": "yellow" },
                  { "value": 1.0, "color": "red" }
                ]
              }
            }
          }
        }
      ]
    }
