{{- $logNamespaces := .Values.scrapeNamespaces | default (list .Values.scrapeNamespace) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  tempo.yaml: |
    stream_over_http_enabled: true
    server:
      http_listen_port: 3200
      grpc_listen_port: 9095

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

    ingester:
      max_block_duration: 1m

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: hci-k3s

    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/blocks

    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "json"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = {{ join "|" $logNamespaces | quote }}
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = ""
        action        = "drop"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        regex         = "(.+)/(.+)"
        replacement   = "/var/log/pods/*$1/$2/*.log"
        target_label  = "__path__"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "service_name"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      tail_from_end = true
      forward_to = [loki.process.pod_logs.receiver]
    }

    loki.process "pod_logs" {
      stage.cri {}
      // trace_id / span_id 提为 structured metadata 是**必需的**：全局规则要求
      // 「所有请求日志使用唯一调用链，可追踪完整调用路径」，而 metadata 是唯一
      // 能把 trace_id 变成可过滤条件、又不撑爆 label 索引的机制（机制取证见
      // loki.process "ingress_logs" 里的注释）。
      // 代价已实测并登记：metadata 参与查询结果的分组，2026-10-30 对
      // {namespace="hci-staging"} |= "trace_id" 近 2h 抽样 50 行 → 分成 18 条返回流。
      // 这是「按 trace_id 查日志」这个能力本身的价格，不是配置错误；
      // 若将来要压掉，方向是给 trace 查询改走 Tempo，而不是删掉这里的 metadata。
      stage.json {
        expressions = {
          event    = "event",
          level    = "level",
          span_id  = "span_id",
          trace_id = "trace_id",
        }
      }
      stage.structured_metadata {
        values = {
          event    = "",
          span_id  = "",
          trace_id = "",
        }
      }
      forward_to = [loki.write.default.receiver]
    }

    // ── 网关 5xx（Traefik accesslog）──────────────────────────────────
    // kube-system 不能整段纳入：coredns / metrics-server / local-path 的日志与
    // 业务无关，会把 Loki 淹掉。这里用两条 keep（AND 语义）只留 Traefik，
    // 且 Traefik 侧已用 `--accesslog.filters.statuscodes=500-599` 只写 5xx，
    // 所以这条链路每天只有寥寥数行，却是「发布是否真的打断用户请求」的直接证据。
    discovery.relabel "ingress_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "kube-system"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = "traefik"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        regex         = "(.+)/(.+)"
        replacement   = "/var/log/pods/*$1/$2/*.log"
        target_label  = "__path__"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
    }

    local.file_match "ingress_logs" {
      path_targets = discovery.relabel.ingress_logs.output
    }

    loki.source.file "ingress_logs" {
      targets       = local.file_match.ingress_logs.targets
      tail_from_end = true
      forward_to    = [loki.process.ingress_logs.receiver]
    }

    loki.process "ingress_logs" {
      stage.cri {}
      // 只提「值域有界」的字段。这里连踩两个坑，结论以现网实测为准：
      //   坑 1（改动前的旧注释）：「structured_metadata 不增 label 基数」——这句
      //     在 label 索引层面**是对的**（见下面坑 2 的实测），但被人读成「随便提
      //     什么字段都免费」，于是 duration（每请求唯一）+ request_path（用户可控）
      //     一起进了 metadata 表。
      //   坑 2（我上一轮订正时写下的）：断言「structured_metadata 就是把值写成
      //     Loki label」——**这句是错的**。2026-10-30 在 Loki 3.4.2 上实测：
      //       /loki/api/v1/labels 全集只有 7 个（app/container/filename/namespace/
      //       pod/service_name/stream），既查不到 duration 也查不到 downstream_status；
      //       标签选择器 {duration="90270"} 返回空；只有行过滤语法
      //       {app="traefik"} | duration="90270" 能命中——即原生 structured metadata，
      //       不进 label 索引，所以旧注释那句「不增 label 基数」本身没写错。
      //   但它仍然不是免费的：metadata 参与**查询结果的 stream 分组**。实测
      //     {app="traefik"} 近 24h 返回 6 条流，其中 3 条各只装 1 行、彼此的差异
      //     就是 duration；发布窗口一次 1971 个 503 会把 Explore 的流列表刷成上千条。
      //   所以判据是「有没有对应的索引收益」而不是「会不会增 label 基数」：
      //     duration / request_path 原始 JSON 行里本来就有，LogQL 用
      //     `| json | Duration > 60000000000` 一样可查，再存一份 metadata 副本只换来
      //     分组膨胀，零收益 → 不提。状态码 / 路由名 / 后端服务名的取值个数有上限，
      //     提出来能直接过滤 → 提。
      //
      // 后端服务名故意叫 backend_service，不复用 service_name：
      //   - service_name 已经是 stream 标签（上面 pod_logs 的 discovery.relabel
      //     把 __meta_kubernetes_pod_label_app_kubernetes_io_name 写成了它），
      //     在现网对 kube-system/traefik 的 5xx 行实测带着 service_name="traefik"，
      //     而那条 Traefik JSON 行里**根本没有 ServiceName 这个键**——也就是说这个值
      //     是从采集链继承来的，不是从日志里抽的；
      //   - Traefik 对网关自身产生的 5xx（503 no available server、入口无后端）
      //     不写 ServiceName，只对「已经转发到某个 Service 之后」的 5xx 才写。
      // 两者同名但语义不同（一个是「网关自己」，一个是「哪个后端」），查询时会给出
      // 自信但错误的答案，所以这里另起一个不会混淆的名字。
      stage.json {
        expressions = {
          downstream_status = "DownstreamStatus"
          origin_status     = "OriginStatus"
          router_name       = "RouterName"
          backend_service   = "ServiceName"
        }
      }
      stage.structured_metadata {
        values = {
          downstream_status = ""
          origin_status     = ""
          router_name       = ""
          backend_service   = ""
        }
      }
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        editable: true

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        editable: true
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            tags:
              - key: service.name
                value: service_name
            filterByTraceID: true
            filterBySpanID: false
          serviceMap:
            datasourceUid: loki
          nodeGraph:
            enabled: true

      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        editable: true
        jsonData:
          timeInterval: 15s
---
# Dashboard Provisioning 配置：告知 Grafana 从 ConfigMap 挂载路径加载 dashboard JSON
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: HCI Platform
        orgId: 1
        folder: HCI
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards
---
# HCI 系统概览 Dashboard（ConfigMap 方式内嵌，避免依赖 hostPath）
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  hci-overview.json: |
    {
      "title": "HCI 智能排障平台 — 系统概览",
      "uid": "hci-overview",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "tags": ["hci", "overview"],
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "HTTP 请求速率（QPS）",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (job) (rate(http_requests_total[5m]))",
              "legendFormat": "{{ "{{job}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "lineWidth": 2 }
            }
          }
        },
        {
          "id": 2,
          "title": "HTTP 5xx 错误率",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (job) (rate(http_requests_total{status=~\"5..\"}[5m])) / sum by (job) (rate(http_requests_total[5m]))",
              "legendFormat": "{{ "{{job}}" }} 错误率"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "steps": [
                  { "value": 0, "color": "green" },
                  { "value": 0.01, "color": "yellow" },
                  { "value": 0.05, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "HTTP P95 延迟",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{ "{{job}}" }} P95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "steps": [
                  { "value": 0, "color": "green" },
                  { "value": 1, "color": "yellow" },
                  { "value": 2, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "AI 首 Token 延迟 (TTFT) P50/P95",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(hci_ai_ttft_seconds_bucket[5m])))",
              "legendFormat": "TTFT P50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(hci_ai_ttft_seconds_bucket[5m])))",
              "legendFormat": "TTFT P95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "steps": [
                  { "value": 0, "color": "green" },
                  { "value": 5, "color": "yellow" },
                  { "value": 10, "color": "red" }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Pod 池状态（空闲 / 活跃）",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (assistant_type) (hci_pod_pool_idle)",
              "legendFormat": "空闲 {{ "{{assistant_type}}" }}"
            },
            {
              "expr": "sum by (assistant_type) (hci_pod_pool_active)",
              "legendFormat": "活跃 {{ "{{assistant_type}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short" }
          }
        },
        {
          "id": 6,
          "title": "KB 检索耗时 P95",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(hci_kb_search_seconds_bucket[5m])))",
              "legendFormat": "KB Search P95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "steps": [
                  { "value": 0, "color": "green" },
                  { "value": 0.5, "color": "yellow" },
                  { "value": 1.0, "color": "red" }
                ]
              }
            }
          }
        }
      ]
    }
{{- if .Values.prometheus.enabled }}
---
# Prometheus 配置
#
# 不按命名空间白名单发现 Pod：白名单一旦漏掉某个环境（2026-10-30 前 staging
# 就是这样），就是「指标永远缺失」而且没人会发现。真正的门控是 Pod 上的
# `prometheus.io/scrape=true` 注解——只有我们自己的 workload 会打这个标注，
# 所以全命名空间发现不会带入系统组件噪声，却能让新环境开箱即有指标。
#
# 本文件里所有 ConfigMap 的总体变更都会被 prometheus / alloy 的
# `checksum/config` 注解捕获（见 prometheus.yaml、alloy.yaml），从而在 ArgoCD
# 同步后自动滚动重启。否则 ConfigMap 改了、Pod 还跑旧配置，是最难发现的
# 「声明式不生效」。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    # 从独立 ConfigMap（prometheus-alert-rules）挂载告警规则文件
    rule_files:
      - "/etc/prometheus/rules/*.yml"

    # 告警路由到 alertmanager
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    scrape_configs:
      # 通过 K8s Pod 注解自动发现服务（不再限定命名空间）
      - job_name: 'hci-services'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # 只采集带有 prometheus.io/scrape=true 注解的 Pod
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          # 使用 prometheus.io/path 注解覆盖默认的 /metrics 路径
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # 使用 prometheus.io/port 注解覆盖端口
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # 添加 pod / namespace / app 标签
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: service_name
{{- end }}
