apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.podLabels" (dict "name" "alloy" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "hci.selectorLabels" (dict "name" "alloy" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hci.podLabels" (dict "name" "alloy" "Release" .Release "Chart" .Chart) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "12345"
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: {{ .Values.alloy.image }}
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
          resources:
            {{- toYaml .Values.alloy.resources | nindent 12 }}
          ports:
            - name: http-metrics
              containerPort: 12345
              protocol: TCP
          startupProbe:
            httpGet:
              path: /-/ready
              port: http-metrics
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http-metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/ready
              port: http-metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: alloy-config
              mountPath: /etc/alloy/config.alloy
              subPath: config.alloy
            - name: pods-log
              mountPath: /var/log/pods
              readOnly: true
            - name: alloy-data
              mountPath: /var/lib/alloy/data
      tolerations:
        - effect: NoSchedule
          operator: Exists
      volumes:
        - name: alloy-config
          configMap:
            name: alloy-config
        - name: pods-log
          hostPath:
            path: /var/log/pods
        - name: alloy-data
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
{{- if .Values.clusterResources.manage }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: alloy
  apiGroup: rbac.authorization.k8s.io
{{- end }}
