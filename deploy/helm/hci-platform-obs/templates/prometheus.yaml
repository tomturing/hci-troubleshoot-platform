{{- /*
GatewayServerErrorFirstSeen 的守卫：这条规则靠「offset 时刻没数据」推断「序列刚诞生」，
但 offset 没数据有两种成因——序列真的刚诞生，或 offset 落进了本实例根本没有的那段数据。
后者不挡就是成片误报：staging 的 Prometheus 数据目录是 emptyDir，15:50:4x 因
checksum/rules 重启后 TSDB 全清，15:51:22 首次评估把发布前早已存在的 9 条 5xx 序列
全部判成「新出现」，一次性 firing 9 条 warning。
门控写在 rules/alert_rules.yml 里，只是表达式末尾一行 `and on()`，很容易被后来者
当成冗余括号删掉，所以守卫必须与它同文件同模板：删掉门控即渲染失败。
*/ -}}
{{- $rules := .Files.Get "rules/alert_rules.yml" -}}
{{- if not (contains "alert: GatewayServerErrorFirstSeen" $rules) -}}
{{- fail "GatewayServerErrorFirstSeen 规则不得删除：Traefik 的 code 标签是懒创建的，5xx 序列诞生前的增量对 rate()/increase() 是结构性盲区，删掉它等于把首次故障让给盲区" -}}
{{- end -}}
{{- $firstSeen := regexFind "(?s)alert: GatewayServerErrorFirstSeen.*" $rules -}}
{{- if not (contains "and on()" $firstSeen) -}}
{{- fail "GatewayServerErrorFirstSeen 缺少数据连续性门控（and on()）：Prometheus 重启后 offset 落进无数据区间，会把存量 5xx 序列全部判成刚诞生并一次性 firing" -}}
{{- end -}}
{{- if not (contains "traefik_service_requests_total offset 10m) > 0" $firstSeen) -}}
{{- fail "GatewayServerErrorFirstSeen 的门控必须依据指标族自身在 offset 时刻是否有数据，不能用全局 up：job hci-services 有 18 个 target，只要有一个健康 up 就非空，单 Traefik 抓取中断时照样误报" -}}
{{- end -}}
{{- if .Values.prometheus.enabled }}
---
# Prometheus Deployment（prometheus-config ConfigMap 在 configs.yaml，这样
# checksum/config 才能覆盖到它的内容）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  revisionHistoryLimit: 3  # 只保留最近 3 个 ReplicaSet，避免空 RS 僵尸积累
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        {{- include "hci.labels" . | nindent 8 }}
        app.kubernetes.io/name: prometheus
      annotations:
        # ConfigMap 变了却不重启 Pod，就会让「配置已合入」变成假象（ArgoCD 同步了
        # ConfigMap，进程还跑旧的）。按整个 configs.yaml 与告警规则文件算哈希，
        # 任一变更都触发一次滚动重启。
        checksum/config: {{ include (print $.Template.BasePath "/configs.yaml") . | sha256sum }}
        checksum/rules: {{ .Files.Get "rules/alert_rules.yml" | sha256sum }}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image | default "prom/prometheus:v2.52.0" }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-alert-rules
        - name: storage
          emptyDir: {}
---
# Prometheus 告警规则 ConfigMap（H-4 改进）
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  hci-rules.yml: |
{{ .Files.Get "rules/alert_rules.yml" | indent 4 }}
{{- end }}
{{- if .Values.prometheus.enabled }}
---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: prometheus
---
# Prometheus ServiceAccount（需要权限读取 Pod 注解）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
{{- /*
  ClusterRole/ClusterRoleBinding 已迁移到 hci-platform-infra Chart 统一管理。
  保留条件开关，仅在 clusterResources.manage=true 时渲染（用于本地调试）。
*/ -}}
{{- if .Values.clusterResources.manage }}
---
# ClusterRole：允许 Prometheus 发现 K8s Pod
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-hci
  labels:
    {{- include "hci.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - endpoints
      - services
      - nodes
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-hci
  labels:
    {{- include "hci.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-hci
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Values.namespace }}
{{- end }}
{{- end }}
