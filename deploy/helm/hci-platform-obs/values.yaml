# =============================================================================
# hci-platform-obs — 可观测性栈配置
# 部署目标：namespace hci-observability（由本 Chart 自行创建）
# 三个业务环境（dev/staging/prod）共用同一个可观测性栈。
# ClusterRole/ClusterRoleBinding 已迁移至 hci-platform-infra Chart 统一管理。
# =============================================================================

# 可观测性栈部署的命名空间（本 Chart 自行创建）
namespace: hci-observability

# 日志采集（Alloy）命名空间白名单。
# 历史教训：这里曾写死 hci|hci-sim-dev|hci-observability|argocd，而实际环境
# 命名空间是 hci-staging / hci-sim-staging / hci-dsh —— 白名单从未跟上环境改名，
# 结果 staging **一条业务日志都没进 Loki**，发布期间的 502 无任何现场记录
# （2026-10-30 复盘时才发现）。新增环境时必须同步此列表。
# Prometheus 不再依赖它：改成全命名空间 Pod 发现 + prometheus.io/scrape 注解
# 门控（见 templates/prometheus.yaml），从根上消除「白名单漏了 = 永久盲区」。
scrapeNamespaces:
  - hci-dev
  - hci-staging
  - hci-prod
  - hci-sim-dev
  - hci-sim-staging
  - hci-dsh
  - hci-observability
  - argocd

# 兼容历史字段（仅当 scrapeNamespaces 为空时兼为 Alloy 白名单兼底）
scrapeNamespace: hci

# ======================== 集群级资源管理开关 ==================================
# ClusterRole/ClusterRoleBinding 已迁移到 hci-platform-infra，此处默认 false。
# 仅在本地 helm install 调试时置 true。
clusterResources:
  manage: false

# ======================== 全局路由配置 ========================================
global:
  # path（默认）：通过路径前缀 /grafana/ 访问 Grafana
  # subdomain：通过 grafana.<domain> 访问（需 DNS 通配符记录）
  routingMode: "path"
  # 平台根域名，subdomain 模式必填
  domain: "hci.local"
  # 公开访问完整 URL（协议+域名+端口），path 模式时用于 Grafana ROOT_URL
  publicUrl: ""

# ======================== Ingress (Traefik) ==================================
ingress:
  enabled: true   # obs chart 部署即暴露 Grafana，无需 env repo 额外覆盖
  className: traefik
  annotations: {}
  # Grafana 路由优先级，需高于主站 / 回退路由，避免 /grafana 被 customer-ui 吞掉
  grafanaRouterPriority: "2000"

# ======================== 敏感配置（由 env 仓库 environments/dev/values.yaml 提供）
secrets:
  grafanaAdminPassword: ""  # 由 hci-platform-env 环境仓库覆盖，此处留空避免弱密码默认值
  feishuWebhookUrl: ""      # 飞书机器人 Webhook URL，由 hci-platform-env 环境仓库覆盖

# ======================== 组件配置 ===========================================
loki:
  image: grafana/loki:3.4.2
  storage: 2Gi
  # StorageClass 说明：
  #   - 存量安装：保持 local-path（PVC storageClassName 创建后不可变，upgrade 无法修改）
  #   - 全新安装：可改为 local-path-retain（Retain 策略，卸载后 PV 保留，更安全）
  storageClass: local-path
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

tempo:
  image: grafana/tempo:2.6.1
  storage: 2Gi
  # StorageClass 说明：同 loki，存量安装保持 local-path
  storageClass: local-path
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

prometheus:
  enabled: true
  image: prom/prometheus:v2.52.0
  # TSDB 数据目录必须是 PVC，不得回退 emptyDir。
  # 2026-10-30 那次成片误报的物理根因就在 emptyDir：checksum/rules 变化触发重启
  # → TSDB 全清 → GatewayServerErrorFirstSeen 的 `offset 10m` 落进本实例没有的
  # 数据区间 → 存量 5xx 序列全被判成「刚诞生」，一次性 firing 9 条。
  # 持久化后，「配置变更重启」不再等于「丢掉判断依据」，告警语义才成立。
  #
  # 容量 10Gi 的来源（不是拍脑袋）：现网实测启动 78 分钟 TSDB 占用 13.7 MB
  # ≈ 253 MB/天，retention 7d ≈ 1.8 GB；10Gi 留约 5 倍余量给服务与序列增长
  # （每新增一个 5xx code/service/method 组合就多一条序列）。
  # 单节点磁盘 2.1T / 可用 1010G，10Gi 占比可忽略。
  # StorageClass 同 loki/tempo：存量安装保持 local-path（PVC storageClassName
  # 创建后不可变，upgrade 改不了）；全新安装可换 local-path-retain。
  storage: 10Gi
  storageClass: local-path
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

alloy:
  image: grafana/alloy:v1.10.2
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

grafana:
  image: grafana/grafana:11.5.2
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# LimitRange：为 hci-observability 命名空间设置容器默认资源和上限
limitRange:
  enabled: true
  defaultRequest:
    cpu: "50m"
    memory: "64Mi"
  defaultLimit:
    cpu: "2"
    memory: "2Gi"
  max:
    cpu: "4"
    memory: "4Gi"

# ======================== Langfuse v3 ========================================
langfuse:
  enabled: true

  # ---------------------------------------------------------------------------
  # 无头初始化（Headless Initialization）
  # 首次启动（DB 为空）时，langfuse-server 自动创建 org / project / 初始用户
  # 及其 API Key，无需在 Web UI 手动配置。
  # project 的 public/secret key 直接复用 .Values.langfuse.publicKey/secretKey
  # （即 agent-service SDK 注入的同一对 key），保证 SDK 上线即可写入 trace。
  # 各环境在环境仓库（environments/<env>/values.yaml）的 langfuse.init 中按环境覆盖。
  # ---------------------------------------------------------------------------
  init:
    enabled: false
    orgId: ""
    orgName: "HCI"
    projectId: ""
    projectName: "hci"
    userEmail: ""
    userName: ""
    userPassword: ""

  server:
    image: langfuse/langfuse:3
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  worker:
    image: langfuse/langfuse-worker:3
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  clickhouse:
    image: clickhouse/clickhouse-server:24
    storage: 2Gi
    storageClass: local-path
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        # ClickHouse jemalloc 缓存导致 RSS 持续增长（resident 可达 2.18GiB），
        # 2Gi limit 下 WebUI trace 列表查询触发 MEMORY_LIMIT_EXCEEDED，
        # 导致 Langfuse WebUI 无法显示新 trace。提升至 4Gi 保证查询余量。
        memory: "4Gi"
  minio:
    image: minio/minio:latest
    storage: 2Gi
    storageClass: local-path
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
