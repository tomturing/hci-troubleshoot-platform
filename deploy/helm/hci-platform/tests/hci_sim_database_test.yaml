suite: "hci_sim database isolation"
templates:
  - hci-sim-db-credentials.yaml
  - hci-sim-db-migration-trigger.yaml
  - hci-sim-db-migrations.yaml
  - hooks/hci-sim-db-migrate-job.yaml
tests:
  - it: "默认不创建 hci_sim 数据库资源"
    asserts:
      - hasDocuments:
          count: 0

  - it: "启用后所有数据库密码都通过 Secret 引用注入"
    set:
      hciSimDatabase.enabled: true
      hciSimDatabase.migratorPassword: "migration-test-secret"
      hciSimDatabase.runtimePassword: "runtime-test-secret"
    templates:
      - hooks/hci-sim-db-migrate-job.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.name
          value: hci-secrets
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.key
          value: POSTGRES_PASSWORD
      - notExists:
          path: spec.template.spec.containers[0].env[2].value
      - equal:
          path: spec.template.spec.containers[0].env[9].name
          value: PLATFORM_DATABASE
      - equal:
          path: spec.template.spec.containers[0].env[9].value
          value: hci_troubleshoot
      - equal:
          path: spec.template.spec.containers[0].env[7].valueFrom.secretKeyRef.name
          value: hci-sim-db-credentials
      - equal:
          path: spec.template.spec.containers[0].env[8].valueFrom.secretKeyRef.name
          value: hci-sim-db-credentials
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "role_exists"
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "DO .*CREATE ROLE"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "GRANT CONNECT, CREATE ON DATABASE"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "REVOKE CREATE ON DATABASE"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "REVOKE CONNECT ON DATABASE.*FROM PUBLIC"

  - it: "迁移凭据以 wave -10 PreSync hook 提前创建"
    set:
      hciSimDatabase.enabled: true
      hciSimDatabase.migratorPassword: "migration-test-secret"
      hciSimDatabase.runtimePassword: "runtime-test-secret"
    templates:
      - hci-sim-db-credentials.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-10"

  - it: "迁移 SQL 以 wave -9 PreSync hook 提前创建"
    set:
      hciSimDatabase.enabled: true
      hciSimDatabase.migratorPassword: "migration-test-secret"
      hciSimDatabase.runtimePassword: "runtime-test-secret"
    templates:
      - hci-sim-db-migrations.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-9"
      - exists:
          path: data["000001_control_plane.sql"]
      - exists:
          path: data["000002_fix_p0p1_defects.sql"]
      - exists:
          path: data["000003_controlplane_bundle_lifecycle.sql"]
      - exists:
          path: data["000004_bundle_activation.sql"]
      - exists:
          path: data["000005_minimize_control_plane.sql"]
      - exists:
          path: data["000006_fixture_asset_revision.sql"]
      - exists:
          path: data["000007_qkv_task_template_v2.sql"]
      - exists:
          path: data["000008_unified_version_contract.sql"]

  - it: "普通迁移触发器暴露稳定 digest，驱动 migration-only 自动同步"
    set:
      hciSimDatabase.enabled: true
      hciSimDatabase.migratorPassword: "migration-test-secret"
      hciSimDatabase.runtimePassword: "runtime-test-secret"
    templates:
      - hci-sim-db-migration-trigger.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/hook"]
      - equal:
          path: metadata.labels["hci-platform.dev/ordinary-sync-trigger"]
          value: "true"
      - matchRegex:
          path: data.migration_revision
          pattern: "^[a-f0-9]{64}$"
      - equal:
          path: data.migration_file_count
          value: "8"
      # 凭证存在性与轮换也是 hook-only 变更：必须能在普通资源上看见，否则轮换密码
      # 不会触发 sync，Secret 永远停在旧值。
      - equal:
          path: data.credentials_secret
          value: hci-sim-db-credentials
      - equal:
          path: data.credentials_revision
          value: "1"

  - it: "递增 credentialsRevision 会让触发器变化，从而顶出 OutOfSync"
    set:
      hciSimDatabase.enabled: true
      hciSimDatabase.migratorPassword: "migration-test-secret"
      hciSimDatabase.runtimePassword: "runtime-test-secret"
      hciSimDatabase.credentialsRevision: "2"
    templates:
      - hci-sim-db-migration-trigger.yaml
    asserts:
      - equal:
          path: data.credentials_revision
          value: "2"

  - it: "迁移 Job 在依赖之后以 wave -8 执行"
    set:
      hciSimDatabase.enabled: true
      hciSimDatabase.migratorPassword: "migration-test-secret"
      hciSimDatabase.runtimePassword: "runtime-test-secret"
    templates:
      - hooks/hci-sim-db-migrate-job.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-8"
      # 依赖缺失时 Pod 停在 CreateContainerConfigError，容器内前置校验来不及执行。
      # 没有 activeDeadlineSeconds 时 Job 永不失败，整个 sync 永久挂起。
      - equal:
          path: spec.activeDeadlineSeconds
          value: 600
      - matchRegex:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          pattern: "HookFailed"
