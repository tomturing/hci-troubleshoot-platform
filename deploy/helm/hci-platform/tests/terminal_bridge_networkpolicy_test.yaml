suite: "Terminal Bridge NetworkPolicy"
templates:
  - terminal-bridge/networkpolicy.yaml
tests:
  - it: "关闭 Bridge 时不渲染网络策略"
    asserts:
      - hasDocuments:
          count: 0

  - it: "启用后只允许 Traefik 入站和 hci-sim/DNS/Tempo 出站"
    set:
      terminalBridge.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: terminal-bridge
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - equal:
          path: spec.egress[1].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: hci-sim-dev
      - equal:
          path: spec.egress[1].ports[0].port
          value: 2222
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels.k8s-app
          value: kube-dns
      - equal:
          path: spec.egress[2].to[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: tempo

  - it: "允许 Prometheus 抓取 /metrics（否则目标永远 down）"
    set:
      terminalBridge.enabled: true
    asserts:
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: hci-observability
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: prometheus
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 9999

  - it: "网络策略可显式关闭以支持迁移期诊断"
    set:
      terminalBridge.enabled: true
      terminalBridge.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
