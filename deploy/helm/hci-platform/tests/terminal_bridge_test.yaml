# terminal_bridge Pod 化部署回归测试
suite: "Terminal Bridge 部署配置测试"
templates:
  - terminal-bridge/deployment.yaml
tests:
  - it: "默认关闭时不应渲染集群 Bridge"
    asserts:
      - hasDocuments:
          count: 0

  - it: "启用后必须使用 cluster 模式、三级探针和 Prometheus 注解"
    set:
      terminalBridge.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: --mode=cluster
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health/live
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health/ready
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health/live
      - equal:
          path: metadata.name
          value: terminal-bridge
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: same-origin
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: "必须按非 root 安全基线运行"
    set:
      terminalBridge.enabled: true
      workloadDefaults.securityContext.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: "SFTP 下载必须显式落在持久卷上"
    set:
      terminalBridge.enabled: true
    asserts:
      # 未显式指定时，一旦根文件系统只读或 $HOME 不可写，
      # 下载的取证文件会落到临时目录，Pod 重建即丢。
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HCI_BRIDGE_SFTP_DIR
            value: /var/lib/terminal-bridge/downloads
      - matchRegex:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          pattern: ^/var/lib/terminal-bridge$
