# Customer UI 到 terminal_bridge 地址选择回归测试
suite: "Customer UI Bridge URL 配置测试"
templates:
  - customer-ui/deployment.yaml
tests:
  - it: "默认使用空字符串（ws://localhost:9999，Windows 本地 Bridge）"
    set:
      terminalBridge.enabled: true
      customerUI.terminalBridgeUrl: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TERMINAL_BRIDGE_URL
            value: ""

  - it: "可通过 customerUI.terminalBridgeUrl 覆盖默认值（例如 Linux Docker Bridge）"
    set:
      terminalBridge.enabled: false
      customerUI.terminalBridgeUrl: ws://172.28.24.21:9999
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TERMINAL_BRIDGE_URL
            value: ws://172.28.24.21:9999

  - it: "terminalBridge.enabled 不影响 Customer UI 的默认行为"
    set:
      terminalBridge.enabled: true
      customerUI.terminalBridgeUrl: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TERMINAL_BRIDGE_URL
            value: ""
