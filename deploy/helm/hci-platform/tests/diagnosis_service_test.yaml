suite: "Diagnosis Service 凭据配置测试"
templates:
  - diagnosis-service/secret.yaml
tests:
  - it: "默认关闭时不渲染 Diagnosis 资源"
    asserts:
      - hasDocuments:
          count: 0

  - it: "未指定已有 Secret 时由 Chart 创建专用凭据 Secret"
    templates:
      - diagnosis-service/secret.yaml
    set:
      diagnosisService.enabled: true
      secrets.collectorSigningPrivateKeyB64: "test-collector-private-key"
      secrets.collectorSigningKeyId: "test-collector-key"
      secrets.diagnosisEncryptionPrivateKeyB64: "test-encryption-private-key"
      secrets.diagnosisEncryptionKeyId: "test-encryption-key"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: diagnosis-service-signing

  - it: "指定已有 Secret 时不再由 Chart 渲染私钥"
    templates:
      - diagnosis-service/secret.yaml
    set:
      diagnosisService.enabled: true
      diagnosisService.existingCredentialsSecret: diagnosis-service-managed-credentials
    asserts:
      - hasDocuments:
          count: 0
