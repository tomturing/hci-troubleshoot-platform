suite: "Diagnosis Service 同源身份代理测试"
templates:
  - secret.yaml
  - configmap.yaml
  - customer-ui/deployment.yaml
  - admin-ui/deployment.yaml
  - ingress.yaml
  - admin-ui/ingress.yaml
tests:
  - it: "PR-D②关后门：Secret 不再派生服务端 Bearer Header"
    template: secret.yaml
    set:
      diagnosisService.enabled: true
      diagnosisService.identityMode: "internal"
      secrets.internalApiToken: "test-internal-token"
    asserts:
      # 锁定：INTERNAL_API_AUTHORIZATION 共享令牌键已删除，禁止后门回归。
      - isNull:
          path: stringData.INTERNAL_API_AUTHORIZATION

  - it: "Gateway 身份模式显式跟随 Diagnosis Service"
    template: configmap.yaml
    set:
      diagnosisService.identityMode: "oidc"
    asserts:
      - equal:
          path: data.DIAGNOSIS_IDENTITY_MODE
          value: "oidc"

  - it: "internal 模式不再为 Customer UI 注入服务端身份（B1）"
    template: customer-ui/deployment.yaml
    set:
      diagnosisService.enabled: true
      diagnosisService.identityMode: "internal"
      diagnosisService.internalIdentity.tenantId: "staging-tenant"
      diagnosisService.internalIdentity.customerActorId: "staging-customer-ui"
      global.namespace: "hci-staging"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOMER_API_AUTHORIZATION
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOMER_API_TENANT_ID
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOMER_API_ACTOR_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_GATEWAY_UPSTREAM
            value: http://api-gateway.hci-staging.svc.cluster.local:8000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DIAGNOSIS_SERVICE_UPSTREAM
            value: http://diagnosis-service.hci-staging.svc.cluster.local:8008
      - isNull:
          path: spec.template.metadata.annotations["checksum/diagnosis-internal-auth"]

  - it: "internal 模式为 Admin UI 注入服务端身份"
    template: admin-ui/deployment.yaml
    set:
      diagnosisService.enabled: true
      diagnosisService.identityMode: "internal"
      diagnosisService.internalIdentity.tenantId: "staging-tenant"
      diagnosisService.internalIdentity.adminActorId: "staging-admin-ui"
      global.namespace: "hci-staging"
    asserts:
      # PR-D②关后门：锁定 ADMIN_API_AUTHORIZATION（共享令牌）env 不再注入。
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_API_AUTHORIZATION
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_API_TENANT_ID
            value: staging-tenant
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_API_ACTOR_ID
            value: staging-admin-ui
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_GATEWAY_UPSTREAM
            value: http://api-gateway.hci-staging.svc.cluster.local:8000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DIAGNOSIS_SERVICE_UPSTREAM
            value: http://diagnosis-service.hci-staging.svc.cluster.local:8008
      - isNotNull:
          path: spec.template.metadata.annotations["checksum/diagnosis-internal-auth"]

  - it: "OIDC 模式不覆盖 Customer UI 浏览器身份"
    template: customer-ui/deployment.yaml
    set:
      diagnosisService.enabled: true
      diagnosisService.identityMode: "oidc"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOMER_API_AUTHORIZATION
      - isNull:
          path: spec.template.metadata.annotations

  - it: "OIDC 模式不覆盖 Admin UI 浏览器身份"
    template: admin-ui/deployment.yaml
    set:
      diagnosisService.enabled: true
      diagnosisService.identityMode: "oidc"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_API_AUTHORIZATION
      - isNull:
          path: spec.template.metadata.annotations

  - it: "internal 模式 API 流量直达网关，不再经 Customer UI 代理（B1）"
    template: ingress.yaml
    set:
      ingress.enabled: true
      diagnosisService.enabled: true
      diagnosisService.identityMode: "internal"
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: diagnosis-service
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.name
          value: api-gateway

  - it: "管理入口公网封禁默认关闭，开启后引用 internal-guard 中间件（B1）"
    template: admin-ui/ingress.yaml
    set:
      ingress.enabled: true
      adminUI.ingress.enabled: true
      diagnosisService.enabled: true
      diagnosisService.identityMode: "internal"
      global.namespace: "hci-staging"
    asserts:
      - isNull:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]

  - it: "开启 adminUI.ingress.internalGuard 后按连字符格式引用中间件"
    template: admin-ui/ingress.yaml
    set:
      ingress.enabled: true
      adminUI.ingress.enabled: true
      adminUI.ingress.internalGuard.enabled: true
      diagnosisService.enabled: true
      diagnosisService.identityMode: "internal"
      global.namespace: "hci-staging"
    asserts:
      # helm unittest 默认 release 名为 RELEASE-NAME（CI: helm unittest deploy/helm/hci-platform --strict）
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: hci-staging-RELEASE-NAME-admin-guard@kubernetescrd
