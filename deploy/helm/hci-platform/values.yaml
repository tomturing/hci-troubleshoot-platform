# =============================================================================
# HCI 智能排障平台 - Helm Chart 默认配置
# =============================================================================

# ======================== 全局配置 ==========================================
global:
  namespace: hci-troubleshoot
  # Kubernetes DNS 集群域；UI Nginx 动态解析内部 Service 时必须使用完整 FQDN。
  clusterDomain: cluster.local

  # ⚠️  路由模式 — 必须与 DNS 环境匹配，改错会导致所有服务 404
  # --------------------------------------------------------------------
  # "path"      路径路由（推荐，单 IP / 单域名场景）
  #             acli.sangfor.com.cn/         → customer-ui
  #             acli.sangfor.com.cn/api      → api-gateway
  #             acli.sangfor.com.cn/grafana  → grafana
  #             ✅ 只需一条 A 记录指向服务器 IP
  #             ⚠️  admin-ui 已分离到独立 Ingress（内网隔离方案）
  #                 详见: docs/deploy/admin-ui-internal-isolation.md
  #
  # "subdomain" 子域名路由（需要 DNS 通配符 *.your-domain.com）
  #             api.your-domain.com          → api-gateway
  #             admin.your-domain.com        → admin-ui（⚠️ 未隔离）
  #             your-domain.com              → customer-ui
  #             grafana.your-domain.com      → grafana
  #             ❌ 如果没有通配符 DNS 记录，此模式下子域名全部无法访问
  #             ⚠️  subdomain 模式下 admin-ui 仍通过公网入口暴露
  #                 内网隔离方案仅适用于 routingMode=path
  # --------------------------------------------------------------------
  routingMode: "path"

  # 平台根域名，routingMode=subdomain 时用于拼接子域名
  # routingMode=path 时此字段不影响路由，仅用于 Grafana Root URL 等辅助配置
  domain: "hci.local"

  # 公开访问完整 URL（协议+域名+端口），routingMode=path 时必填
  # 用途：Grafana GF_SERVER_ROOT_URL、前端 publicPath 等
  # 示例：http://acli.sangfor.com.cn:4888
  publicUrl: ""
  imageRegistry: "" # 私有镜像仓库前缀，如 "registry.example.com/"
  imagePullPolicy: IfNotPresent
  # ghcr.io 镜像拉取 Secret 名称；非空时自动挂载到所有工作负载
  imagePullSecretName: ""
  # ghcr.io 认证用户名（与 secrets.ghcrToken 配合使用）
  imagePullUser: ""

# ======================== 集群级资源管理开关 ==================================
# 集群级资源（StorageClass / ClusterRole / ClusterRoleBinding）已迁移到
# 独立 Chart hci-platform-infra，由 ArgoCD Application hci-platform-infra 管理。
#
# manage: false（默认）→ 本 Chart 不渲染集群级资源，由 hci-platform-infra 负责
# manage: true         → 本 Chart 自行渲染（仅用于本地 helm install 调试）
clusterResources:
  manage: false

# ======================== 数据层资源管理开关 ==================================
# 数据层（PostgreSQL / Redis / 备份 CronJob）已迁移到
# 独立 Chart hci-platform-data，由各环境专属 ArgoCD Application 管理。
#
# manage: false（默认）→ 本 Chart 不渲染数据层资源，由 hci-platform-data 负责
# manage: true         → 本 Chart 自行渲染（仅用于本地 helm install 调试）
#
# ⚠️  DUAL-009 危险操作警告：
# 若当前 postgres/redis 已由 hci-platform 管理（manage=true 历史部署），
# 手动执行 helm upgrade 时若不显式传 --set dataLayer.manage=true，
# Helm 会将已有 StatefulSet 视为孤立资源并删除，导致数据库消失！
# 正确操作：始终使用 scripts/ops/k3s-deploy-dualrepo.sh（自动检测当前状态）
dataLayer:
  manage: false
  # 双重开关防护（C-1）：仅当明确知道要删除数据层时，才可同时设置mange=false + forceDelete=true
  # 默认必须为 false，防止误操作导致 StatefulSet 被 Helm 删除
  forceDelete: false

# ======================== 可观测性层资源管理开关 ================================
# 可观测性栈（Prometheus/Loki/Tempo/Grafana/Promtail）已迁移到
# 独立 Chart hci-platform-obs，由 ArgoCD Application hci-platform-obs 管理。
#
# manage: false（默认）→ 本 Chart 不渲染可观测性资源，由 hci-platform-obs 负责
# manage: true         → 本 Chart 自行渲染（仅用于本地 helm install 调试）
observabilityLayer:
  manage: false

workloadDefaults:
  securityContext:
    enabled: true
    # J-3 Pod 安全上下文基线（OWASP K8s Top 10：避免以 root 运行）
    # 所有业务 Pod 统一以 uid=1000/gid=1000 的非 root 用户运行
    # 若特定镜像无法以非 root 运行，在该服务的 values 中覆盖此配置
    pod:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    # J-3 容器安全上下文基线：删除所有 Linux capabilities，禁止提权
    container:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      # readOnlyRootFilesystem 需要应用侧配合（tmpDir 挂载等），默认关闭
      # 待所有服务适配后启用（见 J-3 里程碑二）
      readOnlyRootFilesystem: false
  scheduling:
    antiAffinity:
      # 软反亲和：单节点不阻塞调度，多节点优先分散副本
      enabled: true
      topologyKey: kubernetes.io/hostname
      weight: 100
    topologySpread:
      enabled: true
      topologyKey: kubernetes.io/hostname
      maxSkew: 1
      whenUnsatisfiable: ScheduleAnyway
  pdb:
    # 仅对副本数 > 1 的服务生成 PDB
    enabled: true
    minAvailable: 1
  limitRange:
    # 为命名空间设置容器资源默认值和上限，防止无 limits 的容器打爆节点
    enabled: true
    defaultRequest:
      cpu: "50m"
      memory: "64Mi"
    defaultLimit:
      cpu: "2"
      memory: "2Gi"
    max:
      cpu: "4"
      memory: "8Gi"

# ======================== PostgreSQL ========================================
postgres:
  enabled: true
  image: pgvector/pgvector:pg15 # 含 pgvector 扩展，支持向量检索
  storage: 5Gi
  # ⚠️ StorageClass 说明：
  #   - 存量安装：保持 local-path（StatefulSet storageClass 为不可变字段，无法 upgrade 修改）
  #     现有 PV 已通过 kubectl patch pv 直接改为 Retain policy
  #   - 全新安装：可改为 local-path-retain（自动 Retain policy，更安全）
  storageClass: local-path
  # NodePort 对外暴露端口（仅 dev 环境，生产环境留空）
  nodePort: ""
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  # pg_dump 定时全量备份（每天 UTC 02:00，保留 30 天）
  backup:
    enabled: true
    schedule: "0 2 * * *"
    hostPath: "/srv/hci/backups/postgres"

# ======================== Redis =============================================
redis:
  enabled: true
  image: redis:7
  storage: 1Gi
  storageClass: local-path
  resources:
    requests:
      cpu: "50m"
      memory: "16Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# ======================== API Gateway =======================================
apiGateway:
  replicaCount: 1
  checksumAnnotations: true
  image:
    repository: hci-api-gateway
    tag: latest
  port: 8000
  # hci-sim 控制面默认关闭，环境仓库必须显式启用并通过 Secret 注入 token。
  hciSim:
    enabled: false
    url: http://hci-sim.hci-sim-dev.svc:8080
    controlTokenSecretName: hci-sim-gateway-credentials
    controlTokenSecretKey: control-plane-token
  resources:
    requests:
      cpu: "50m"
      memory: "96Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ======================== Case Service ======================================
caseService:
  replicaCount: 1
  image:
    repository: hci-case-service
    tag: latest
  port: 8001
  resources:
    requests:
      cpu: "50m"
      memory: "96Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ======================== Conversation Service ==============================
conversationService:
  replicaCount: 1
  image:
    repository: hci-conversation-service
    tag: latest
  port: 8002
  # 设为 true 后 Pod 使用 dnsPolicy:None + 真实公网 DNS（114.114.114.114）
  externalDns: false
  # ReAct 引擎开关
  reactEnabled: "false"
  resources:
    requests:
      cpu: "50m"
      memory: "96Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ======================== Scheduler Service =================================
schedulerService:
  replicaCount: 1
  image:
    repository: hci-scheduler-service
    tag: latest
  port: 8003
  resources:
    requests:
      cpu: "50m"
      memory: "96Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ======================== KB Service ========================================
kbService:
  enabled: true
  replicaCount: 1
  checksumAnnotations: true
  image:
    repository: hci-kb-service
    tag: latest
  port: 8004
  # Catalog 基线持久化：页面新增/修改的 Catalog 基线（acli_command_catalog.json / resolution_catalog.json）
  # 默认写入容器可写层，pod 重建后回滚到镜像层导致修改丢失。
  # 开启后挂载 PVC，initContainer 首次从镜像拷贝基线（仅缺失时拷贝，保护已有修改），
  # 之后页面修改持久化到 PVC，pod 重建后保留。
  # 关闭（enabled: false）则回退为镜像内只读基线（兼容旧行为，但页面修改不持久）。
  persistence:
    enabled: true
    # 留空使用集群默认 StorageClass；如需 RWX（多副本）需指定支持 ReadWriteMany 的 storageClass。
    storageClass: ""
    size: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  # Embedding 配置（LLM 调用使用顶级 llm.baseUrl 配置）
  llmEmbeddingModel: "embedding-3"
  embeddingDim: 1536
  embeddingTimeoutSec: "60.0"
  minSimilarity: 0.3
  # KBD 分类与识图模型配置（注入为 CLASSIFY_MODEL / VISION_MODEL 环境变量）
  # 两者均已在 DashScope 端点验证可用且支持多模态
  classifyModel: "kimi-k2.5"
  visionModel: "kimi-k2.5"
  # 信号抽取应显式选择擅长结构化长 JSON 的模型；留空时回退到 classifyModel。
  extractSignalsModel: ""
  classifyMaxTokens: "2048"
  # Vision LLM 单次调用超时（秒），注入为 LLM_VISION_TIMEOUT 环境变量
  # 注意：data-pipeline 提交超时（180s）需大于此值，预留重试和启动时间
  # SDK max_retries=2，实际最大等待时间 = llmVisionTimeoutSec × 3
  llmVisionTimeoutSec: "120.0"
  # Classify LLM 单次调用超时（秒），注入为 LLM_CLASSIFY_TIMEOUT 环境变量
  # 注意：data-pipeline API_TIMEOUT（90s）需大于此值，避免上游成功但客户端超时
  # SDK max_retries=2，实际最大等待时间 = llmClassifyTimeoutSec × 3
  llmClassifyTimeoutSec: "120.0"
  # 通用 LLM 超时（秒），作为默认回退值（注入为 LLM_TIMEOUT 环境变量）
  llmTimeoutSec: "120.0"
  # Vision 业务层总尝试次数（包含首次调用），避免 SDK 与业务重试相乘
  visionMaxAttempts: "2"
  # Vision LLM 全局并发数（全局信号量上限，注入为 VISION_GLOBAL_CONCURRENCY）
  visionGlobalConcurrency: "3"
  # KBD 三类 LLM（VISION/CLASSIFY/EXTRACT）共用的进程级总并发上限。
  # 必须不高于 Provider 实际并发配额；默认复用 Vision 上限，避免阶段并行后相互打爆限流。
  llmGlobalConcurrency: "3"
  # 服务中断后无进展批量任务的收敛窗口（秒）；需覆盖正常单条 LLM 最长执行时间。
  batchStaleAfterSeconds: "600"
  # 信号抽取专用输出预算和 JSON 格式纠错次数。长度截断不会按相同策略重试。
  extractSignalsMaxTokens: "16384"
  extractSignalsFormatMaxAttempts: "2"
  # 是否启用 LLM 思维链（注入为 LLM_ENABLE_THINKING，默认关闭）
  enableThinking: "false"
  # KBD 数据管道 Job 配置（符合 Twelve-Factor App 配置规范）
  pipelineJob:
    enabled: false
    image: "" # 默认为空以使用 kbService 的容器镜像，或指定自定义镜像
    persistence:
      existingClaim: "kbd-cache"

# ======================== Diagnosis Service =================================
diagnosisService:
  # 默认关闭，配置正式身份和 Collector 签名密钥后再按环境启用。
  enabled: false
  # 非空时引用由 KMS/External Secrets/运维流程预置的 Secret，Chart 不再渲染私钥。
  # Secret 必须包含 COLLECTOR_SIGNING_* 与 DIAGNOSIS_ENCRYPTION_* 四个键。
  existingCredentialsSecret: ""
  replicaCount: 1
  image:
    repository: diagnosis-service
    tag: latest
  port: 8008
  identityMode: "internal"
  # internal 模式由 Customer/Admin Nginx 在服务端注入统一内部身份；令牌只从 hci-secrets 读取。
  # 同一环境共用 tenant_id 以保证客户工作台与管理台看到同一批诊断资源，actor_id 用于审计区分。
  internalIdentity:
    tenantId: "hci-platform"
    customerActorId: "customer-ui"
    adminActorId: "admin-ui"
  oidcIssuer: ""
  oidcAudience: ""
  oidcJwksUrl: ""
  # 默认由当前 UI Origin（来源）的 Nginx 同源转发；外部对象存储时改为独立上传域名。
  directUploadBaseUrl: "/"
  # 浏览器发起分片直传时允许的 Customer/Admin UI Origin（来源），逗号分隔，禁止使用 *。
  allowedOrigins: ""
  objectStorageMode: "local"
  # 精简 P0 证据不足时转人工审核；P1 自动补采需显式开启。
  automaticSupplementEnabled: false
  persistence:
    size: "20Gi"
    storageClassName: ""
  worker:
    replicaCount: 1
    metricsPort: 9108
    pollSeconds: "2.0"
    staleSeconds: "1800"
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "2"
        memory: "2Gi"
  resources:
    requests:
      cpu: "50m"
      memory: "96Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ======================== Customer UI =======================================
customerUI:
  replicaCount: 1
  # 可显式指定浏览器到 Bridge 的 WebSocket 地址。为空时：terminalBridge.enabled=true 使用同源
  # /terminal-bridge；否则保持桌面模式空配置并回退到浏览器所在机器的 localhost:9999。
  terminalBridgeUrl: ""
  image:
    repository: hci-customer-ui
    tag: latest
  port: 80
  resources:
    requests:
      cpu: "10m"
      memory: "16Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"

# ======================== Terminal Bridge ===================================
# 本地 K3s 端到端联调时启用；生产/云端默认关闭，继续使用 Windows 桌面客户端。
terminalBridge:
  enabled: false
  replicaCount: 1
  image:
    repository: hci-terminal-bridge
    tag: latest
  port: 9999
  # cluster 模式默认只接受同源浏览器连接，禁止作为任意网页可调用的内网 SSH 跳板。
  allowedOrigins: "same-origin"
  logStorageSizeLimit: "256Mi"
  # bridge.log 达到 64 MiB 后滚动为 bridge.log.1，避免 Pod 临时盘被持续写满。
  logFileMaxBytes: "67108864"
  execTimeoutSeconds: 120
  execMaxOutputBytes: 4194304
  artifactRetentionDays: 30
  artifactCleanupSchedule: "17 3 * * *"
  otelEndpoint: "http://tempo.hci-observability.svc.cluster.local:4318"
  hostKeyPolicy: "accept-new"
  # 集群模式的最小网络边界。Bridge 只从 Traefik 接收同源入口流量，
  # 只向 DNS、hci-sim SSH 和 Tempo 发起出站连接；未显式配置时不允许
  # 通过 NetworkPolicy 静默放行真实 HCI 网段。
  networkPolicy:
    enabled: true
    ingressNamespace: traefik
    hciSimNamespace: hci-sim-dev
    hciSimSshPort: 2222
    observabilityNamespace: hci-observability
    dnsNamespace: kube-system
    dnsSelector:
      k8s-app: kube-dns
    tempoSelector:
      app.kubernetes.io/name: tempo
  persistence:
    enabled: true
    storageClass: local-path
    size: 512Mi
  resources:
    requests:
      cpu: "10m"
      memory: "16Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# ======================== Admin UI ==========================================
adminUI:
  replicaCount: 1
  image:
    repository: hci-admin-ui
    tag: latest
  port: 80
  resources:
    requests:
      cpu: "10m"
      memory: "16Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"
  # Admin UI 独立 Ingress 配置（内网隔离方案）
  # 使用 web entrypoint (端口 4888)，与 customer-ui (端口 4443) 端口隔离
  # 配合云厂商安全组 IP 白名单，实现 admin-ui 仅对管理员可访问
  ingress:
    enabled: false
    # entrypoint: web (HTTP 端口 4888，部署后需启用 TLS)
    # 或使用自定义 entrypoint（需先在 Traefik 配置）
    entrypoint: web
    # host: 留空时无 host 匹配（端口隔离场景）
    # 或配置内网域名如: admin.internal
    host: ""
    annotations: {}
    # TLS 配置（可选）
    # tls:
    #   - secretName: admin-tls
    #     hosts:
    #       - admin.internal

  # 路径路由模式下的 /admin 快捷访问（仅 dev 环境开启，prod/staging 不应启用）
  pathRoute:
    enabled: false
    prefix: "/admin"

# ======================== NetworkPolicy =====================================
networkPolicy:
  enabled: false

# ======================== HPA（水平弹性伸缩）=================================
hpa:
  enabled: false
  targetCPUUtilizationPercentage: 70
  apiGateway:
    maxReplicas: 3
  caseService:
    maxReplicas: 6
  conversationService:
    maxReplicas: 6

# ======================== Ingress (Traefik) =================================
ingress:
  enabled: true
  className: traefik
  annotations: {}
  grafanaRouterPriority: "2000"

# ======================== Phase 3: ReAct 引擎配置 ==============================
# SCP 平台 API 地址（用于调用 SCP 工具获取 VM/存储/网络信息）
scpBaseUrl: ""

# ======================== LLM Provider 配置（单一配置源）=========================
# 所有服务统一使用此处的 LLM 配置，由 hci.assistantRegistry 模板自动生成 assistantRegistryJson
# 切换模型时只需修改 llm.baseUrl 和 llm.model，无需手动维护 JSON 字符串
llm:
  baseUrl: "https://coding.dashscope.aliyuncs.com/v1"
  model: "glm-5"
  apiCompletionsPath: "/chat/completions"
  readTimeoutSec: 120.0

llmVision:
  # 多模态专属 Vision 独立端点，默认为空时自动回退到 llm.baseUrl
  baseUrl: ""

# ======================== 应用配置（非敏感 → ConfigMap）=====================
config:
  postgresHost: postgres
  postgresDb: hci_troubleshoot
  postgresUser: hci_admin
  redisUrl: "redis://redis:6379/0"
  logLevel: INFO
  otelEndpoint: "http://tempo.hci-observability.svc.cluster.local:4317"
  k8sNamespace: hci-troubleshoot
  # 服务地址
  kbServiceUrl: "http://kb-service:8004"
  caseServiceUrl: "http://case-service:8001"
  conversationServiceUrl: "http://conversation-service:8002"
  diagnosisServiceUrl: "http://diagnosis-service:8008"
  # assistantRegistryJson 由 hci.assistantRegistry 模板自动生成，无需手动配置
  # 助手选择器显示控制：auto（智能判断）、true（强制显示）、false（强制隐藏）
  assistantShowSelector: "auto"

# ======================== 敏感配置（→ Secret）===============================
# 生产环境通过 helm install --set secrets.xxx=xxx 覆盖
secrets:
  postgresPassword: "dev_password_123"
  # LLM API Key（用于 dashscope 网关调用，由 kb-service/agent-service/conversation-service 共用）
  llmApiKey: ""
  # Vision 专属 API Key，默认为空时自动回退到 llmApiKey
  llmVisionApiKey: ""
  # 内部服务间 API 鉴权 Token
  internalApiToken: "hci-dev-internal-token"
  # Ed25519 原始私钥 Base64 及其稳定 key_id；生产环境必须由密钥管理系统覆盖。
  collectorSigningPrivateKeyB64: ""
  collectorSigningKeyId: ""
  diagnosisEncryptionPrivateKeyB64: ""
  diagnosisEncryptionKeyId: ""
  oidcPublicKeyPemB64: ""
  grafanaAdminPassword: "admin"
  # SCP 平台 认证 Token
  scpApiKey: ""

# ======================== 可观测性栈 ========================================
observability:
  enabled: true
  namespace: hci-observability
  loki:
    image: grafana/loki:latest
    storage: 2Gi
    storageClass: local-path
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
  tempo:
    image: grafana/tempo:2.6.1
    storage: 2Gi
    storageClass: local-path
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  alloy:
    image: grafana/alloy:v1.10.2
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "1"
        memory: "512Mi"
  grafana:
    image: grafana/grafana:latest
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
  prometheus:
    enabled: true
    image: prom/prometheus:v2.52.0
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# ======================== DB Migration（ArgoCD PreSync）===================
dbMigrate:
  enabled: true
  image:
    repository: "ghcr.io/tomturing/hci-troubleshoot-platform/db-migrate"
    tag: "latest"

# ======================== hci-sim DB（独立控制面）===========================
# 默认关闭，必须由环境仓库显式启用并提供两个独立密码。hci-sim 不得回退到
# config.postgresDb；迁移 Job 只连接 hci_sim，平台服务继续连接 hci_troubleshoot。
hciSimDatabase:
  enabled: false
  name: hci_sim
  ownerRole: hci_sim_owner
  migratorRole: hci_sim_migrator
  runtimeRole: hci_sim_runtime
  credentialsSecretName: hci-sim-db-credentials
  migratorPassword: ""
  runtimePassword: ""

# ======================== DB Seed（ArgoCD PostSync / Helm post-upgrade）===
# 自动加载 database/seeds/*.sql 到 PostgreSQL，初始化工具/Prompt/技能及显式标记的诊断 KBD 草稿样例
# 幂等：tool DO UPDATE（与代码对齐）；prompt/skill DO NOTHING（保护用户改动）
dbSeed:
  enabled: true
  image: "postgres:15-alpine"

# ======================== Smoke Test（ArgoCD PostSync）=====================
smokeTest:
  enabled: true
  timeoutSeconds: 120
  image: curlimages/curl:8.6.0

# ======================== ops-agent 服务配置 ==============================
opsAgent:
  enabled: false
  image:
    repository: "ghcr.io/p3n9w31/ops-agent"
    tag: "latest"
  service:
    type: ClusterIP
    port: 8006
  baseUrl: "http://ops-agent-service:8006"
  otelEndpoint: "http://hci-platform-otel-collector:4318"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  opsWeb:
    enabled: false
    nodePort: 30791

# ======================== Agent Service =====================================
agentService:
  replicaCount: 1
  image:
    repository: agent-service
    tag: latest
  port: 8005
  externalDns: false
  glmModel: "glm-5"
  reactEnabled: "false"
  pydanticAiEnabled: "false"
  confirmTimeoutSec: "120"
  # 本地 aCLI Catalog 未知命令：confirm=允许进入人工确认；deny=执行前拒绝（生产推荐）
  acliUnknownCommandPolicy: "confirm"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

# ======================== Langfuse 可观测性 ==================================
langfuse:
  enabled: false
  secretKey: ""
  publicKey: ""
  host: "http://langfuse-web:3000"
  # 默认展示经过字段级脱敏的业务输入输出；Vision 不上传图片 Base64。
  captureContent: true
  # 信号抽取需要审核 Prompt 与 JSON；内容仍会先经过密钥、Token 等敏感字段脱敏。
  captureExtractSignalsContent: true

# ======================== Eval Service ======================================
evalService:
  replicaCount: 1
  image:
    repository: eval-service
    tag: latest
  port: 8007
  prometheusUrl: "http://prometheus:9090"
  resources:
    requests:
      cpu: "50m"
      memory: "96Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
