apiVersion: v1
kind: ConfigMap
metadata:
  name: hci-common-config
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  # 数据库（非敏感）
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  POSTGRES_USER: {{ .Values.config.postgresUser | quote }}
  # Redis
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  # 服务间通信（K8s 内部 DNS）
  CASE_SERVICE_URL: "http://case-service:{{ .Values.caseService.port }}"
  CONVERSATION_SERVICE_URL: "http://conversation-service:{{ .Values.conversationService.port }}"
  SCHEDULER_SERVICE_URL: "http://scheduler-service:{{ .Values.schedulerService.port }}"
  # LLM 配置（从顶级 llm.* 配置读取，assistantRegistryJson 由模板自动生成）
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  # 多模态专属 Vision 独立端点，默认为空时自动回退到 llm.baseUrl
  LLM_VISION_BASE_URL: {{ .Values.llmVision.baseUrl | default .Values.llm.baseUrl | quote }}
  LLM_DEFAULT_MODEL: {{ .Values.llm.model | quote }}
  AI_COMPLETIONS_PATH: {{ .Values.llm.apiCompletionsPath | quote }}
  # KBD 分类与识图模型（可按环境覆盖，均已验证支持多模态）
  CLASSIFY_MODEL: {{ .Values.kbService.classifyModel | default "kimi-k2.5" | quote }}
  VISION_MODEL: {{ .Values.kbService.visionModel | default "kimi-k2.5" | quote }}
  # KBD Embedding 模型（向量召回使用，与 LLM_DEFAULT_MODEL 解耦，避免 chat 模型与 embedding 模型混用）
  # values.yaml kbService.llmEmbeddingModel 默认 "embedding-3"，按实际 LLM 网关支持的模型名覆盖
  LLM_EMBEDDING_MODEL: {{ .Values.kbService.llmEmbeddingModel | default "embedding-3" | quote }}
  KBD_MIN_SIMILARITY: {{ .Values.kbService.minSimilarity | default 0.3 | quote }}
  # Vision LLM 单次调用超时（秒）。默认 60s；生产环境请按 LLM 服务 SLA 调整。
  # 注意：SDK max_retries=2，实际最大等待时间 = LLM_TIMEOUT × 3
  LLM_TIMEOUT: {{ .Values.kbService.llmTimeoutSec | default "60.0" | quote }}
  # 是否启用 LLM 思维链（thinking）。默认关闭；开启时隐藏思考 token 会大幅拉长 Vision 调用延迟。
  # 单一开关同时作用于 vision_processor（识图）与 classify（分类）两个 LLM 调用点。
  LLM_ENABLE_THINKING: {{ .Values.kbService.enableThinking | default "false" | quote }}
  # Vision LLM 全局并发数（全局信号量上限）。设为 1 即串行执行，避免打爆 DashScope QPM/并发上限。
  VISION_GLOBAL_CONCURRENCY: {{ .Values.kbService.visionGlobalConcurrency | default "3" | quote }}
  # 可观测性
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  # Scheduler
  K8S_NAMESPACE: {{ .Values.config.k8sNamespace | quote }}
  K8S_IMAGE_PULL_SECRET: {{ .Values.global.imagePullSecretName | quote }}
  # Scheduler 可选配置（未设置时不渲染空字段）
  {{- if .Values.config.warmPoolSize }}
  WARM_POOL_SIZE: {{ .Values.config.warmPoolSize | quote }}
  {{- end }}
  {{- if .Values.config.maxPoolSize }}
  MAX_POOL_SIZE: {{ .Values.config.maxPoolSize | quote }}
  {{- end }}
  {{- if .Values.config.podIdleTimeout }}
  POD_IDLE_TIMEOUT: {{ .Values.config.podIdleTimeout | quote }}
  {{- end }}
  # AI 客户端超时（秒）
  AI_CLIENT_READ_TIMEOUT_SEC: {{ .Values.llm.readTimeoutSec | quote }}
  # 服务地址
  KB_SERVICE_URL: {{ .Values.config.kbServiceUrl | default "http://kb-service:8004" | quote }}
  KB_ENABLED: {{ .Values.kbService.enabled | toString | quote }}
  # 多助手注册表（3 个助手：htp-agent、ops-agent、pai-agent）
  ASSISTANT_REGISTRY_JSON: {{ include "hci.assistantRegistry" . | quote }}
  # 助手选择器显示控制（auto/true/false）
  ASSISTANT_SHOW_SELECTOR: {{ .Values.config.assistantShowSelector | default "auto" | quote }}
