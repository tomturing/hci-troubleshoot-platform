{{- if and .Values.ingress.enabled .Values.adminUI.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-ui-ingress
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-ui
  annotations:
    # 使用 web entrypoint (HTTP 端口 4888)
    # 部署后需在 Traefik 中启用 TLS: --entryPoints.web.http.tls=true
    # 或在云厂商 LB 层配置 TLS termination
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.adminUI.ingress.entrypoint | default "web" }}
    {{- with .Values.adminUI.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- if .Values.adminUI.ingress.host }}
    - host: {{ .Values.adminUI.ingress.host | quote }}
      http:
        paths:
          # Grafana 可观测性路径（通过 ExternalName Service 代理跨命名空间服务）
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana-observability
                port:
                  number: 3000
          # Langfuse 可观测性路径（通过 ExternalName Service 代理跨命名空间服务）
          - path: /langfuse
            pathType: Prefix
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          # Langfuse Next.js 需要的静态资源路径（必须在 /api 之前，避免被 api-gateway 吞掉）
          - path: /_next
            pathType: Prefix
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          # Langfuse 认证和 API 路径（必须在 /api 之前，避免被 api-gateway 吞掉）
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          - path: /api/public
            pathType: Prefix
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          - path: /api/trpc
            pathType: Prefix
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          # Langfuse 需要的精确路径资源
          - path: /icon.svg
            pathType: Exact
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          - path: /wordart-black.svg
            pathType: Exact
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          - path: /wordart-white.svg
            pathType: Exact
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          - path: /favicon.ico
            pathType: Exact
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          # Admin UI API 路径
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: {{ .Values.apiGateway.port }}
          # WebSocket 路径
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: {{ .Values.apiGateway.port }}
          # Admin UI 前端
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-ui
                port:
                  number: {{ .Values.adminUI.port }}
    {{- else }}
    # 无 host 时直接匹配所有请求（适用于端口隔离场景）
    - http:
        paths:
          # Grafana 可观测性路径（通过 ExternalName Service 代理跨命名空间服务）
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana-observability
                port:
                  number: 3000
          # Langfuse 可观测性路径（通过 ExternalName Service 代理跨命名空间服务）
          - path: /langfuse
            pathType: Prefix
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          # Langfuse Next.js 需要的静态资源路径（必须在 /api 之前，避免被 api-gateway 吞掉）
          - path: /_next
            pathType: Prefix
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          # Langfuse 认证和 API 路径（必须在 /api 之前，避免被 api-gateway 吞掉）
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          - path: /api/public
            pathType: Prefix
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          - path: /api/trpc
            pathType: Prefix
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          # Langfuse 需要的精确路径资源
          - path: /icon.svg
            pathType: Exact
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          - path: /wordart-black.svg
            pathType: Exact
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          - path: /wordart-white.svg
            pathType: Exact
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          - path: /favicon.ico
            pathType: Exact
            backend:
              service:
                name: langfuse-observability
                port:
                  number: 3000
          # Admin UI API 路径
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: {{ .Values.apiGateway.port }}
          # WebSocket 路径
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: {{ .Values.apiGateway.port }}
          # Admin UI 前端
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-ui
                port:
                  number: {{ .Values.adminUI.port }}
    {{- end }}
  {{- if .Values.adminUI.ingress.tls }}
  tls:
    {{- toYaml .Values.adminUI.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}