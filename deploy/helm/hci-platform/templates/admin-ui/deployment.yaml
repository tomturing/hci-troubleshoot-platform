apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-ui
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.podLabels" (dict "name" "admin-ui" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: {{ .Values.adminUI.replicaCount }}
  revisionHistoryLimit: 3  # 只保留最近 3 个 ReplicaSet，避免空 RS 僵尸积累
  selector:
    matchLabels:
      {{- include "hci.selectorLabels" (dict "name" "admin-ui" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      {{- /* 安全重构 L1：管理台身份上下文改由网关从 admin JWT 派生（X-Tenant-ID/X-Actor-ID），
             Admin UI 不再注入内部诊断身份，故移除随内部令牌轮换的滚动重启注解。 */}}
      labels:
        {{- include "hci.podLabels" (dict "name" "admin-ui" "Release" .Release "Chart" .Chart) | nindent 8 }}
    spec:
      {{- include "hci.workloadPodSpecExtras" (dict "root" . "name" "admin-ui") | nindent 6 }}
      # nginx 以非 root 用户（uid=1000）运行，需要 emptyDir 挂载可写目录
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-conf-d
          emptyDir: {}
      containers:
        - name: admin-ui
          image: {{ include "hci.image" (dict "global" .Values.global "image" .Values.adminUI.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "hci.workloadContainerSecurityContext" . | nindent 10 }}
          env:
            - name: DNS_RESOLVER
              value: "10.43.0.10"
            # Nginx 动态 resolver 不应用 Pod DNS search 后缀，必须使用完整 Service FQDN。
            - name: API_GATEWAY_UPSTREAM
              value: "http://api-gateway.{{ include "hci.namespace" . }}.svc.{{ .Values.global.clusterDomain }}:{{ .Values.apiGateway.port }}"
            - name: DIAGNOSIS_SERVICE_UPSTREAM
              value: "http://diagnosis-service.{{ include "hci.namespace" . }}.svc.{{ .Values.global.clusterDomain }}:{{ .Values.diagnosisService.port }}"
            # Admin UI 始终使用集群中的 terminal-bridge Pod（仿真测试）
            - name: TERMINAL_BRIDGE_URL
              value: "/terminal-bridge"
            # nginx 模板的 /terminal-bridge location 使用字面量 proxy_pass，Nginx 启动期
            # 即解析 upstream 主机名。镜像内烘焙的默认值 host.docker.internal 仅 Docker
            # Desktop 可解析，集群内会导致 [emerg] crashloop（D-027）。启用 terminal-bridge
            # 时指向 Service FQDN；未启用时该路径由同源 Ingress 接管，此处给回环占位地址，
            # 保证 Nginx 可启动、直连 Pod 的请求得到 502 而非进程崩溃。
            - name: TERMINAL_BRIDGE_UPSTREAM
              {{- if .Values.terminalBridge.enabled }}
              value: "http://terminal-bridge.{{ include "hci.namespace" . }}.svc.{{ .Values.global.clusterDomain }}:{{ .Values.terminalBridge.port }}"
              {{- else }}
              value: "http://127.0.0.1:9999"
              {{- end }}
            {{- /* 安全重构 L1：删除 ADMIN_API_TENANT_ID/ADMIN_API_ACTOR_ID 注入——管理台身份
                   上下文唯一来源收敛为网关对 admin JWT 的派生（X-Tenant-ID/X-Actor-ID），
                   Nginx 不再静态写死、也不以 $http_* 透传客户端头。见 docs/security/identity-resign.md §6。 */}}
          ports:
            - containerPort: {{ .Values.adminUI.port }}
              protocol: TCP
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.adminUI.port }}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.adminUI.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.adminUI.resources | nindent 12 }}
