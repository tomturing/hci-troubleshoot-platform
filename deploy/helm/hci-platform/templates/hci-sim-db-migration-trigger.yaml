{{- if .Values.hciSimDatabase.enabled }}
{{- $migrationPayload := "" }}
{{- $migrationFiles := .Files.Glob "hci-sim-migrations/*.sql" }}
{{- range $path, $_ := $migrationFiles }}
{{- $migrationPayload = printf "%s%s\n%s\n" $migrationPayload $path ($.Files.Get $path) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hci-sim-db-migration-trigger
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
    app.kubernetes.io/component: hci-sim-db-migrate
    hci-platform.dev/ordinary-sync-trigger: "true"
  annotations:
    # 该普通资源把迁移内容变化显式暴露给 ArgoCD；PreSync Hook 只负责执行顺序。
    hci-platform.dev/migration-trigger: "true"
data:
  migration_revision: {{ sha256sum $migrationPayload | quote }}
  migration_file_count: {{ len $migrationFiles | quote }}
  # 凭据的存在性与轮换同样是 hook-only 变更（hci-sim-db-credentials 是 PreSync hook，
  # 不参与漂移对比）。轮换密码时必须递增 hciSimDatabase.credentialsRevision，
  # 使本 ConfigMap 变化 -> OutOfSync -> 自动 sync -> wave -10 重建 Secret。
  # 刻意不写密码或其散列，避免在 ConfigMap 里留下可离线爆破的凭据指纹。
  credentials_secret: {{ .Values.hciSimDatabase.credentialsSecretName | quote }}
  credentials_revision: {{ .Values.hciSimDatabase.credentialsRevision | default "1" | quote }}
{{- end }}
