{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hci-ingress
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
  annotations:
    # 根据是否启用 TLS 选择 entrypoint
    # TLS 启用时使用 websecure（HTTPS，端口 4443），否则使用 web（HTTP，端口 4888）
    {{- if .Values.ingress.tls }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- if eq .Values.global.routingMode "subdomain" }}
    {{- /* 子域名路由模式：每个服务独占一个子域名，要求 DNS 有通配符记录 *.domain */}}
    - host: "api.{{ .Values.global.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: {{ .Values.apiGateway.port }}
    {{- /* admin-ui 子域名路由：仅在未启用独立 Ingress 时渲染 */}}
    {{- /* 若启用独立 Ingress (adminUI.ingress.enabled=true)，admin-ui 将通过专用入口访问 */}}
    {{- if not .Values.adminUI.ingress.enabled }}
    - host: "admin.{{ .Values.global.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-ui
                port:
                  number: {{ .Values.adminUI.port }}
    {{- end }}
    - host: "{{ .Values.global.domain }}"
      http:
        paths:
          {{- if .Values.terminalBridge.enabled }}
          # 本地集群调试 Bridge；同源 WebSocket，生产默认关闭。
          - path: /terminal-bridge
            pathType: Prefix
            backend:
              service:
                name: terminal-bridge
                port:
                  number: {{ .Values.terminalBridge.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-ui
                port:
                  number: {{ .Values.customerUI.port }}
    {{- else }}
    {{- /* 路径路由模式（默认）：单域名，路径区分服务，只需一条 A 记录 */}}
    {{- $host := "" }}
    {{- if .Values.global.publicUrl }}
      {{- /* 提取 hostname，去掉协议前缀和端口（Ingress host 字段不能含端口） */}}
      {{- $host = .Values.global.publicUrl | trimPrefix "https://" | trimPrefix "http://" | regexFind "^[^/:]+" }}
    {{- end }}
    - {{- if $host }} host: {{ $host | quote }}
      {{- end }}
      http:
        paths:
          # 后端 API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: {{ .Values.apiGateway.port }}
          # WebSocket
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: {{ .Values.apiGateway.port }}
          {{- if .Values.terminalBridge.enabled }}
          # 本地集群调试 Bridge；必须排在 customer-ui 的根路径回退之前。
          - path: /terminal-bridge
            pathType: Prefix
            backend:
              service:
                name: terminal-bridge
                port:
                  number: {{ .Values.terminalBridge.port }}
          {{- end }}
          # 客户端 UI（根路径）
          # 管理端 UI 已分离到独立 Ingress（admin-ui-ingress），使用 web entrypoint (端口 4888)
          # 详见: docs/deploy/admin-ui-internal-isolation.md
          {{- if .Values.adminUI.pathRoute.enabled }}
          - path: {{ .Values.adminUI.pathRoute.prefix | default "/admin" }}
            pathType: Prefix
            backend:
              service:
                name: admin-ui
                port:
                  number: {{ .Values.adminUI.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-ui
                port:
                  number: {{ .Values.customerUI.port }}
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
