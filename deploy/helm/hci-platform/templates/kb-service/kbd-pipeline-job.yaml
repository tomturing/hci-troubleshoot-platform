{{- if and .Values.kbService.enabled .Values.kbService.pipelineJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kbd-pipeline-job
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
    app.kubernetes.io/component: kbd-pipeline
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kbd-pipeline
        {{- include "hci.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- if .Values.global.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecretName }}
      {{- end }}
      containers:
        - name: kbd-pipeline
          image: {{ .Values.kbService.pipelineJob.image | default (include "hci.image" (dict "global" .Values.global "image" .Values.kbService.image)) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command: ["python", "-m", "kbd.run", "pipeline", "--excel"]
          envFrom:
            - configMapRef:
                name: hci-common-config
            - secretRef:
                name: hci-secrets
          env:
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.config.postgresUser .Values.secrets.postgresPassword .Values.config.postgresHost .Values.config.postgresDb | quote }}
          volumeMounts:
            - name: kbd-cache
              mountPath: /app/data-pipeline/kbd/cache
      volumes:
        - name: kbd-cache
          persistentVolumeClaim:
            claimName: {{ .Values.kbService.pipelineJob.persistence.existingClaim | default "kbd-cache" }}
{{- end }}
