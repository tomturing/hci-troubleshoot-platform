{{- if .Values.hciSimDatabase.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.hciSimDatabase.credentialsSecretName }}
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
  annotations:
    app.kubernetes.io/component: hci-sim-database
    # 保持 PreSync hook + wave -10（不得改为普通资源）：ArgoCD 在 PreSync hook 失败时
    # 不会进入 Sync 阶段，普通资源性质的依赖在全新环境永远等不到创建，首装会死锁。
    # 职责划分：本 hook 只负责"执行顺序"（先于 wave -9/-8 的 ConfigMap 与迁移 Job）；
    #   1. 存在性/轮换的可观测性 -> hci-sim-db-migration-trigger 的 credentials_* 字段；
    #   2. 卡在 CreateContainerConfigError 的挂死 -> 迁移 Job 的 activeDeadlineSeconds。
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-10"
type: Opaque
stringData:
  MIGRATOR_PASSWORD: {{ required "hciSimDatabase.migratorPassword must be set when hciSimDatabase.enabled=true" .Values.hciSimDatabase.migratorPassword | quote }}
  RUNTIME_PASSWORD: {{ required "hciSimDatabase.runtimePassword must be set when hciSimDatabase.enabled=true" .Values.hciSimDatabase.runtimePassword | quote }}
{{- end }}
