apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-service
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.podLabels" (dict "name" "case-service" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: {{ .Values.caseService.replicaCount }}
  revisionHistoryLimit: 3  # 只保留最近 3 个 ReplicaSet，避免空 RS 僵尸积累
  {{- if .Values.caseService.logCollectStorage.enabled }}
  {{- $rollout := .Values.caseService.logCollectStorage.rollout | default dict }}
  {{- if eq (get $rollout "strategy" | default "RollingUpdate" | toString) "Recreate" }}
  # 先停旧 Pod 再起新 Pod：仅适用于「同一 RWO 卷不允许两个 Pod 同时挂载」的存储。
  # 代价是发布期间有一段 endpoints 为空的窗口（2026-10-30 实测约 21s）。
  strategy:
    type: Recreate
  {{- else }}
  # 滚动发布：新 Pod Ready 之后才停旧 Pod，发布期间请求不会落到空 endpoints。
  #
  # 两个前提都已核实：
  # 1. 集群是单节点，local-path 的 RWO 卷允许同节点两个 Pod 同时挂载；
  # 2. 分片/元数据/合并的临时文件已按 pid + 随机串唯一命名
  #    （log_collect_storage._temp_for），双进程并存不会互相截断。
  # maxUnavailable 固定为 0，不开放配置：一旦放开 1，就是又回到「先杀后起」。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ get $rollout "maxSurge" | default 1 }}
      maxUnavailable: 0
  {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hci.selectorLabels" (dict "name" "case-service" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hci.podLabels" (dict "name" "case-service" "Release" .Release "Chart" .Chart) | nindent 8 }}
      annotations:
        {{- if .Values.caseService.checksumAnnotations }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.caseService.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      {{- with .Values.caseService.terminationGracePeriodSeconds }}
      # 在途请求最长可达几分钟（合并 20GiB 包），30s 会在中途 SIGKILL。
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- include "hci.workloadPodSpecExtras" (dict "root" . "name" "case-service") | nindent 6 }}
      containers:
        - name: case-service
          image: {{ include "hci.image" (dict "global" .Values.global "image" .Values.caseService.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "hci.workloadContainerSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.caseService.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hci-common-config
            - secretRef:
                name: hci-secrets
          env:
            - name: SERVICE_NAME
              value: "case-service"
            - name: SERVICE_PORT
              value: {{ .Values.caseService.port | quote }}
            - name: DATABASE_URL
              # 使用 Helm 渲染时 urlquery 对密码做 URL 编码，防止密码含 @ / : # 等特殊字符导致解析错误（PIT-022）
              value: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.config.postgresUser (.Values.secrets.postgresPassword | urlquery) .Values.config.postgresHost .Values.config.postgresDb | quote }}
            - name: LOG_COLLECT_STORAGE_ROOT
              # 显式写在 Deployment 里（而不是依赖镜像默认值）：存储路径与挂载点必须
              # 由同一处声明，运维一眼能看出分片落在哪个卷。
              value: {{ .Values.caseService.logCollectStorage.mountPath | quote }}
            - name: LOG_COLLECT_CHUNK_SIZE_BYTES
              # 分片大小决定单次 PUT 需要多长的网关读窗口。现场上行越慢，分片
              # 必须越小，否则请求会稳定撞上网关 60s 读超时并报成「平台返回
              # HTTP 502」。可按现场带宽下调（下限 1 MiB，上限 32 MiB）。
              #
              # 必须显式 `int64`：values 里的数字经 Helm 解析成 float64，
              # 直接 `quote` 会把 8388608 渲染成 "8.388608e+06"，
              # schema 里该字段是 int，容器启动即 pydantic ValidationError
              # （2026-10-30 staging 上 case-service 因此 CrashLoopBackOff）。
              value: {{ .Values.caseService.logCollectStorage.chunkSizeBytes | int64 | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.caseService.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.caseService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.caseService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          {{- include "hci.preStopLifecycle" (dict "root" . "key" "caseService") | nindent 10 }}
          resources:
            {{- toYaml .Values.caseService.resources | nindent 12 }}
          {{- if .Values.caseService.logCollectStorage.enabled }}
          volumeMounts:
            - name: case-service-log-collect
              mountPath: {{ .Values.caseService.logCollectStorage.mountPath | quote }}
          {{- end }}
      {{- if .Values.caseService.logCollectStorage.enabled }}
      volumes:
        - name: case-service-log-collect
          persistentVolumeClaim:
            claimName: case-service-log-collect
      {{- end }}
