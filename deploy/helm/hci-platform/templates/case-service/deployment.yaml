apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-service
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.podLabels" (dict "name" "case-service" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: {{ .Values.caseService.replicaCount }}
  revisionHistoryLimit: 3  # 只保留最近 3 个 ReplicaSet，避免空 RS 僵尸积累
  {{- if .Values.caseService.logCollectStorage.enabled }}
  # 日志存储是 RWO 卷 + 本地文件系统语义：两个 Pod 同时挂载会互相覆盖分片目录，
  # 部分 CSI 还会让滚动更新卡在 ContainerCreating。先停旧 Pod 再起新 Pod 是刻意取舍。
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "hci.selectorLabels" (dict "name" "case-service" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hci.podLabels" (dict "name" "case-service" "Release" .Release "Chart" .Chart) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.caseService.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      {{- include "hci.workloadPodSpecExtras" (dict "root" . "name" "case-service") | nindent 6 }}
      containers:
        - name: case-service
          image: {{ include "hci.image" (dict "global" .Values.global "image" .Values.caseService.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "hci.workloadContainerSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.caseService.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hci-common-config
            - secretRef:
                name: hci-secrets
          env:
            - name: SERVICE_NAME
              value: "case-service"
            - name: SERVICE_PORT
              value: {{ .Values.caseService.port | quote }}
            - name: DATABASE_URL
              # 使用 Helm 渲染时 urlquery 对密码做 URL 编码，防止密码含 @ / : # 等特殊字符导致解析错误（PIT-022）
              value: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.config.postgresUser (.Values.secrets.postgresPassword | urlquery) .Values.config.postgresHost .Values.config.postgresDb | quote }}
            - name: LOG_COLLECT_STORAGE_ROOT
              # 显式写在 Deployment 里（而不是依赖镜像默认值）：存储路径与挂载点必须
              # 由同一处声明，运维一眼能看出分片落在哪个卷。
              value: {{ .Values.caseService.logCollectStorage.mountPath | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.caseService.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.caseService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.caseService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.caseService.resources | nindent 12 }}
          {{- if .Values.caseService.logCollectStorage.enabled }}
          volumeMounts:
            - name: case-service-log-collect
              mountPath: {{ .Values.caseService.logCollectStorage.mountPath | quote }}
          {{- end }}
      {{- if .Values.caseService.logCollectStorage.enabled }}
      volumes:
        - name: case-service-log-collect
          persistentVolumeClaim:
            claimName: case-service-log-collect
      {{- end }}
