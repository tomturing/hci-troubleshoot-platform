{{- /* DEPLOY-001: 仅当 domain 非空且非 hci.local 时才强制要求强密码（空 domain 视同本地开发模式）*/}}
{{- if and (ne .Values.global.domain "") (ne .Values.global.domain "hci.local") (eq .Values.secrets.postgresPassword "dev_password_123") -}}
  {{- fail "❌ 检测到非开发域名，但 secrets.postgresPassword 仍为默认弱密码 'dev_password_123'，请在 override 文件中设置强密码。" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: hci-secrets
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}
  # 内部 API 鉴权
  INTERNAL_API_TOKEN: {{ .Values.secrets.internalApiToken | quote }}
  {{- if .Values.secrets.authRsaPrivateKeyPemB64 }}
  # auth-service RS256 固定签名私钥（Base64(PEM) 单行，避免多行 PEM 被 values 合并截断）。
  # 注入后 JWKS 跨重启稳定，杜绝"重启即全员掉线"；缺失且 authService.requirePersistentKey=true 时 auth-service 拒绝启动。
  AUTH_RSA_PRIVATE_KEY_PEM_B64: {{ .Values.secrets.authRsaPrivateKeyPemB64 | quote }}
  {{- end }}
  # LLM API Key（所有调用 LLM 的服务共用：kb-service / agent-service / conversation-service）
  # 服务通过 os.environ.get("LLM_API_KEY") 读取，ASSISTANT_REGISTRY_JSON 不再内嵌此 key
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | default "" | quote }}
  # Vision 专属 API Key，默认为空时自动回退到 llmApiKey
  LLM_VISION_API_KEY: {{ .Values.secrets.llmVisionApiKey | default .Values.secrets.llmApiKey | default "" | quote }}
  CLASSIFY_API_KEY: {{ .Values.secrets.classifyApiKey | default .Values.secrets.llmApiKey | default "" | quote }}
  EXTRACT_SIGNALS_API_KEY: {{ .Values.secrets.extractSignalsApiKey | default .Values.secrets.llmApiKey | default "" | quote }}
  # 根因信号专属 Key，默认为空时回退 EXTRACT_SIGNALS_API_KEY → LLM_API_KEY
  ROOT_SIGNAL_API_KEY: {{ .Values.secrets.rootSignalApiKey | default .Values.secrets.extractSignalsApiKey | default .Values.secrets.llmApiKey | default "" | quote }}
  # SCP 平台 认证 Token
  SCP_API_KEY: {{ .Values.secrets.scpApiKey | default "" | quote }}
  {{- if .Values.secrets.logCollectRelayToken }}
  # 5888 日志服务器（深信服代传服务）上传鉴权，对应 5888 侧的 ACLI_UPLOAD_TOKEN。
  # 空值时不注入该变量：case-service 检测不到值就不发认证头，与开启前行为完全一致。
  # 切换顺序不可颠倒 —— 先部署本项并确认请求已带 Bearer，再在 5888 设置
  # ACLI_UPLOAD_TOKEN 并重启；反过来会让所有代传立刻 401（见事件文档"切换顺序"）。
  LOG_COLLECT_RELAY_TOKEN: {{ .Values.secrets.logCollectRelayToken | quote }}
  {{- end }}
  {{- if .Values.secrets.p1TicketSecret }}
  # P1 直传票据密钥（对应 5888 的 ACLI_P1_TICKET_SECRET）。
  # 节点 acli 直传无法携带全局 Bearer，改为携带平台签发的 per-task 短期票据，
  # 由 5888 验签后放行。留空 = 不注入，case-service 检测不到即关闭票据能力，
  # 前端会把直传自动降级为平台中转，绝不会发出无凭据的直传。
  # 切换顺序：先在两处都配好密钥（本项 + 5888 环境变量）并重启，再观察 P1 是否恢复。
  LOG_COLLECT_P1_TICKET_SECRET: {{ .Values.secrets.p1TicketSecret | quote }}
  {{- end }}
  {{ if and .Values.langfuse .Values.langfuse.enabled }}
  # Langfuse 认证信息仅写入 Secret，不直接渲染到 Deployment/Job 环境值中。
  LANGFUSE_SECRET_KEY: {{ required "langfuse.enabled=true 时必须配置 langfuse.secretKey" .Values.langfuse.secretKey | quote }}
  LANGFUSE_PUBLIC_KEY: {{ required "langfuse.enabled=true 时必须配置 langfuse.publicKey" .Values.langfuse.publicKey | quote }}
  {{ end }}
{{- if .Values.secrets.ghcrToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"ghcr.io\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .Values.global.imagePullUser .Values.secrets.ghcrToken (printf "%s:%s" .Values.global.imagePullUser .Values.secrets.ghcrToken | b64enc) | b64enc }}
{{- end }}
