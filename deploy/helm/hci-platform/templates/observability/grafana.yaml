{{- if and .Values.observability.enabled .Values.observabilityLayer.manage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "hci.podLabels" (dict "name" "grafana" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "hci.selectorLabels" (dict "name" "grafana" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hci.podLabels" (dict "name" "grafana" "Release" .Release "Chart" .Chart) | nindent 8 }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image }}
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_ANONYMOUS_ORG_NAME
              value: "Main Org."
            # 禁用登录表单，防止匿名请求被重定向到 /login 页面
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            # 解决现代浏览器对 iframe 跨域 Cookie 的 SameSite 拦截问题
            - name: GF_SECURITY_COOKIE_SAMESITE
              value: "none"
            {{- if eq .Values.global.routingMode "subdomain" }}
            {{- /* 子域名路由模式：grafana.<domain>，需 DNS 通配符 */}}
            - name: GF_SERVER_DOMAIN
              value: {{ printf "grafana.%s" .Values.global.domain | quote }}
            - name: GF_SERVER_ROOT_URL
              value: {{ printf "http://grafana.%s/" .Values.global.domain | quote }}
            {{- else }}
            {{- /* 路径路由模式（默认）：通过 publicUrl/grafana/ 访问 */}}
            {{- if .Values.global.publicUrl }}
            - name: GF_SERVER_DOMAIN
              {{- /* 提取纯 hostname，去掉协议前缀和端口（GF_SERVER_DOMAIN 不能含端口）*/}}
              value: {{ .Values.global.publicUrl | trimPrefix "https://" | trimPrefix "http://" | regexFind "^[^/:]+" | quote }}
            - name: GF_SERVER_ROOT_URL
              value: {{ printf "%s/grafana/" .Values.global.publicUrl | quote }}
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            {{- else }}
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.observability.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            # Dashboard Provisioning 配置
            - name: grafana-dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            # Dashboard JSON 文件
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards/hci
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.observability.namespace }}
  labels:
    {{- include "hci.podLabels" (dict "name" "grafana" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "hci.selectorLabels" (dict "name" "grafana" "Release" .Release) | nindent 4 }}
{{- end }}
