apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-ui
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.podLabels" (dict "name" "customer-ui" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: {{ .Values.customerUI.replicaCount }}
  revisionHistoryLimit: 3  # 只保留最近 3 个 ReplicaSet，避免空 RS 僵尸积累
  selector:
    matchLabels:
      {{- include "hci.selectorLabels" (dict "name" "customer-ui" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      {{- if and .Values.diagnosisService.enabled (eq .Values.diagnosisService.identityMode "internal") }}
      annotations:
        checksum/diagnosis-internal-auth: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "hci.podLabels" (dict "name" "customer-ui" "Release" .Release "Chart" .Chart) | nindent 8 }}
    spec:
      {{- include "hci.workloadPodSpecExtras" (dict "root" . "name" "customer-ui") | nindent 6 }}
      # nginx 以非 root 用户（uid=1000）运行，需要 emptyDir 挂载可写目录
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-conf-d
          emptyDir: {}
      containers:
        - name: customer-ui
          image: {{ include "hci.image" (dict "global" .Values.global "image" .Values.customerUI.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "hci.workloadContainerSecurityContext" . | nindent 10 }}
          env:
            - name: DNS_RESOLVER
              value: "10.43.0.10"
            # Nginx 动态 resolver 不应用 Pod DNS search 后缀，必须使用完整 Service FQDN。
            - name: API_GATEWAY_UPSTREAM
              value: "http://api-gateway.{{ include "hci.namespace" . }}.svc.{{ .Values.global.clusterDomain }}:{{ .Values.apiGateway.port }}"
            - name: DIAGNOSIS_SERVICE_UPSTREAM
              value: "http://diagnosis-service.{{ include "hci.namespace" . }}.svc.{{ .Values.global.clusterDomain }}:{{ .Values.diagnosisService.port }}"
            - name: TERMINAL_BRIDGE_URL
              {{- if .Values.customerUI.terminalBridgeUrl }}
              value: {{ .Values.customerUI.terminalBridgeUrl | quote }}
              {{- else if .Values.terminalBridge.enabled }}
              value: "/terminal-bridge"
              {{- else }}
              value: ""
              {{- end }}
            - name: TERMINAL_BRIDGE_EXEC_TIMEOUT_SECONDS
              value: {{ .Values.terminalBridge.execTimeoutSeconds | quote }}
            {{- if and .Values.diagnosisService.enabled (eq .Values.diagnosisService.identityMode "internal") }}
            - name: CUSTOMER_API_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: hci-secrets
                  key: INTERNAL_API_AUTHORIZATION
            - name: CUSTOMER_API_TENANT_ID
              value: {{ required "diagnosisService internal 模式必须配置 diagnosisService.internalIdentity.tenantId" .Values.diagnosisService.internalIdentity.tenantId | quote }}
            - name: CUSTOMER_API_ACTOR_ID
              value: {{ required "diagnosisService internal 模式必须配置 diagnosisService.internalIdentity.customerActorId" .Values.diagnosisService.internalIdentity.customerActorId | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.customerUI.port }}
              protocol: TCP
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.customerUI.port }}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.customerUI.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.customerUI.resources | nindent 12 }}
