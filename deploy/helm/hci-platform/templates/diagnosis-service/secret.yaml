{{- if and .Values.diagnosisService.enabled (not .Values.diagnosisService.existingCredentialsSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: diagnosis-service-signing
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.podLabels" (dict "name" "diagnosis-service" "Release" .Release "Chart" .Chart) | nindent 4 }}
type: Opaque
stringData:
  # 仅 diagnosis-service 挂载，禁止通过公共 hci-secrets 向其他工作负载分发私钥。
  COLLECTOR_SIGNING_PRIVATE_KEY_B64: {{ required "diagnosisService.enabled=true 时必须配置 secrets.collectorSigningPrivateKeyB64" .Values.secrets.collectorSigningPrivateKeyB64 | quote }}
  COLLECTOR_SIGNING_KEY_ID: {{ required "diagnosisService.enabled=true 时必须配置 secrets.collectorSigningKeyId" .Values.secrets.collectorSigningKeyId | quote }}
  DIAGNOSIS_ENCRYPTION_PRIVATE_KEY_B64: {{ required "diagnosisService.enabled=true 时必须配置 secrets.diagnosisEncryptionPrivateKeyB64" .Values.secrets.diagnosisEncryptionPrivateKeyB64 | quote }}
  DIAGNOSIS_ENCRYPTION_KEY_ID: {{ required "diagnosisService.enabled=true 时必须配置 secrets.diagnosisEncryptionKeyId" .Values.secrets.diagnosisEncryptionKeyId | quote }}
  {{- if and (eq .Values.diagnosisService.identityMode "oidc") (not .Values.diagnosisService.oidcJwksUrl) }}
  OIDC_PUBLIC_KEY_PEM_B64: {{ required "diagnosisService.identityMode=oidc 时必须配置 secrets.oidcPublicKeyPemB64" .Values.secrets.oidcPublicKeyPemB64 | quote }}
  {{- else if .Values.secrets.oidcPublicKeyPemB64 }}
  OIDC_PUBLIC_KEY_PEM_B64: {{ .Values.secrets.oidcPublicKeyPemB64 | quote }}
  {{- end }}
{{- end }}
