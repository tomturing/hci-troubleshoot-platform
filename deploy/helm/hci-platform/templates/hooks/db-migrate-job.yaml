{{- if .Values.dbMigrate.enabled }}
# DB Schema 同步 Job — ArgoCD PreSync Hook
# 每次 ArgoCD Sync 前执行；入口脚本在空库先引导 Schema，再完成数据迁移和最终声明式收敛
#
# 工作模式：Ptah Compat 管理完整期望状态，migration-runner 管理版本化数据修复
#   1. 空库先由 desired_schema.sql 创建完整 Schema；存量库跳过此步骤
#   2. migration-runner 执行数据迁移，先修复存量数据再收敛约束
#   3. ptah-compat schema apply → desired_schema.sql（扩展/表/索引/函数/触发器）
#
# 开发者工作流：
#   修改 Schema 对象 → 编辑 database/desired_schema.sql
#   修改数据 → 新增 database/data-migrations/ 文件
#   提交 PR → CI 验证 → 合并 → 自动构建镜像 → ArgoCD sync → 本 Job 执行
apiVersion: batch/v1
kind: Job
metadata:
  {{- $tag := .Values.dbMigrate.image.tag | default "latest" | lower | replace "." "-" | replace "_" "-" | trunc 15 | trimSuffix "-" }}
  {{- $chartVer := .Chart.Version | lower | replace "." "" }}
  name: db-migrate-{{ $tag }}-{{ $chartVer }}
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    # D-011: 必须包含 HookFailed，否则 PreSync 失败后会残留 Job 并阻塞后续 re-sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookFailed
    helm.sh/hook-weight: "-5"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: db-migrate
        {{- include "hci.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- if .Values.global.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecretName }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534   # nobody（postgres:15-alpine 默认用户）
        fsGroup: 65534
      # initContainer：为 Ptah Compat dev-url 建立独立 atlas_dev 临时数据库（幂等）
      # Ptah Compat 在同版本的临时 PostgreSQL 库中预演变更，再应用到目标库
      initContainers:
        - name: init-atlas-dev
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              # 临时数据库与目标库使用相同的服务器和扩展二进制。
              psql "$DATABASE_URL" -tc \
                "SELECT 1 FROM pg_database WHERE datname='atlas_dev';" \
                | grep -q 1 || \
                psql "$DATABASE_URL" -c "CREATE DATABASE atlas_dev;"
              echo "初始化完成"
          env:
            - name: DATABASE_URL
              value: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.config.postgresUser (.Values.secrets.postgresPassword | urlquery) .Values.config.postgresHost .Values.config.postgresDb | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: db-migrate
          image: {{ .Values.dbMigrate.image.repository }}:{{ .Values.dbMigrate.image.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          # 使用镜像 ENTRYPOINT（/db-migrate.sh），无需覆盖 command
          env:
            - name: DATABASE_URL
              value: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.config.postgresUser (.Values.secrets.postgresPassword | urlquery) .Values.config.postgresHost .Values.config.postgresDb | quote }}
            - name: DEV_URL
              value: {{ printf "postgres://%s:%s@%s:5432/atlas_dev?sslmode=disable" .Values.config.postgresUser (.Values.secrets.postgresPassword | urlquery) .Values.config.postgresHost | quote }}
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
