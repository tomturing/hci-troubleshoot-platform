# Lease v2 当前使用进程内的原子配额 Tracker，因此必须保持单副本；多副本属于阶段 C/D 的共享 Store 范围。
replicaCount: 1

image:
  repository: hci-sim
  tag: dev-local
  pullPolicy: IfNotPresent

service:
  sshPort: 2222
  httpPort: 8080

runtime:
  environment: dev
  workers: 8
  queueSize: 128
  maxOutputBytes: 4096
  leaseIssuer: hci-platform
  leaseAudience: hci-sim
  fixtureVariant: positive-realistic
  existingSecret: hci-sim-credentials
  leaseKeySecretKey: lease-hmac-key
  hostKeySecretKey: ssh_host_key
  otlpEndpoint: http://tempo.hci-observability.svc:4318

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

networkPolicy:
  enabled: true
  terminalBridgeNamespace: hci-dev
  observabilityNamespace: hci-observability

resourceQuota:
  requestsCpu: "2"
  requestsMemory: 2Gi
  limitsCpu: "4"
  limitsMemory: 4Gi
  pods: "20"

podDisruptionBudget:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
