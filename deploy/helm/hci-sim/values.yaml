# Lease v2 当前使用进程内的原子配额 Tracker，因此必须保持单副本；多副本属于阶段 C/D 的共享 Store 范围。
replicaCount: 1

image:
  repository: hci-sim
  # 本地默认可运行；K3s overlay 必须提供 digest（不可变）。
  tag: dev-local
  digest: ""
  pullPolicy: IfNotPresent

service:
  sshPort: 2222
  httpPort: 8080

runtime:
  environment: dev
  workers: 8
  queueSize: 128
  maxOutputBytes: 4096
  leaseIssuer: hci-platform
  leaseAudience: hci-sim
  fixtureVariant: positive-realistic
  # dev-golden 明确表示该运行时是受审查的开发黄金 Fixture；它不能冒充主库 active revision。
  authorityScope: runtime_fixture
  activeRevision: 25
  existingSecret: hci-sim-credentials
  leaseKeySecretKey: lease-hmac-key
  controlTokenSecretKey: control-plane-token
  allowInsecureControlAPI: false
  sshHost: hci-sim.hci-sim-dev.svc
  hostKeySecretKey: ssh_host_key
  otlpEndpoint: http://tempo.hci-observability.svc:4318
  # 留空时 outbox 只做持久化和 processing 恢复，不会假标记 processed。
  outboxWebhookURL: ""
  outboxInterval: 2s
  outboxMaxAttempts: 8

database:
  # true 是 K3s 受管部署的默认值；本地单元测试可显式关闭。
  required: true
  existingSecret: hci-sim-runtime-credentials
  urlSecretKey: HCI_SIM_DATABASE_URL

fixture:
  # GitOps 发布集合只接受 chart 内置、经 PR 审查且 digest 固定的 manifest。
  # 每次集合或内容变化都会改变 Pod checksum 并触发失败关闭的滚动更新。
  defaultSupportID: "27123"
  manifestFiles:
    - files/kbd-27123-fixture-manifest.json
    - files/kbd-23821-fixture-manifest.json
  configMapName: hci-sim-fixture

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

networkPolicy:
  enabled: true
  terminalBridgeNamespace: hci-dev
  # 控制面调用方必须显式放行；默认与受管服务同 namespace。
  apiGatewayNamespace: hci-dev
  apiGatewayPort: 8000
  # sim-ssh 会话仅允许 conversation-service 读取权威 TestRun 上下文。
  conversationServiceNamespace: hci-dev
  observabilityNamespace: hci-observability
  # Runtime 写入独立 hci_sim 数据库；只允许访问受管 PostgreSQL Pod，禁止
  # 借助 namespace 级放行访问 hci-dev 中的其它工作负载。
  databaseNamespace: hci-dev
  databasePort: 5432
  databasePodSelector:
    app.kubernetes.io/name: postgres

resourceQuota:
  requestsCpu: "2"
  requestsMemory: 2Gi
  limitsCpu: "4"
  limitsMemory: 4Gi
  pods: "20"

podDisruptionBudget:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
