{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hci-sim-default-deny
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hci-sim-allow-required
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "hci-sim.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.terminalBridgeNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: terminal-bridge
      ports:
        - port: {{ .Values.service.sshPort }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
      ports:
        - port: {{ .Values.service.httpPort }}
          protocol: TCP
    # Admin UI 不直接访问 Runtime；api-gateway 调用 build/TestRun 控制面。
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.apiGatewayNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - port: {{ .Values.service.httpPort }}
          protocol: TCP
    # conversation-service 只读 TestRun 上下文。限定 namespace、Pod label 和
    # HTTP 端口，不能借此访问 SSH 端口或放行 hci-dev 中的其它工作负载。
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "networkPolicy.conversationServiceNamespace is required" .Values.networkPolicy.conversationServiceNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: conversation-service
      ports:
        - port: {{ .Values.service.httpPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
      ports:
        - port: 4318
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.apiGatewayNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - port: {{ .Values.networkPolicy.apiGatewayPort }}
          protocol: TCP
    {{- if .Values.database.required }}
    # Runtime 必须把 TestRun、Lease、Event 和 Result 持久化到独立 hci_sim
    # 数据库；仅放行 PostgreSQL Pod 的 5432，不能放行整个 hci-dev namespace。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "networkPolicy.databaseNamespace is required when database.required=true" .Values.networkPolicy.databaseNamespace }}
          podSelector:
            matchLabels:
              {{- required "networkPolicy.databasePodSelector is required when database.required=true" .Values.networkPolicy.databasePodSelector | toYaml | nindent 14 }}
      ports:
        - port: {{ required "networkPolicy.databasePort is required when database.required=true" .Values.networkPolicy.databasePort }}
          protocol: TCP
    {{- end }}
{{- end }}
