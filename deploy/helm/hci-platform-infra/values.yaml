# =============================================================================
# hci-platform-infra — 集群级资源配置
# 这些资源无法限定在某个 namespace 内，三个环境（dev/staging/prod）共用同一份。
# 由独立 ArgoCD Application（hci-platform-infra）管理，避免多个业务 Application
# 对同名集群资源产生竞争覆盖。
# =============================================================================

# Observability 栈部署的 namespace（ClusterRoleBinding 需要引用）
observabilityNamespace: hci-observability

# =============================================================================
# 运行时代码完整性防护
# =============================================================================
# 业务镜像内的 Python 源码（/app/app）是发布物的一部分，严禁再通过 ConfigMap、
# Secret、emptyDir、HostPath 或 PVC 覆盖。直接覆盖会令“镜像 tag 已升级”和“实际
# 运行代码”发生漂移，且该漂移无法由普通健康探针发现。
#
# hci-platform-infra 是唯一管理集群级资源的 Chart；因此将准入策略放在这里，
# 确保各环境在资源被写入 API Server 前就拒绝此类热补丁。
sourceCodeMountGuard:
  enabled: true
  protectedNamespaces:
    - hci-dev
    - hci-staging
    - hci-prod
