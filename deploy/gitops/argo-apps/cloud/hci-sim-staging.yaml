apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hci-sim-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: hci-platform
    app.kubernetes.io/component: hci-sim
  annotations:
    hci-platform.dev/immutable-image-required: "true"
    hci-platform.dev/image-source-revision: "8dc8eb551efbb87662be1b877da91ae1ac4f7519"
spec:
  project: default
  source:
    repoURL: https://github.com/tomturing/hci-troubleshoot-platform.git
    targetRevision: main
    path: deploy/helm/hci-sim
    helm:
      values: |
        image:
          repository: ghcr.io/tomturing/hci-troubleshoot-platform/hci-sim
          digest: "sha256:bfad885ae9254b9385df36ce787eee58b891be8db82abb15e7e543336e6ed3d2"
        networkPolicy:
          enabled: true
          terminalBridgeNamespace: hci-staging
          apiGatewayNamespace: hci-staging
          conversationServiceNamespace: hci-staging
          observabilityNamespace: hci-observability
          databaseNamespace: hci-staging
        database:
          required: true
          existingSecret: hci-sim-runtime-credentials
        runtime:
          environment: staging
          existingSecret: hci-sim-credentials
          authorityScope: dev_golden
          allowSyntheticPublish: false
          sshHost: hci-sim.hci-sim-staging.svc
  destination:
    server: https://kubernetes.default.svc
    namespace: hci-sim-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: hci-sim-credentials
      jsonPointers: ["/data"]
