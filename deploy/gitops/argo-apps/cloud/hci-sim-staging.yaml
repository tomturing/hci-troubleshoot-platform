apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hci-sim-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: hci-platform
    app.kubernetes.io/component: hci-sim
  annotations:
    hci-platform.dev/immutable-image-required: "true"
    hci-platform.dev/image-source-revision: "a6821c1413f78f542dd0480c4361baef79c3751f"
spec:
  project: default
  source:
    repoURL: https://github.com/tomturing/hci-troubleshoot-platform.git
    targetRevision: main
    path: deploy/helm/hci-sim
    helm:
      values: |
        image:
          repository: ghcr.io/tomturing/hci-troubleshoot-platform/hci-sim
          digest: "sha256:fcdfae29ccd0f87ce9a15e9c058b56a87d9e96ee9b79cf8af5c1504bceb78044"
        networkPolicy:
          enabled: true
          terminalBridgeNamespace: hci-staging
          apiGatewayNamespace: hci-staging
          conversationServiceNamespace: hci-staging
          observabilityNamespace: hci-observability
          databaseNamespace: hci-staging
        database:
          required: true
          existingSecret: hci-sim-runtime-credentials
        runtime:
          environment: staging
          existingSecret: hci-sim-credentials
          # 显式声明与网关引用「同名 key」INTERNAL_API_TOKEN，不依赖 chart 默认，防止二者脱钩再漂移。
          # 详见 docs/solution/events/2026-09-24-hci-sim控制面令牌双key漂移根治.md
          controlTokenSecretKey: INTERNAL_API_TOKEN
          authorityScope: dev_golden
          allowSyntheticPublish: false
          sshHost: hci-sim.hci-sim-staging.svc
  destination:
    server: https://kubernetes.default.svc
    namespace: hci-sim-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: hci-sim-credentials
      jsonPointers: ["/data"]
