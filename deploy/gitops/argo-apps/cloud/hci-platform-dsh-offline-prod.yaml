# =============================================================================
# ArgoCD Application: hci-platform-dsh-offline-prod
# HCI 单 Agent 离线诊断实例，生产环境保持手动同步。
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hci-platform-dsh-offline-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/description: "prod HCI 单 Agent 离线诊断 DSH（/dsh-offline，最新三插件组合）"
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://192.168.0.3:6443
    namespace: hci-dsh
  sources:
    - repoURL: https://github.com/tomturing/hci-troubleshoot-platform.git
      targetRevision: main
      path: deploy/helm/hci-platform-dsh
      helm:
        releaseName: hci-platform-dsh-offline
        valueFiles:
          - $values/environments/prod/values.yaml
          - $values/environments/prod/dsh-values.yaml
          - $values/environments/prod/dsh-offline-values.yaml
    - repoURL: https://github.com/tomturing/hci-platform-env.git
      targetRevision: main
      ref: values
  syncPolicy:
    # 生产环境默认手动同步
    syncOptions:
      - CreateNamespace=true
