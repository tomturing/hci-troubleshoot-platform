apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hci-sim-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: hci-platform
    app.kubernetes.io/component: hci-sim
  annotations:
    # 新 promotion 会同时更新源码 revision 与不可变 digest；旧制品来源无法反推时显式保留 legacy 状态。
    hci-platform.dev/immutable-image-required: "true"
    hci-platform.dev/image-source-revision: "9dfa780488a00c776011d8c1a2d715f020e0b2c1"
spec:
  project: default
  source:
    repoURL: https://github.com/tomturing/hci-troubleshoot-platform.git
    targetRevision: main
    path: deploy/helm/hci-sim
    helm:
      values: |
        image:
          repository: ghcr.io/tomturing/hci-troubleshoot-platform/hci-sim
          # 由 CI main 发布产物填充为 immutable manifest digest；禁止 tag/dev-local 漂移。
          digest: "sha256:2722e2f65cd959deca63221200135e6beb4e176335924366e30a86b656742511"
        database:
          required: true
          existingSecret: hci-sim-runtime-credentials
        runtime:
          existingSecret: hci-sim-credentials
          authorityScope: dev_golden
          activeRevision: 25
  destination:
    server: https://kubernetes.default.svc
    namespace: hci-sim-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: hci-sim-credentials
      jsonPointers: ["/data"]
