apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hci-sim-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: hci-platform
    app.kubernetes.io/component: hci-sim
  annotations:
    # 由发布流水线替换为已签名镜像 digest；未替换前禁止同步。
    hci-platform.dev/immutable-image-required: "true"
spec:
  project: default
  source:
    repoURL: https://github.com/tomturing/hci-troubleshoot-platform.git
    targetRevision: main
    path: deploy/helm/hci-sim
    helm:
      values: |
        image:
          repository: ghcr.io/tomturing/hci-troubleshoot-platform/hci-sim
          # 由 CI main 发布产物填充为 immutable manifest digest；禁止 tag/dev-local 漂移。
          digest: "sha256:6b608c44c80d6af70f8c625e2ecde1ba5b2e434d26eccc3642e61f9f1283e215"
        database:
          required: true
          existingSecret: hci-sim-runtime-credentials
        runtime:
          existingSecret: hci-sim-credentials
          authorityScope: dev_golden
          activeRevision: 25
  destination:
    server: https://kubernetes.default.svc
    namespace: hci-sim-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: hci-sim-credentials
      jsonPointers: ["/data"]
