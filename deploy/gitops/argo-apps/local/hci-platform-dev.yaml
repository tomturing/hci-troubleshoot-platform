apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hci-platform-dev
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: hci-dev
  sources:
    # 应用仓库：提供 Helm Chart
    - repoURL: https://github.com/tomturing/hci-troubleshoot-platform.git
      targetRevision: main
      path: deploy/helm/hci-platform
      helm:
        releaseName: hci-platform
        valueFiles:
          - $values/environments/dev/values.yaml
    # 环境仓库：提供环境差异配置
    - repoURL: https://github.com/tomturing/hci-platform-env.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # 失败自动重试：让与 hook 依赖/瞬态不可达相关的失败能够自动收敛
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - CreateNamespace=true
