# =============================================================================
# ArgoCD Application: hci-platform-dsh-offline-dev
#
# HCI 单 Agent 离线诊断 DSH。与旧 hci-platform-dsh-dev 共用 hci-dsh namespace
# 和预置凭据，但使用独立 release、Deployment、Service、Ingress path 与 emptyDir
# 家目录，因此两个 Harness 进程和会话空间互不覆盖。
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hci-platform-dsh-offline-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/description: "dev HCI 单 Agent 离线诊断 DSH（/dsh-offline，最新三插件组合）"
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: hci-dsh
  sources:
    - repoURL: https://github.com/tomturing/hci-troubleshoot-platform.git
      targetRevision: main
      path: deploy/helm/hci-platform-dsh
      helm:
        releaseName: hci-platform-dsh-offline
        valueFiles:
          - $values/environments/dev/values.yaml
          - $values/environments/dev/dsh-values.yaml
          - $values/environments/dev/dsh-offline-values.yaml
    - repoURL: https://github.com/tomturing/hci-platform-env.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - CreateNamespace=false
