# 环境仓库模板：dev
# 仅维护环境差异项，基础项由 deploy/helm/hci-platform/values.yaml 提供

global:
  environment: dev

apiGateway:
  image:
    repository: hci-api-gateway
    tag: "latest"

caseService:
  image:
    repository: hci-case-service
    tag: "latest"

conversationService:
  image:
    repository: hci-conversation-service
    tag: "latest"

schedulerService:
  image:
    repository: hci-scheduler-service
    tag: "latest"

kbService:
  image:
    repository: hci-kb-service
    tag: "latest"

diagnosisService:
  image:
    repository: diagnosis-service
    tag: "latest"

customerUI:
  image:
    repository: hci-customer-ui
    tag: "latest"

# dev 环境允许将 terminal_bridge 作为 Pod 运行，便于端到端可观测联调。
terminalBridge:
  enabled: true
  replicaCount: 1
  allowedOrigins: "same-origin"
  image:
    repository: terminal-bridge
    tag: "latest"
  networkPolicy:
    enabled: true
    ingressNamespace: kube-system
    hciSimNamespace: hci-sim-dev
    hciSimSshPort: 2222
    observabilityNamespace: hci-observability

adminUI:
  image:
    repository: hci-admin-ui
    tag: "latest"

# ======================== DSH 诊断工作台 =====================================
# 独立 chart hci-platform-dsh，部署在独立命名空间 hci-dsh。
# repository 必须写短名 dsh（无 hci- 前缀），与 CI 构建矩阵的服务名一致，
# 否则会与 CI 推送地址不符导致 ImagePullBackOff。
dsh:
  image:
    repository: dsh
    tag: "latest"
  # 本地不存在客户日志回收目录 /sf/log，关闭 hostPath 挂载避免 Pod 长期 Pending
  customerLogs:
    enabled: false
  llmSecretName: ""
