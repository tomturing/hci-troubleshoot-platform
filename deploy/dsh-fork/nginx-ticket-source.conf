# 0.2（192.168.0.2）上的只读工单包服务样板
#
# 用途：DSH 容器通过 HTTP 拉取 `/sf/log/<工单号>/<工单号>.zip`，避免把 SSH
# 私钥放进集群。放到 /etc/nginx/conf.d/ticket-source.conf 后 `nginx -s reload`。
#
# 四个约束都是刻意的，不要为了"方便调试"放宽：
#   1. `allow/deny` 只放行 0.4 的节点 IP —— 这个端口不做任何鉴权，IP 是唯一门槛；
#   2. `autoindex off` —— 只能按精确 URL 取，不能枚举 954 个工单号；
#   3. location 正则要求"目录名与文件名必须一致" —— 即使 URL 编码或路径穿越，
#      可访问面也被收敛到 `<Q\d{13}>/<Q\d{13}>.zip`；
#   4. `limit_rate` —— 单个 93G 级包会打满千兆，影响同网段的生产流量。
#
# 端口选择：实测 80/443/8080/8081 均空闲（0.2 上 nginx 已安装但未监听 80）。

server {
    listen 8081;
    server_name _;

    allow 192.168.0.4;
    deny all;

    autoindex off;
    root /sf/log;

    # 只放行工单包：`\1` 反向引用强制"目录名与文件名相同"，正则本身即约束，
    # 不依赖 location 里的 if（nginx 的 if 是已知的陷阱区）。
    location ~ ^/(Q\d{13})/\1\.zip$ {
        # 断点续传：DSH 侧用 Range 续传被中断的大包。
        add_header Accept-Ranges bytes always;
        # 限速 100 MiB/s，约 840 Mbps；可按内网余量调整。
        limit_rate 100m;
        # 只读，不允许任何写方法。
        limit_except GET HEAD {
            deny all;
        }
    }

    # 其余路径一律 403（不看目录、不列文件）。
    location / {
        return 403;
    }
}
