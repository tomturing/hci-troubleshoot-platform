apiVersion: v1
kind: Secret
metadata:
  name: hci-secrets
  namespace: hci-troubleshoot
  labels:
    helm.sh/chart: hci-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: hci-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "dev_password_123"
  GF_SECURITY_ADMIN_PASSWORD: "admin"
  # 内部 API 鉴权
  INTERNAL_API_TOKEN: "hci-dev-internal-token"
  # LLM API Key（所有调用 LLM 的服务共用：kb-service / agent-service / conversation-service）
  # 服务通过 os.environ.get("LLM_API_KEY") 读取，ASSISTANT_REGISTRY_JSON 不再内嵌此 key
  LLM_API_KEY: ""
  # Vision 专属 API Key，默认为空时自动回退到 llmApiKey
  LLM_VISION_API_KEY: ""
  CLASSIFY_API_KEY: ""
  EXTRACT_SIGNALS_API_KEY: ""
  # 根因信号专属 Key，默认为空时回退 EXTRACT_SIGNALS_API_KEY → LLM_API_KEY
  ROOT_SIGNAL_API_KEY: ""
  # SCP 平台 认证 Token
  SCP_API_KEY: ""
  
