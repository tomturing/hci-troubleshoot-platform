apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-service
  namespace: hci-troubleshoot
  labels:
    app.kubernetes.io/name: case-service
    app.kubernetes.io/instance: RELEASE-NAME
    helm.sh/chart: hci-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: hci-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3  # 只保留最近 3 个 ReplicaSet，避免空 RS 僵尸积累
  # 日志存储是 RWO 卷 + 本地文件系统语义：两个 Pod 同时挂载会互相覆盖分片目录，
  # 部分 CSI 还会让滚动更新卡在 ContainerCreating。先停旧 Pod 再起新 Pod 是刻意取舍。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: case-service
      app.kubernetes.io/instance: RELEASE-NAME
  template:
    metadata:
      labels:
        app.kubernetes.io/name: case-service
        app.kubernetes.io/instance: RELEASE-NAME
        helm.sh/chart: hci-platform-0.1.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: hci-platform
      annotations:
        checksum/config: d1892da4dcf80b1073d009e744eb5577f22a67bec23345248eb3e0edccb5ae50
        checksum/secret: 7fa81f57cbdacce26e645b784504be5620ec8d62e7cfde783957d23bfdf6f547
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      
      securityContext:
      
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
      
                    app.kubernetes.io/name: case-service
                    app.kubernetes.io/instance: RELEASE-NAME
                topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: "ScheduleAnyway"
          labelSelector:
            matchLabels:
      
              app.kubernetes.io/name: case-service
              app.kubernetes.io/instance: RELEASE-NAME
      containers:
        - name: case-service
          image: hci-case-service:latest
          imagePullPolicy: IfNotPresent
          
          securityContext:
          
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hci-common-config
            - secretRef:
                name: hci-secrets
          env:
            - name: SERVICE_NAME
              value: "case-service"
            - name: SERVICE_PORT
              value: "8001"
            - name: DATABASE_URL
              # 使用 Helm 渲染时 urlquery 对密码做 URL 编码，防止密码含 @ / : # 等特殊字符导致解析错误（PIT-022）
              value: "postgresql+asyncpg://hci_admin:dev_password_123@postgres:5432/hci_troubleshoot"
            - name: LOG_COLLECT_STORAGE_ROOT
              # 显式写在 Deployment 里（而不是依赖镜像默认值）：存储路径与挂载点必须
              # 由同一处声明，运维一眼能看出分片落在哪个卷。
              value: "/var/lib/log-collect"
            - name: LOG_COLLECT_CHUNK_SIZE_BYTES
              # 分片大小决定单次 PUT 需要多长的网关读窗口。现场上行越慢，分片
              # 必须越小，否则请求会稳定撞上网关 60s 读超时并报成「平台返回
              # HTTP 502」。可按现场带宽下调（下限 1 MiB，上限 32 MiB）。
              #
              # 必须显式 `int64`：values 里的数字经 Helm 解析成 float64，
              # 直接 `quote` 会把 8388608 渲染成 "8.388608e+06"，
              # schema 里该字段是 int，容器启动即 pydantic ValidationError
              # （2026-10-30 staging 上 case-service 因此 CrashLoopBackOff）。
              value: "16777216"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 96Mi
          volumeMounts:
            - name: case-service-log-collect
              mountPath: "/var/lib/log-collect"
      volumes:
        - name: case-service-log-collect
          persistentVolumeClaim:
            claimName: case-service-log-collect
