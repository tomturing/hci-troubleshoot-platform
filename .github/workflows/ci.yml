name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发原因"
        required: false
        default: "手动构建镜像"
      promote_target:
        description: "手动发布目标（仅 main 分支；both=dev→staging，all=dev→staging→prod，含 db-migrate 镜像自动同步）"
        required: false
        type: choice
        options:
          - none
          - dev
          - staging
          - prod
          - both
          - all
        default: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR 检查可以取消旧运行；main 发布不能取消，否则后续空 diff push
  # 可能吞掉上一轮尚未完成的镜像构建与环境晋级。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # 变更范围探测与 PR 文档门禁共用一次 checkout，避免两个 job 重复启动 runner。
    # job 名称保持 docs-governance，兼容 main ruleset 的必需状态检查。
    name: docs-governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      # frontend 改用 fe-real step 的确定性 git diff 判定（见下方注释），
      # 不再直接依赖 dorny/paths-filter（其在 PR 事件下对 frontend/** 误判为 true）。
      frontend: ${{ steps.fe-real.outputs.frontend }}
      frontend_scope: ${{ steps.pr-frontend-plan.outputs.scope || 'full' }}
      frontend_reason: ${{ steps.pr-frontend-plan.outputs.reason || '非 PR 事件运行完整前端回归' }}
      platform_helm: ${{ steps.filter.outputs.platform_helm }}
      # 部署配置契约与 Go 运行时验证各自的输入判定，见下方 filters 定义。
      deploy_config: ${{ steps.filter.outputs.deploy_config }}
      go_code: ${{ steps.filter.outputs.go_code }}
      docs: ${{ steps.filter.outputs.docs }}
      module_docs: ${{ steps.filter.outputs.module_docs }}
      unit_test_mode: ${{ steps.pr-unit-plan.outputs.mode || 'full' }}
      unit_test_targets: ${{ steps.pr-unit-plan.outputs.targets || '' }}
      # 集成/安全门禁自守输出：修改了对应测试就必须执行对应门禁（见 integration-plan step）。
      integration_tests_changed: ${{ steps.integration-plan.outputs.changed || 'false' }}
      security_tests_changed: ${{ steps.integration-plan.outputs.security_changed || 'false' }}
      unit_test_reason: ${{ steps.pr-unit-plan.outputs.reason || '非 PR 事件运行完整回归' }}
      image_matrix: ${{ steps.image-plan.outputs.matrix || '[]' }}
      has_images: ${{ steps.image-plan.outputs.has_images || 'false' }}
      deploy_services: ${{ steps.image-plan.outputs.deploy_services || '' }}
      has_deploy_services: ${{ steps.image-plan.outputs.has_deploy_services || 'false' }}
      db_migrate: ${{ steps.image-plan.outputs.db_migrate || 'false' }}
      # 主干后端门禁层（Lint/unit-tests/integration-tests/security-tests）的启动
      # 条件；默认 true 保证任何缺省/非主干事件都按完整回归处理。
      backend_gate_required: ${{ steps.main-test-plan.outputs.required || 'true' }}
      backend_gate_reason: ${{ steps.main-test-plan.outputs.reason || '非主干 push 事件，按完整后端回归处理' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'database/**'
              - 'tests/**'
              - 'scripts/ci/check_signal_schemas.py'
              - 'Makefile'
              - 'uv.lock'
              - 'pyproject.toml'
              - 'conftest.py'
            frontend:
              - 'frontend/**'
              # 该 exe 由 Build terminal_bridge 独立生成；二进制变更不需要重复跑
              # pnpm 单测/构建，但仍会随 main 合并后的镜像构建发布。
              - '!frontend/customer/public/downloads/terminal_bridge.exe'
              # 显式负向约束：防御性排除非前端目录，消除 glob 边界模糊导致的
              # 误判（PR #747 纯数据库 PR 曾误触发前端检查）。
              - '!backend/**'
              - '!database/**'
              - '!docs/**'
              - '!deploy/**'
              - '!scripts/**'
              - '!.github/**'
            platform_helm:
              - 'deploy/helm/hci-platform/**'
              # DSH 是独立 chart，由 ArgoCD 以 selfHeal 直推集群；一旦渲染坏了
              # 没有人工拦截的机会，必须在 CI 里先渲一遍。
              - 'deploy/helm/hci-platform-dsh/**'
              # 观测栈同样由 ArgoCD selfHeal 直推 hci-observability：渲染坏了
              # 等于监控/日志整体缺失，而且不会报错。不纳入过滤器的话，
              # 本 job 里针对 obs 的断言永远跑不到（就是死代码）。
              - 'deploy/helm/hci-platform-obs/**'
              # 语法门禁脚本本身改了也要重跑：门禁坏了必须被发现，而不是静默失效
              - 'scripts/ci/check_alloy_syntax.py'
            # `config-contract-check` 读取的全部输入：契约文件、环境变量样例、
            # Compose、Helm Chart 与校验器自身。deploy/** 不在 backend filter 内，
            # 因此 PR 上这类变更此前既跳过 Lint 也跳过 unit-tests（零校验）。
            deploy_config:
              - '.env.example'
              - 'deploy/config/**'
              - 'deploy/docker/**'
              - 'deploy/helm/hci-platform/**'
              - 'scripts/verify/verify_config_contract.py'
            # Go 运行时验证的输入：hci_sim/** 与 offline-collector/** 同样不在
            # backend filter 内，此前这类 PR 没有任何 job 验证 Go 代码。
            go_code:
              - 'hci_sim/**'
              - 'backend/diagnosis-service/offline-collector/**'
            docs:
              - 'docs/**'
              - 'scripts/ci/check_docs_naming.py'
              - 'scripts/ci/check_docs_frontmatter.py'
              - 'scripts/ci/check_docs_changelog.py'
            module_docs:
              - 'backend/**'
              - 'frontend/**'
              - 'database/**'
              - 'deploy/helm/**'
              - 'docs/**'
              - 'scripts/ci/check_module_doc_sync.py'
            release_ci:
              - '.github/workflows/ci.yml'
              - 'scripts/ci/resolve_release_baseline.py'
              - 'scripts/ci/resolve_image_build_plan.py'
              - 'scripts/ci/resolve_main_test_scope.py'
              - 'scripts/ci/check_digest_pin_exempt.py'
              - 'scripts/ci/update_hci_sim_promotion.py'
              - 'scripts/ci/test_resolve_release_baseline.py'
              - 'scripts/ci/test_resolve_image_build_plan.py'
              - 'scripts/ci/test_resolve_main_test_scope.py'
              - 'scripts/ci/test_check_digest_pin_exempt.py'
              - 'scripts/ci/test_update_hci_sim_promotion.py'
              - 'scripts/ci/test_ci_image_publication.py'
              - 'scripts/ci/resolve_pr_fast_test_targets.py'
              - 'scripts/ci/test_resolve_pr_fast_test_targets.py'
              - 'scripts/ci/test_env_repo_sync_contract.py'
              - 'scripts/ops/sync-env-repo-tags.sh'
              - 'scripts/ci/resolve_pr_frontend_targets.py'
              - 'scripts/ci/test_resolve_pr_frontend_targets.py'
              # docs 增量门禁脚本：改动它必须跑其回归测试（中文路径解析曾长期空转）
              - 'scripts/ci/check_docs_rot.py'
              - 'scripts/ci/test_check_docs_rot_changed_only.py'
              - 'scripts/ci/test_check_docs_rot_semantics.py'
              - 'scripts/ci/test_check_docs_rot_placeholders_version.py'
              - 'scripts/ci/check_docs_naming.py'
              - 'scripts/ci/test_check_docs_naming.py'
              - 'scripts/ci/check_docs_frontmatter.py'
              - 'scripts/ci/test_check_docs_frontmatter.py'
              # §7.1 变更历史增量门禁脚本（V-036）：改动它必须跑其回归测试
              - 'scripts/ci/check_docs_changelog.py'
              - 'scripts/ci/test_check_docs_changelog.py'
              # PDB 覆盖面门禁：它自己的回归测试必须跟它一起跑（2026-10-31 就是
              # 靠这份自测抓出「文档声明了、代码只实现一半」的静默失效）
              - 'scripts/ci/check_pdb_coverage.py'
              - 'scripts/ci/test_check_pdb_coverage.py'
              - 'scripts/ci/check_alloy_syntax.py'
              - 'scripts/ci/test_check_alloy_syntax.py'
              - 'hci_sim/Dockerfile'
              - 'deploy/gitops/argo-apps/local/hci-sim-dev.yaml'
              - 'deploy/gitops/argo-apps/cloud/hci-sim-staging.yaml'

      - name: 安装 uv（发布协议回归）
        if: steps.filter.outputs.release_ci == 'true'
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39a
        with:
          version: "latest"
          enable-cache: true

      - name: 验证镜像构建与晋级协议
        if: steps.filter.outputs.release_ci == 'true'
        run: |
          # check_docs_rot.py 本体也纳入 ruff：此前它从未被覆盖（SIM110/SIM102/SIM108/E741/F841）。
          # 注：本块是 shell 续行命令，列表中间不可插入 # 注释（会提前结束命令）。
          uvx ruff check \
            scripts/ci/resolve_release_baseline.py \
            scripts/ci/resolve_image_build_plan.py \
            scripts/ci/check_digest_pin_exempt.py \
            scripts/ci/update_hci_sim_promotion.py \
            scripts/ci/resolve_main_test_scope.py \
            scripts/ci/test_resolve_release_baseline.py \
            scripts/ci/test_resolve_image_build_plan.py \
            scripts/ci/test_resolve_main_test_scope.py \
            scripts/ci/test_check_digest_pin_exempt.py \
            scripts/ci/test_update_hci_sim_promotion.py \
            scripts/ci/test_ci_image_publication.py \
            scripts/ci/resolve_pr_frontend_targets.py \
            scripts/ci/test_resolve_pr_frontend_targets.py \
            scripts/ci/resolve_pr_fast_test_targets.py \
            scripts/ci/test_resolve_pr_fast_test_targets.py \
            scripts/ci/test_env_repo_sync_contract.py \
            scripts/ci/test_check_docs_rot_changed_only.py \
            scripts/ci/test_check_docs_rot_semantics.py \
            scripts/ci/test_check_docs_rot_placeholders_version.py \
            scripts/ci/check_docs_rot.py \
            scripts/ci/check_docs_naming.py \
            scripts/ci/test_check_docs_naming.py \
            scripts/ci/check_docs_frontmatter.py \
            scripts/ci/test_check_docs_frontmatter.py \
            scripts/ci/check_docs_changelog.py \
            scripts/ci/test_check_docs_changelog.py \
            scripts/ci/check_pdb_coverage.py \
            scripts/ci/test_check_pdb_coverage.py \
            scripts/ci/check_alloy_syntax.py \
            scripts/ci/test_check_alloy_syntax.py
          uvx ruff format --check \
            scripts/ci/resolve_release_baseline.py \
            scripts/ci/resolve_image_build_plan.py \
            scripts/ci/check_digest_pin_exempt.py \
            scripts/ci/update_hci_sim_promotion.py \
            scripts/ci/resolve_main_test_scope.py \
            scripts/ci/test_resolve_release_baseline.py \
            scripts/ci/test_resolve_image_build_plan.py \
            scripts/ci/test_resolve_main_test_scope.py \
            scripts/ci/test_check_digest_pin_exempt.py \
            scripts/ci/test_update_hci_sim_promotion.py \
            scripts/ci/test_ci_image_publication.py \
            scripts/ci/resolve_pr_frontend_targets.py \
            scripts/ci/test_resolve_pr_frontend_targets.py \
            scripts/ci/resolve_pr_fast_test_targets.py \
            scripts/ci/test_resolve_pr_fast_test_targets.py \
            scripts/ci/test_env_repo_sync_contract.py \
            scripts/ci/test_check_docs_rot_changed_only.py \
            scripts/ci/test_check_docs_rot_semantics.py \
            scripts/ci/test_check_docs_rot_placeholders_version.py \
            scripts/ci/check_docs_rot.py \
            scripts/ci/check_docs_naming.py \
            scripts/ci/test_check_docs_naming.py \
            scripts/ci/check_docs_frontmatter.py \
            scripts/ci/test_check_docs_frontmatter.py \
            scripts/ci/check_docs_changelog.py \
            scripts/ci/test_check_docs_changelog.py \
            scripts/ci/check_pdb_coverage.py \
            scripts/ci/test_check_pdb_coverage.py \
            scripts/ci/check_alloy_syntax.py \
            scripts/ci/test_check_alloy_syntax.py
          uv run --no-project --with pytest --with pytest-xdist pytest \
            scripts/ci/test_resolve_release_baseline.py \
            scripts/ci/test_resolve_image_build_plan.py \
            scripts/ci/test_check_digest_pin_exempt.py \
            scripts/ci/test_update_hci_sim_promotion.py \
            scripts/ci/test_ci_image_publication.py \
            scripts/ci/test_resolve_pr_frontend_targets.py \
            scripts/ci/test_resolve_main_test_scope.py \
            scripts/ci/test_resolve_pr_fast_test_targets.py \
            scripts/ci/test_env_repo_sync_contract.py \
            scripts/ci/test_check_docs_rot_changed_only.py \
            scripts/ci/test_check_docs_rot_semantics.py \
            scripts/ci/test_check_docs_rot_placeholders_version.py \
            scripts/ci/test_check_docs_naming.py \
            scripts/ci/test_check_docs_frontmatter.py \
            scripts/ci/test_check_docs_changelog.py \
            scripts/ci/test_check_pdb_coverage.py \
            scripts/ci/test_check_alloy_syntax.py \
            -q

      # 确定性前端改动判定（覆盖 dorny/paths-filter 的 frontend 输出）。
      # 根因：dorny/paths-filter@0e4a8c6 在 pull_request 事件下对 frontend/**
      # 误判为 true（PR #747 纯数据库 PR 被误触发前端检查，实测 49s 空跑）。
      # 用原生 git diff 直接列出 PR 真实改动文件并 grep '^frontend/'，零外部
      # action 依赖，不可能误判。fork/异常场景（无 base/head sha）fallback 到
      # paths-filter 结果（宁可多跑一次前端检查，也不漏跑）。
      - name: 确定性前端改动判定
        id: fe-real
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" "$HEAD" || true)"
          if echo "$CHANGED" | grep -qE '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      # 快速门禁只接受已审计的直接单元测试、服务测试目录或信号公共层集合；
      # 共享依赖等未知影响范围会输出 full，由 unit-tests 走完整回归，避免漏测。
      - name: 解析 PR 快速单元测试目标
        id: pr-unit-plan
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -c core.quotepath=false diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/pr-changed-files.txt
          python3 scripts/ci/resolve_pr_fast_test_targets.py \
            --changed-files /tmp/pr-changed-files.txt \
            --github-output "$GITHUB_OUTPUT"

      # 集成测试门禁自守：修了集成测试，就必须跑集成测试。
      # 根因：`resolve_pr_fast_test_targets.py` 只按「服务目录 → 测试目录」映射识别
      # Python 测试，根级 tests/integration/** 不在其映射内，对纯集成测试改动会
      # 输出 mode=none；integration-tests 又挂在 unit_test_mode == 'full' 上，
      # 于是「改集成测试的 PR 反而没有任何集成门禁」。
      # 后果实证：#1065/#1066 的 WS 身份信任链回归（tests/integration/
      # test_websocket.py）在 PR 阶段被跳过，合入 main 后才由 push 事件暴露为
      # 持续 FAILURE。此处对这类改动单独判定，代价仅落在触及集成测试的 PR 上。
      - name: 解析集成测试改动范围
        id: integration-plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git -c core.quotepath=false diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" > /tmp/pr-integration-files.txt
          else
            : > /tmp/pr-integration-files.txt
          fi
          if grep -qE '^(tests/integration/|backend/[^/]+/tests/integration/)' /tmp/pr-integration-files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          # security-tests 走 tests/security/**，同样不在上述脚本的映射内。
          if grep -qE '^(tests/security/|backend/[^/]+/tests/security/)' /tmp/pr-integration-files.txt; then
            echo "security_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "security_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 输出 PR 单元测试计划
        if: github.event_name == 'pull_request'
        env:
          CI_TRACE_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-changes
          PLAN_MODE: ${{ steps.pr-unit-plan.outputs.mode }}
          PLAN_REASON: ${{ steps.pr-unit-plan.outputs.reason }}
          PLAN_TARGETS: ${{ steps.pr-unit-plan.outputs.targets }}
        run: |
          echo "trace_id=${CI_TRACE_ID} unit_test_mode=${PLAN_MODE} reason=${PLAN_REASON}"
          {
            echo "### PR 单元测试计划"
            echo
            echo "- 调用链：\`${CI_TRACE_ID}\`"
            echo "- 模式：\`${PLAN_MODE}\`"
            echo "- 原因：${PLAN_REASON}"
            echo "- 目标：\`${PLAN_TARGETS//$'\n'/, }\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # PR 只构建实际受影响的前端应用；共享包、锁文件和未知映射自动回退全量。
      - name: 解析 PR 前端测试与构建范围
        id: pr-frontend-plan
        if: github.event_name == 'pull_request'
        run: |
          git -c core.quotepath=false diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/pr-changed-files.txt
          python3 scripts/ci/resolve_pr_frontend_targets.py \
            --changed-files /tmp/pr-changed-files.txt \
            --github-output "$GITHUB_OUTPUT"

      # 主干发布不能只比较相邻两个 commit：上一轮发布可能在镜像构建阶段被
      # 后续 main push 取消，随后到达的空 diff push 会把尚未发布的改动误判为无需构建。
      # 这里寻找最近一次真正成功构建过业务镜像的 CI run 作为发布基线。
      - name: 解析最近成功镜像发布基线
        id: release-baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci/resolve_release_baseline.py

      # 发布镜像使用完整 Git diff 生成最小服务闭包。只在 main push/手动发布时
      # 需要；PR 质量门禁仍只消费上面的 paths-filter 输出。
      - name: 生成最小镜像构建计划
        id: image-plan
        if: github.event_name != 'pull_request'
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_RELEASE_BASE_SHA: ${{ steps.release-baseline.outputs.base_sha }}
          GITHUB_SERVICE_RELEASE_BASELINES: ${{ steps.release-baseline.outputs.service_baselines }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/resolve_image_build_plan.py

      # 镜像构建已按影响闭包收敛，后端门禁层此前仍是每次 main push 无条件全量，
      # 而发布链（prepare → 镜像构建 → 非生产晋级）又把 Lint/unit/integration/
      # security 的 success 作为前置：只改 admin UI 的 push 也要为 8 个后端服务的
      # 完整回归多等约 4 分钟，而这批回归的输入完全没有变化。
      #
      # diff 起点取"最近一次成功发布基线"而不是相邻 commit：被后续 push 取代的
      # 那一轮变更（上一轮 run 未完成就到达新 push）必须继续计入变更清单，否则
      # 未回归的后端改动会被误判为无需回归。判定本身是白名单 + 失败关闭。
      - name: 解析主干后端门禁影响范围
        id: main-test-plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_SHA: ${{ steps.release-baseline.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if ! git -c core.quotepath=false diff --name-only "${BASE_SHA:-}" "$HEAD_SHA" > /tmp/main-changed-files.txt; then
            echo "::warning::无法生成主干变更清单（base=${BASE_SHA:-<empty>}），回退完整后端回归"
            : > /tmp/main-changed-files.txt
          fi
          echo "基线：${BASE_SHA:-<empty>} → ${HEAD_SHA}，变更文件数：$(wc -l < /tmp/main-changed-files.txt | tr -d ' ')"
          python3 scripts/ci/resolve_main_test_scope.py \
            --changed-files /tmp/main-changed-files.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: 检查是否跳过文档门禁
        id: skip-check
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # 检查 PR body 或 commit message 中是否包含 [skip docs] 标记
          if echo "$PR_BODY" | grep -qi '\[skip docs\]'; then
            echo "PR body 包含 [skip docs] 标记，跳过文档门禁"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 检查 commit message（最近 5 个）
          SKIP_COMMITS=$(git log -5 --format=%s | grep -i '\[skip docs\]' || true)
          if [[ -n "$SKIP_COMMITS" ]]; then
            echo "Commit message 包含 [skip docs] 标记，跳过文档门禁"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: 检查关键改动是否同步文档
        if: github.event_name == 'pull_request' && steps.skip-check.outputs.skip != 'true'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # core.quotepath=false: 禁止 git 对非 ASCII 路径（中文文件名）做八进制转义加引号
          # 不加此参数时，中文路径输出为 "docs/\xxx\xxx.md"，行首是 " 而非 d，导致 grep ^docs/ 永远匹配不到
          CHANGED_FILES="$(git -c core.quotepath=false diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          echo "本次 PR 改动文件:"
          echo "$CHANGED_FILES"

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "无变更，跳过文档门禁"
            exit 0
          fi

          # 检查是否有除 .github/workflows/ 外的关键目录改动
          CORE_CHANGES="$(echo "$CHANGED_FILES" | grep -E '^(backend/|frontend/|deploy/|scripts/|database/|hci_sim/|terminal_bridge/)' || true)"

          # 豁免：ArgoCD Application 已文档化的镜像晋级元数据更新。
          # 若 PR 仅同步 digest 与 image-source-revision（repository 不变），
          # 不要求每个 promotion PR 重复修改 docs；其他字段仍保持 fail-closed。
          if [[ -n "$CORE_CHANGES" ]]; then
            REMAINING_CORE="$CORE_CHANGES"
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              case "$f" in
                deploy/gitops/argo-apps/*)
                  # 调用可单测脚本判定是否只更新受控晋级字段。
                  if python scripts/ci/check_digest_pin_exempt.py "$BASE_SHA" "$HEAD_SHA" "$f"; then
                    REMAINING_CORE="$(echo "$REMAINING_CORE" | grep -vF "$f" || true)"
                  fi
                  ;;
              esac
            done <<< "$CORE_CHANGES"
            CORE_CHANGES="$REMAINING_CORE"
          fi

          if [[ -n "$CORE_CHANGES" ]]; then
            if echo "$CHANGED_FILES" | grep -Eq '^(docs/|README\.md$|AGENTS\.md$|CLAUDE\.md$)'; then
              echo "检测到关键改动且已同步文档，门禁通过"
              exit 0
            fi

            echo "检测到关键改动但未同步文档。"
            echo "请至少更新 docs/ 下相关文档，或更新 README.md/AGENTS.md/CLAUDE.md 中的说明。"
            exit 1
          fi

          echo "未检测到关键目录改动（workflow 配置变更或已文档化的 digest 钉入无需文档同步），门禁通过"

          # 检查 pitfalls 条目文件改动是否同步更新了 _index.md（编号注册表）
          PITFALL_ENTRY=$(echo "$CHANGED_FILES" | grep -E '^docs/pitfalls/[^_]' || true)
          if [[ -n "$PITFALL_ENTRY" ]]; then
            if ! echo "$CHANGED_FILES" | grep -qE '^docs/pitfalls/_index\.md'; then
              echo "⚠️  修改了 docs/pitfalls/ 条目文件，但未同步更新 _index.md"
              echo "   请更新 _index.md 中的条目计数或 PIT 编号注册表，再提交"
              exit 1
            fi
            echo "pitfalls 条目与 _index.md 同步更新，门禁通过"
          fi

      # 以下两项原先各占用一个独立 runner，且均为非阻断性治理提示。合并到
      # 已必然启动的 docs-governance job 后，保留规则与旁路语义，不再重复 checkout。
      - name: 文档命名规范（信息性）
        if: github.event_name == 'pull_request' && steps.filter.outputs.docs == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NAMING_BYPASS: ${{ contains(github.event.pull_request.labels.*.name, 'naming-approved') && '1' || '0' }}
        run: python3 scripts/ci/check_docs_naming.py

      # §7.3 frontmatter 契约的强校验。
      # 第一性原理：frontmatter 的唯一用途是让读者（含 Agent）按
      # status / category / audience 机械过滤文档。缺字段或用词表外的值，
      # 过滤会**静默漏掉**该文档——读者以为已看全，实际少看了几篇。
      # 所以这里不设建议级通道，不合规即阻断。
      # 跑 --full 而非增量：全量只有 200 余篇小文件（毫秒级），而增量检查只能
      # 保证「新改的合规」，从没被碰过的坏文档会永远逃过检查。
      - name: 文档 frontmatter 规范（阻断）
        if: github.event_name == 'pull_request' && steps.filter.outputs.docs == 'true'
        run: python3 scripts/ci/check_docs_frontmatter.py --full

      - name: 模块文档同步（信息性）
        if: github.event_name == 'pull_request' && steps.filter.outputs.module_docs == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DOC_SYNC_BYPASS: ${{ contains(github.event.pull_request.labels.*.name, 'doc-update-exempt') && '1' || '0' }}
        run: python3 scripts/ci/check_module_doc_sync.py

      # ── 文档腐化硬门禁（docs rot gate）──
      # 第一性原理：文档只有"准确反映现状且引用有效"才有价值，失效引用与密钥泄露
      # 是腐化的硬证据，必须阻断合并。
      # 分级策略：
      #   - C6 密钥泄露：永远阻断（安全红线，不区分存量/增量）
      #   - C1/C2/C3 现行全量文档层（Wave 3 已归零）：不论是否本次改动一律
      #     阻断（--current-blocking）——读者会照着现行文档动手，该层的一条
      #     失效引用就是真实故障，不再允许「只警告」漂回存量；
      #   - C1/C2/C3 事件层/归档层：仍只按本次改动行阻断，存量只警告——它们是
      #     史料，为 CI 变绿而改写等于伪造历史（规范 §8.3）。
      # 对抗性审查：现行层升阻断的前提是该层实测为 0，否则本步会让所有 PR
      # 卡死；归零过程与口径见 docs/solution/events/2026-10-26-文档瘦身Wave3现行文档准确性治理.md。
      - name: 文档腐化硬门禁（失效引用+密钥泄露）
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci/check_docs_rot.py --changed-only --current-blocking
          ROT_EXIT=$?
          # 密钥泄露（C6）已在脚本内强制退出 1；此处仅传播失效引用的阻断结果
          exit $ROT_EXIT

      # ── §7.1 变更历史节增量硬门禁（docs changelog gate）──
      # 第一性原理：变更历史节的唯一增量价值是「关联事件文档」，git log 反推不出，
      # 只在改动当下写得准；实质改了现行 docs 文档却不留这行，可追溯轨迹就断了（V-036）。
      # 对抗性审查：机器只抓「漏没漏一行」的结构事实，判不了某行有无意义——凑空行
      # 骗得过本门禁、骗不过评审，故意义仍归人工，门禁的作用是把「默默忘了」变成
      # 「必须显式补一行」。扫描范围只含 docs/ 现行文档，不含根 README/AGENTS 与
      # pitfalls/_index.md（边界明文写进 docs/文档管理规范.md §7.1，不留给机器猜）。
      - name: 变更历史节增量门禁（§7.1）
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/check_docs_changelog.py

      - name: 文档腐化存量报告（信息性，不阻断）
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          echo "::warning::存量文档腐化扫描（仅报告，不影响合并）："
          python3 scripts/ci/check_docs_rot.py --only C1,C2,C3,C6 || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend_gate_required == 'true') ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 安装 uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39a
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 安装依赖
        run: uv sync --group dev

      - name: Ruff 代码检查
        run: uv run ruff check backend/ tests/
      - name: 信号 v2 JSON Schema 契约校验
        # §6.1 防回归：schema 自身合法 + fixtures 校验 + 漂移检测
        run: uv run python scripts/ci/check_signal_schemas.py

  frontend-check:
    name: 前端检查（单元测试 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    env:
      CI_TRACE_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-frontend-check
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # 前端门禁不消费后端源码；稀疏检出缩短 hosted runner 的固定启动时间。
          sparse-checkout: frontend

      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9

      - name: 安装 Node.js 并恢复 pnpm 缓存
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 输出前端门禁范围
        run: |
          echo "trace_id=$CI_TRACE_ID frontend_scope=${{ needs.changes.outputs.frontend_scope }}"
          echo "reason=${{ needs.changes.outputs.frontend_reason }}"

      - name: 安装前端依赖
        run: pnpm --dir frontend install --frozen-lockfile

      - name: 运行前端单元测试
        env:
          FRONTEND_SCOPE: ${{ needs.changes.outputs.frontend_scope }}
        run: |
          case "$FRONTEND_SCOPE" in
            admin)
              if find frontend/admin -type f \( -name '*.spec.*' -o -name '*.test.*' \) -print -quit | grep -q .; then
                pnpm --filter @hci/admin test
              else
                echo 'admin 未发现前端单元测试文件，跳过'
              fi
              ;;
            customer) pnpm --filter @hci/customer test ;;
            *) pnpm --dir frontend -r --if-present test ;;
          esac

      - name: 构建前端工作区
        env:
          FRONTEND_SCOPE: ${{ needs.changes.outputs.frontend_scope }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$IS_PR" = 'true' ] && [ "$FRONTEND_SCOPE" != 'full' ]; then
            # 快速 PR 门禁必须同时跑 vue-tsc：main 上刚出过一起类型回归（#1311 的 TS2345），
            # 因为 PR 阶段只跑 vite build、vue-tsc 被留到完整回归，结果 PR 全绿合入、main 长时间飘红。
            # 多花的 30~60s 远小于一次 main 红身的代价。
            pnpm --filter "@hci/$FRONTEND_SCOPE" exec vue-tsc -b
            pnpm --filter "@hci/$FRONTEND_SCOPE" exec vite build
            exit 0
          fi
          case "$FRONTEND_SCOPE" in
            admin) pnpm --filter @hci/admin build ;;
            customer) pnpm --filter @hci/customer build ;;
            *) pnpm --dir frontend -r build ;;
          esac

  agent-reliability-regression:
    name: agent-reliability-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: 检测是否需要运行 Agent 可靠性回归
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="HEAD~1"
            fi
          else
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          # 强制容错：若 SHA 变量为空，以 HEAD~1 兜底，防止 git diff 抛出 exit 128
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            BASE_SHA="HEAD~1"
            HEAD_SHA="HEAD"
          fi

          CHANGED_FILES="$(git -c core.quotepath=false diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || git -c core.quotepath=false diff --name-only HEAD~1 HEAD 2>/dev/null || true)"

          echo "本次改动文件:"
          echo "$CHANGED_FILES"

          WATCHED_REGEX='^(backend/agent-service/app/adapters/agents/htp/(react_engine|investigation_agent|tool_registry|kbd_differential)\.py|backend/agent-service/app/tools/(qfk|qkv)/.*\.py|backend/agent-service/app/services/hallucination_detector\.py|backend/kb-service/app/(routes/(classify|extract_signals)|services/vision_processor)\.py|backend/shared/(signals|cdd)/.*\.py|backend/shared/utils/prompt_loader\.py|database/seeds/(02_system_prompts|tool_definition_v2)\.sql|evaluation/(golden_tickets\.json|replay_runner\.py))$'
          if echo "$CHANGED_FILES" | grep -Eq "$WATCHED_REGEX"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "未修改 Agent 核心、工具 Schema 或 Prompt，跳过可靠性回归"
          fi

      - name: 安装 uv
        if: steps.changes.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39a
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 安装依赖
        if: steps.changes.outputs.should_run == 'true'
        run: uv sync --group dev

      - name: 准备可靠性评测基线
        if: steps.changes.outputs.should_run == 'true'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git show "${{ github.event.pull_request.base.sha }}:evaluation/report.json" > /tmp/agent-reliability-baseline.json
          else
            cp evaluation/report.json /tmp/agent-reliability-baseline.json
          fi

      - name: 运行黄金工单回归评测
        if: steps.changes.outputs.should_run == 'true'
        run: uv run python evaluation/replay_runner.py --baseline /tmp/agent-reliability-baseline.json --max-regression 0.10

      - name: 上传 Agent 可靠性评测报告
        if: always() && steps.changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-reliability-report
          path: evaluation/report.json

      - name: 评论 PR 可靠性评测结果
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.should_run == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            try {
              const fs = require('fs')
              const report = JSON.parse(fs.readFileSync('evaluation/report.json', 'utf8'))
              const body = [
                '## Agent 可靠性回归评测',
                '',
                `- 黄金工单数：${report.total_cases}`,
                `- 故障分类准确率：${(report.avg_category_accuracy * 100).toFixed(2)}%`,
                `- 工具调用成功率：${(report.tool_success_rate * 100).toFixed(2)}%`,
                `- 幻觉检出率：${(report.hallucination_rate * 100).toFixed(2)}%`,
                `- 路径偏差率：${(report.path_deviation_rate * 100).toFixed(2)}%`,
                '',
                '门禁规则：分类准确率/工具成功率劣化不得 ≥ 10%，幻觉检出率/路径偏差率升高不得 ≥ 10%。'
              ].join('\n')
              const marker = '## Agent 可靠性回归评测'
              const { owner, repo } = context.repo
              const issue_number = context.issue.number
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 })
              const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker))
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body })
              }
            } catch (error) {
              console.log("无法写入 PR 可靠性评测结果评论（可能为 fork PR 权限限制）：", error)
            }

  helm-validate:
    name: Helm 模板校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.platform_helm == 'true')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 安装 Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.17.3

      - name: Helm lint
        run: |
          helm lint deploy/helm/hci-platform
          helm lint deploy/helm/hci-platform-dsh
          helm lint deploy/helm/hci-platform-obs
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            helm lint deploy/helm/hci-sim
          fi

      # 观测栈的两条不变量：一旦退回“命名空间白名单”或白名单漏环境，
      # 整个环境就会静默地没有任何指标/日志（2026-10-30 复盘根因）。
      # 这里把两条都锁成 CI 断言，避免只能靠人工看面板发现。
      - name: 观测栈渲染不变量（去白名单 + 环境全覆盖）
        run: |
          helm template obs deploy/helm/hci-platform-obs \
            --set global.domain=ci.example.com \
            >/tmp/obs-rendered.yaml

          if [ ! -s /tmp/obs-rendered.yaml ]; then
            echo "观测栈渲染结果为空"
            exit 1
          fi

          # 反向：Prometheus 的 Pod 发现不得再声明命名空间白名单
          # （白名单漏一个环境 = 整个环境没有指标，且不报错）
          if grep -A3 'role: pod' /tmp/obs-rendered.yaml | grep -q 'namespaces:'; then
            echo "Prometheus 的 Pod 发现不得使用命名空间白名单（注解门控即可）"
            exit 1
          fi

          # 正向：Alloy 日志白名单必须覆盖现有全部环境命名空间
          for ns in hci-staging hci-sim-staging hci-dsh hci-observability argocd; do
            if ! grep -q "$ns" /tmp/obs-rendered.yaml; then
              echo "Alloy 日志白名单缺少命名空间：$ns"
              exit 1
            fi
          done

          # 采集器必须带 checksum/config：ConfigMap 改了而 Pod 不重启，
          # 会让「配置已合入」变成假象（Prometheus 不 reload、Alloy 不重读）
          if ! grep -q 'checksum/config:' /tmp/obs-rendered.yaml; then
            echo "Prometheus / Alloy 的 Pod 模板必须带 checksum/config 注解"
            exit 1
          fi

          # 首样本盲区兜底告警不得退化成无门控。
          # 2026-10-30 staging 实测：Prometheus 数据目录是 emptyDir，15:50:4x 因
          # checksum/rules 重启后 TSDB 全清，15:51:22 首次评估把发布前早已存在的
          # 9 条 5xx 序列全部判成「刚诞生」，一次性 firing 9 条 warning。
          # prometheus.yaml 里已有 render-time fail 守卫，这里再查一次渲染结果：
          # 连守卫本体一起删掉也拦得住。
          if ! grep -q 'alert: GatewayServerErrorFirstSeen' /tmp/obs-rendered.yaml; then
            echo "GatewayServerErrorFirstSeen 规则不得删除：rate()/increase() 对序列诞生前的增量是结构性盲区"
            exit 1
          fi
          if ! awk '/alert: GatewayServerErrorFirstSeen/{f=1}
                   /alert: GatewayMetricsMissing/{f=0}
                   f && /and on\(\)/{ok=1}
                   END{exit !ok}' /tmp/obs-rendered.yaml; then
            echo "GatewayServerErrorFirstSeen 缺少数据连续性门控（and on()），Prometheus 重启后会成片误报"
            exit 1
          fi

          # 观测栈另外三条不变量，用 python+yaml 按文档判（不靠 grep 隔窗猜行）：
          #  1) prometheus 的 TSDB 必须是 PVC：2026-10-30 实测 emptyDir 重启后
          #     TSDB 全清，FirstSeen 把 9 条存量 5xx 序列全判成「刚诞生」一次性 firing；
          #  2) 单副本 + RWO PVC 必须 Recreate：RollingUpdate 会让两个实例同时挂
          #     同一个数据目录，第二个直接起不来（同 chart 的 loki/tempo 已踩过）；
          #  3) 网关 5xx 采集链只能把「有索引收益」的字段提为 structured metadata：
          #     duration 每请求唯一、request_path 用户可控，它们在原始 JSON 行里本来
          #     就有（`| json | Duration > 60000000000` 可查），再提一份只让查询结果
          #     按行膨胀（2026-10-30 实测 3 次注入 = 3 条返回流，各自 duration 不同）。
          python3 - /tmp/obs-rendered.yaml <<'PY'
          import re, sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1], encoding="utf-8")) if isinstance(d, dict)]
          problems = []
          prom = next((d for d in docs if d.get("kind") == "Deployment"
                       and d.get("metadata", {}).get("name") == "prometheus"), None)
          if prom is None:
              problems.append("渲染结果里没有 prometheus 的 Deployment，门禁对象丢了")
          else:
              vols = {v.get("name"): v for v in prom["spec"]["template"]["spec"].get("volumes", [])}
              storage = vols.get("storage", {})
              if storage.get("persistentVolumeClaim", {}).get("claimName") != "prometheus-data":
                  problems.append(f"prometheus 的 storage 卷不是 PVC(prometheus-data)，而是 {sorted(storage) or '缺失'}"
                                  f"（退回 emptyDir 等于关掉告警门控的判据来源）")
              if prom["spec"].get("strategy", {}).get("type") != "Recreate":
                  problems.append("prometheus Deployment 缺 strategy.type: Recreate"
                                  "（RWO PVC + RollingUpdate = 两实例争用同一数据目录）")
          pvcs = {d.get("metadata", {}).get("name") for d in docs if d.get("kind") == "PersistentVolumeClaim"}
          if "prometheus-data" not in pvcs:
              problems.append(f"缺 prometheus-data PVC，现有 PVC：{sorted(pvc for pvc in pvcs if pvc)}")
          # Alloy 配置在 ConfigMap 的值里，不是一条独立文档，单独取出来判
          alloy = "\n".join((d.get("data") or {}).get("config.alloy", "")
                            for d in docs if d.get("kind") == "ConfigMap"
                            and (d.get("data") or {}).get("config.alloy"))
          # 先剔掉 // 注释行再定位锚点：2026-10-31 真实踩过——我在 pod_logs 块里加的
          # 注释提到了 loki.process "ingress_logs" 这个字面量，直接使 find() 锚点
          # 前移到 pod_logs，门禁于是去检查错误的块、对真负例返回「通过」。
          alloy = "\n".join(l for l in alloy.splitlines() if not l.lstrip().startswith("//"))
          mpos = re.search(r'(?m)^\s*loki\.process "ingress_logs"\s*\{\s*$', alloy)
          block = alloy[mpos.start():] if mpos else ""
          # 只盯 structured_metadata 的 values 表：stage.json 里抽而不提是无害的，
          # 进了 values 表才会参与查询结果的分组。切片宽度必须刚好覆盖那几行，不能“越宽越安全”。
          m = re.search(r"stage\.structured_metadata\s*\{\s*values\s*=\s*\{(.*?)\}", block, re.S)
          labels_txt = m.group(1) if m else ""
          # 锚点自证：取到的表里必须有已知的有界字段。少了就说明切片落在另一个块上，
          # 必须把「门禁自己坏了」当作失败报出来，不能继续往检查项里走。
          if labels_txt and "downstream_status" not in labels_txt:
              problems.append("锚点失效：取到的 structured_metadata.values 里没有 downstream_status，"
                              "说明切片落在别的块上，本步检查不可信")
          for bad in ("duration", "request_path", "client_addr", "ClientAddr", "StartLocal", "StartUTC"):
              # 只当「某行写成 <字段> = ""」才算进了 structured_metadata 的 values 表
              if re.search(rf"^\s*{bad}\s*=\s*\"\"\s*$", labels_txt, re.M):
                  problems.append(f"ingress_logs 把无界字段 {bad} 提成了 structured_metadata（它不在 label 索引里，"
                                  f"但会按行拆碎查询结果：实测 3 条 5xx = 3 条返回流；且原始 JSON 行里本来就能查）")
          # service_name 不是高基数问题，是语义冲突：pod_logs 的 discovery.relabel 已经把
          # pod 标签 app.kubernetes.io/name 写成了同名 stream 标签（现网实测 kube-system/traefik
          # 的 5xx 行带着 service_name="traefik"，而那条 JSON 里没有 ServiceName 键），
          # 网关转发的后端服务必须用另一个名字（backend_service），否则「谁在 502」会给出错的答案。
          if re.search(r'^\s*service_name\s*=\s*""\s*$', labels_txt, re.M):
              problems.append("ingress_logs 不得把 service_name 用作 structured_metadata：它与 pod_logs "
                              "继承来的同名 stream 标签语义冲突（一个是网关自己，一个是后端服务），"
                              "应改用 backend_service = \"ServiceName\"")
          if not labels_txt:
              problems.append("渲染结果里找不到 ingress_logs 的 structured_metadata.values，网关 5xx 采集链丢了")
          # 4) Loki 的配置文件必须在 Git 里，而不是靠镜像自带。
          #    2026-10-31 发现：loki.yaml 只挂了 /loki 数据盘，`-config.file` 指向的
          #    /etc/loki/local-config.yaml 来自镜像（grafana/loki:3.4.2）——
          #    retention / limits_config / compactor 全不归本仓管理，也无从审计。
          #    这类缺失最坏的地方是「无声」：没有配置文件，「配置有没有变」根本没法比对。
          loki = next((d for d in docs if d.get("kind") == "Deployment"
                       and d.get("metadata", {}).get("name") == "loki"), None)
          if loki is None:
              problems.append("渲染结果里没有 loki 的 Deployment，门禁对象丢了")
          else:
              lspec = loki["spec"]["template"]["spec"]
              lvols = {v.get("name"): v for v in lspec.get("volumes", [])}
              lctr = (lspec.get("containers") or [{}])[0]
              lmounts = {m.get("name"): m for m in lctr.get("volumeMounts", [])}
              lcfg = (lvols.get("loki-config") or {}).get("configMap") or {}
              if lcfg.get("name") != "loki-config":
                  problems.append("loki 没把配置卷挂到 ConfigMap(loki-config)："
                                  "/etc/loki/local-config.yaml 会退回镜像自带默认，retention 等配置"
                                  "既改不了也审不了")
              if lcfg.get("optional") is not False:
                  problems.append("loki-config 必须 optional: false：ConfigMap 丢了宁可 Pod 起不来，"
                                  "也不能静默回退到镜像自带配置（这正是 2026-10-31 的原始形态）")
              if (lmounts.get("loki-config") or {}).get("mountPath") != "/etc/loki":
                  problems.append("loki-config 必须挂到 /etc/loki（-config.file 指向那里），实际挂到"
                                  f" {lmounts.get('loki-config', {}).get('mountPath')}")
              if "checksum/config" not in (loki["spec"]["template"]["metadata"].get("annotations") or {}):
                  problems.append("loki 的 Pod 模板必须带 checksum/config：Loki 只在启动时读配置，"
                                  "改了配置不重启 = 配置合入变假象")
          loki_cfg = "\n".join((d.get("data") or {}).get("local-config.yaml", "")
                               for d in docs if d.get("kind") == "ConfigMap"
                               and d.get("metadata", {}).get("name") == "loki-config")
          if not loki_cfg:
              problems.append("缺 loki-config 的 local-config.yaml")
          else:
              if "schema_config:" not in loki_cfg:
                  problems.append("loki 配置缺 schema_config，Loki 起不来")
              # 数据目录必须落在 /loki（PVC 挂载点）：指到别处就会写进容器层，
              # 重启即丢，而且不报任何错——比宕机更难发现。
              for key, want in (("path_prefix", "/loki"),
                                ("chunks_directory", "/loki/chunks"),
                                ("rules_directory", "/loki/rules")):
                  if not re.search(rf"(?m)^\s*{key}:\s*{re.escape(want)}\s*$", loki_cfg):
                      problems.append(f"loki 配置的 {key} 必须指向 {want}（PVC 挂载点），"
                                      f"否则数据写进容器层，重启即丢且不报警")
              # 删除策略：本阶段刻意不启用（不开 retention 等价于永不删除）。
              # 开启删除不可逆，必须同时改文档与这条断言——把「改策略」变成显式动作，
              # 而不是某次顺手补配置。
              for key in ("retention_period", "retention_enabled"):
                  if re.search(rf"(?m)^\s*{key}:", loki_cfg):
                      problems.append(f"loki 配置出现了 {key}：开启删除不可逆，"
                                      f"必须先改可观测性设计的 P1 与本步断言，再改这里")
          # 5) 每个容器必须显式声明 imagePullPolicy，且不得为 Always。
          #    2026-10-31 实测事故：prod 集群（aiops）无法访问 docker.io（i/o timeout），
          #    节点只能靠本地镜像缓存。而 K8s 在字段缺省时按 **tag** 推导策略
          #    （`:latest` = Always），且该推导值一旦写进 Deployment 就固化，
          #    之后改 tag 也不会回退。prod 的 loki 就带着 218 天前 `:latest` 时期的
          #    Always，Chart 又从未声明该字段 → ArgoCD 无从纠正 → 一次 Pod 重建
          #    直接 ImagePullBackOff（实测不可用约 2 分 28 秒）；同集群 grafana / minio
          #    已因此连续 119 天不可用。
          #    固定 tag + 无外网集群里 Always 没有收益（tag 不可变，pull 只多做一次
          #    digest 校验），换来的是「重建必挂」。所以要求逐容器显式且非 Always。
          for d in docs:
              if d.get("kind") not in ("Deployment", "DaemonSet", "StatefulSet", "Job"):
                  continue
              pspec = d["spec"]["template"]["spec"]
              for c in (pspec.get("containers") or []) + (pspec.get("initContainers") or []):
                  where = f"{d['kind']}/{d['metadata']['name']}[{c['name']}]"
                  pol = c.get("imagePullPolicy")
                  if not pol:
                      problems.append(f"{where} 未显式声明 imagePullPolicy：缺省值由 tag 推导且会固化，"
                                      f"`:latest` 会变成 Always，在无外网集群里重建必挂")
                  elif pol == "Always":
                      problems.append(f"{where} 的 imagePullPolicy 是 Always：镜像 tag 固定时"
                                      f"Always 只多一次 digest 校验，却让无外网集群的 Pod 重建必失败")
          if problems:
              print("观测栈持久化/采集链不变量未通过：")
              for item in problems:
                  print("  -", item)
              sys.exit(1)
          print("✅ TSDB 已落 PVC + Recreate；ingress_logs 的 metadata 集只含有界字段；"
                "Loki 配置已入 Git 且未开启删除；所有容器的 imagePullPolicy 均已显式声明且非 Always")
          PY

      # 2026-10-31 staging 事故：合并后 alloy 立刻 CrashLoopBackOff，日志采集中断约
      # 3 分钟。根因是重写 loki.process "ingress_logs" 时删掉了两张表的尾逗号
      # （River 表项必须逗号分隔）。上面那条正则检查全程绿着 —— 它只查「键在不在」，
      # 查不出「这串字解析器收不收」。正则证明不了语法，只有解析器能。
      # 所以这里把渲染出来的 config.alloy 交给 alloy 自己的 `alloy fmt`（纯解析；
      # 不用 --test，它还会要求排版风格一致，我们这份缩进必然不满足，等于永久假红），
      # 并先用两份常量夹具做双向自证：缺逗号必须失败且报 missing ','，补齐必须成功。
      # 解析器镜像从渲染结果里的 Alloy DaemonSet 取，与线上同版本，不会漂移。
      - name: Alloy 配置语法真解析（alloy fmt + 双向自证）
        run: |
          set -euo pipefail
          helm template obs deploy/helm/hci-platform-obs \
            --set global.domain=ci.example.com \
            >/tmp/obs-alloy-syntax.yaml
          python3 scripts/ci/check_alloy_syntax.py /tmp/obs-alloy-syntax.yaml

      - name: Helm template 渲染检查
        run: |
          helm template hci-platform deploy/helm/hci-platform \
            -f deploy/helm/hci-platform/values.yaml \
            --set diagnosisService.enabled=true \
            --set-string diagnosisService.directUploadBaseUrl=http://diagnosis-service:8008 \
            --set-string diagnosisService.allowedOrigins=http://customer-ui \
            --set-string secrets.collectorSigningPrivateKeyB64=Y2ktb25seS1ub3QtYS1yZWFsLWtleQ== \
            --set-string secrets.collectorSigningKeyId=ci-template-check \
            --set-string secrets.diagnosisEncryptionPrivateKeyB64=Y2ktb25seS1ub3QtYS1yZWFsLWtleQ== \
            --set-string secrets.diagnosisEncryptionKeyId=ci-template-check \
            >/tmp/hci-platform-rendered.yaml

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            helm template hci-sim deploy/helm/hci-sim \
              --namespace hci-sim-dev \
              >/tmp/hci-sim-rendered.yaml
          fi

          if [ ! -s /tmp/hci-platform-rendered.yaml ]; then
            echo "Helm 渲染结果为空"
            exit 1
          fi

          # DSH chart：只验证可渲染与非空，镜像坐标等由部署时注入
          helm template dsh deploy/helm/hci-platform-dsh \
            --set global.publicUrl=https://ci.example.com \
            --set global.imagePullUser=ci \
            --set secrets.ghcrToken=ci-only-not-a-real-token \
            >/tmp/hci-platform-dsh-rendered.yaml

          if [ ! -s /tmp/hci-platform-dsh-rendered.yaml ]; then
            echo "DSH chart 渲染结果为空"
            exit 1
          fi

      # 2026-10-30 staging 实测：13 个 Deployment 都没有 lifecycle.preStop。
      # 旧 Pod 收到 SIGTERM 是毫秒级停止监听，而它从 EndpointSlice 消失、再经
      # Traefik / kube-proxy 传播到每条转发路径需要约 2s——这个差集就是发布瞬间的
      # 502 窗口（case-service 经 Traefik 施压 2338 次吃到 28 个，endpoints 却全程非空）。
      # 修复是共享 helper hci.preStopLifecycle + 每个 Deployment 主动 include，
      # 「主动 include」最容易在新服务上漏掉，所以源码与渲染结果两头都锁。
      - name: preStop 覆盖率（模板源码 + 渲染结果）
        run: python3 scripts/ci/check_prestop_coverage.py /tmp/hci-platform-rendered.yaml

      # 2026-10-30 staging 实测现网 PDB 数为 0：pdb.yaml 是手工复制的，只覆盖 6/13
      # 个服务，且条件全是 `gt replicaCount 1`，而 staging 副本数全为 1——源码看着
      # 「有 PDB 模板」，渲染结果一个也没有。于是「节点驱逐/维护」这条非发布路径
      # 没有任何保护（同日实测：并发删 Pod 产生 503×1971 + 502×187）。
      # 两道检查都靠渲染结果，不靠数模板里的段落：
      #   1) 默认 values（全单副本）：不得出现任何 PDB——单副本 + minAvailable=1
      #      会让 kubectl drain 永久卡住，错方向的 PDB 比没有 PDB 难排查；
      #   2) 把可无状态扩副本的服务拉到 2：每个都必须渲染出自己的 PDB。
      # 另加一条守卫负例：不可多副本的服务把 replicaCount 改大必须渲染失败。
      # 不测负例的门禁只会给出「全绿」这一种答案，那跟没有门禁等价。
      - name: PDB 覆盖面 + 单副本守卫
        run: |
          set -euo pipefail
          render() {
            helm template hci-platform deploy/helm/hci-platform \
              -f deploy/helm/hci-platform/values.yaml \
              --set diagnosisService.enabled=true \
              --set-string diagnosisService.directUploadBaseUrl=http://diagnosis-service:8008 \
              --set-string diagnosisService.allowedOrigins=http://customer-ui \
              --set-string secrets.collectorSigningPrivateKeyB64=Y2ktb25seS1ub3QtYS1yZWFsLWtleQ== \
              --set-string secrets.collectorSigningKeyId=ci-template-check \
              --set-string secrets.diagnosisEncryptionPrivateKeyB64=Y2ktb25seS1ub3QtYS1yZWFsLWtleQ== \
              --set-string secrets.diagnosisEncryptionKeyId=ci-template-check \
              "$@"
          }

          render >/tmp/hci-platform-default.yaml
          render --set adminUI.replicaCount=2 \
                 --set customerUI.replicaCount=2 \
                 --set authService.replicaCount=2 \
                 --set caseService.replicaCount=2 \
                 --set conversationService.replicaCount=2 \
                 >/tmp/hci-platform-scaled.yaml

          python3 scripts/ci/check_pdb_coverage.py /tmp/hci-platform-default.yaml /tmp/hci-platform-scaled.yaml

          # 副本数为 2 时渲染不出 PDB，就是「有模板但没保护」的那个坑重演
          for name in admin-ui customer-ui auth-service case-service conversation-service; do
            if ! awk -v n="name: ${name}-pdb" '/kind: PodDisruptionBudget/{f=1} f && $0 ~ n {ok=1} END{exit !ok}' /tmp/hci-platform-scaled.yaml; then
              echo "scaled 渲染里缺少 ${name}-pdb"
              exit 1
            fi
          done

          # 守卫负例：会话/池状态在进程内存里的服务，扩副本必须 fail
          for key in apiGateway schedulerService kbService; do
            if out=$(render --set "${key}.replicaCount=2" 2>&1); then
              echo "${key}.replicaCount=2 居然渲染成功了：replica-guards.yaml 的守卫被删了或写错了"
              exit 1
            elif ! printf '%s' "$out" | grep -q "${key}.replicaCount 必须为 1"; then
              echo "${key} 渲染失败但不是因为单副本守卫：$out" | head -5
              exit 1
            fi
          done

          # terminal-bridge 是两层守卫，且**报错来源跟上面三个不一样**：
          #   第一层 values.schema.json 的 `maximum: 1`（Helm 先做 schema 校验）；
          #   第二层 _helpers.tpl 的 hci.terminalBridgeGuard（实测仅在
          #   `--skip-schema-validation` 且 enabled=true 时才会触发）。
          # 只测第二层等于默认第一层一定生效，只测第一层则没人知道第二层还存在，
          # 所以这里验默认路径（schema）报的是 replicaCount 上限，下面单独验模板守卫。
          if out=$(render --set terminalBridge.replicaCount=2 2>&1); then
            echo "terminalBridge.replicaCount=2 居然渲染成功了：values.schema.json 的 maximum:1 被删了"
            exit 1
          #  比对文案时不能绑 Helm 版本：同一份 schema 越界，v3.20 输出
          #  "- at '/terminalBridge/replicaCount': maximum: got 2, want 1"，
          #  而 CI 的 v3.17.3 输出 "- terminalBridge.replicaCount: Must be less than
          #  or equal to 1"。第一版只匹配本地文案 → 本地全绿、CI 红。
          #  所以断言要求「键名 + 越界语义」同时出现，两种格式都盖得住。
          elif ! printf '%s' "$out" | grep -Eq "terminalBridge[./]replicaCount.*(maximum|less than or equal to)"; then
            echo "terminal-bridge 渲染失败但不是因为 schema 的副本上限：$out" | head -5
            exit 1
          fi
          if out=$(render --set terminalBridge.enabled=true \
                         --set terminalBridge.replicaCount=2 \
                         --skip-schema-validation 2>&1); then
            echo "跳过 schema 后 terminal-bridge 的模板守卫也没拦住：hci.terminalBridgeGuard 成了死代码"
            exit 1
          elif ! printf '%s' "$out" | grep -q "terminalBridge.replicaCount 必须为 1"; then
            echo "terminal-bridge 模板守卫拦住了但不是这条原因：$out" | head -5
            exit 1
          fi

      # 数值型环境变量必须是纯十进制：Helm 把 values 里的数字解析为 float64，
      # 模板里直接 `| quote` 会用 %v 格式化，8388608 会变成 "8.388608e+06"。
      # 容器侧是 pydantic int 字段，科学计数法字符串直接 ValidationError，
      # 整个服务起不来（2026-10-30 staging case-service CrashLoopBackOff）。
      # 8001 这类小整数碰巧不会退化，所以历史上一直没暴露。
      - name: 数值型环境变量渲染格式检查
        run: |
          set -euo pipefail
          for name in LOG_COLLECT_CHUNK_SIZE_BYTES; do
            value=$(awk -v n="- name: $name" '$0 ~ n {f=1; next} f && /value:/ {gsub(/^[ \t]*value:[ \t]*"?|"[ \t]*$/, ""); print; exit}' \
              /tmp/hci-platform-rendered.yaml)
            echo "$name=$value"
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::$name 渲染为 \"$value\"，不是十进制整数；请改用 {{ \$value | int64 | quote }}"
              exit 1
            fi
          done

      # E-2: helm-unittest — 覆盖关键配置渲染场景
      - name: 缓存 Helm 插件
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/share/helm/plugins
          key: helm-unittest-v0.4.4
          restore-keys: helm-unittest-

      - name: 安装 helm-unittest 插件（二进制方式）
        env:
          HELM_UNITTEST_VERSION: "v0.4.4"
        run: |
          PLUGINS_DIR="$(helm env HELM_PLUGINS)"
          # 如果缓存命中，插件目录已存在，跳过下载
          if [ -f "${PLUGINS_DIR}/helm-unittest/unittest" ]; then
            echo "helm-unittest 插件已从缓存恢复，跳过下载"
          else
            mkdir -p "${PLUGINS_DIR}/helm-unittest"
            ARCHIVE="/tmp/helm-unittest-linux-amd64-${HELM_UNITTEST_VERSION#v}.tgz"
            curl -fsSL "https://github.com/helm-unittest/helm-unittest/releases/download/${HELM_UNITTEST_VERSION}/helm-unittest-linux-amd64-${HELM_UNITTEST_VERSION#v}.tgz" \
              -o "${ARCHIVE}"
            echo "d890849e16b3e35a2ed1ce5a9b8806539ca337a458e685bc1c3bbbe5e701566f  ${ARCHIVE}" | sha256sum -c -
            tar xzf "${ARCHIVE}" -C "${PLUGINS_DIR}/helm-unittest"
          fi
          helm plugin list | grep unittest

      - name: 运行 Helm Unit Tests
        run: |
          helm unittest deploy/helm/hci-platform --strict
          echo "✅ Helm Unit Tests 通过"

      # E-3: ArgoCD Application 同步不变式
      # 规则：带 automated.selfHeal 的 Application 必须显式声明 syncPolicy.retry。
      # 原因见 docs/deploy/部署设计.md §9.6：selfHeal 不重试失败操作，缺少 retry 时
      # hook Job 的瞬态失败（如依赖 Secret 缺失）会永久挂起，只能人工介入。
      - name: 校验 ArgoCD Application 同步不变式
        run: python3 scripts/ci/check_argocd_app_sync_invariants.py

      - name: 上传 Helm 渲染产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helm-rendered
          path: |
            /tmp/hci-platform-rendered.yaml
          retention-days: 1
  # check-claw-configs job 已删除（claw-configs 目录已移除）
  # check-db-migrations-sync job 已删除（Atlas 改造后不再需要 ConfigMap 同步检查）
  # 替代方案：.github/workflows/db-migration-test.yml 中的 atlas migrate lint + apply 验证

  probe-alignment:
    name: Layer-2A 探针路径对齐检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, helm-validate]
    # 只有 Helm 渲染成功并上传产物时才运行；如果上游因变更范围被跳过，
    # 本检查也必须跳过，不能下载一个不存在的 artifact 再制造假失败。
    if: |
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.platform_helm == 'true')
      ) &&
      needs.helm-validate.result == 'success'
    steps:
      - name: 下载 Helm 渲染产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: helm-rendered
          path: /tmp

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 检查探针路径对齐
        run: |
          # 使用已下载的 Helm 渲染产物
          if [ ! -s /tmp/hci-platform-rendered.yaml ]; then
            echo "Helm 渲染产物不存在或为空"
            exit 1
          fi

          # 提取所有 liveness/readiness/startup probe 的 path 字段
          PROBE_PATHS=$(grep -A2 'httpGet:' /tmp/hci-platform-rendered.yaml \
            | grep 'path:' \
            | awk '{print $2}' \
            | sort -u)
          echo "Chart 中使用的探针路径："
          echo "${PROBE_PATHS}"

          # 对每个探针路径，检查后端代码是否存在对应路由定义
          ALL_OK=true
          for PROBE_PATH in ${PROBE_PATHS}; do
            if ! grep -rq "${PROBE_PATH}" backend/; then
              echo "❌ 探针路径 '${PROBE_PATH}' 在 backend/ 中未找到对应路由定义！"
              ALL_OK=false
            else
              echo "✓ 探针路径 '${PROBE_PATH}' 后端路由存在"
            fi
          done

          if [ "${ALL_OK}" = "false" ]; then
            echo ""
            echo "探针路径与后端路由不对齐！修改 Helm chart probe path 后必须确认后端已实现对应路由。"
            exit 1
          fi
          echo "✅ 所有探针路径均已在后端代码中找到对应路由"

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    env:
      HCI_TESTING: "1"
      CI_TRACE_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-unit-tests
    # 部署配置的输入在 deploy/ 侧，不在 backend filter 内：这类 PR 的
    # unit_test_mode 为 none，job 只需执行「校验部署配置契约」这一步，
    # 其余步骤各自的 if 会按 mode 跳过。该 job 名称是必需状态检查，
    # 契约必须挂在它上面才能真正阻断合并。
    #
    # 注意：`if: |` 是 YAML 块标量，其中的 `#` 不是注释而是表达式字符串的一部分，
    # 会让 GitHub 表达式词法分析失败并导致整个工作流文件失效（所有 job 都不执行、
    # 必需状态检查永远停在 Expected）。说明只能写在 `if:` 之前。
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend_gate_required == 'true') ||
        github.event_name == 'merge_group' ||
        (github.event_name == 'pull_request' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.unit_test_mode == 'full')) ||
        needs.changes.outputs.deploy_config == 'true'
      )
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 安装 uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39a
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 缓存 uv 虚拟环境
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .venv
          key: ${{ runner.os }}-uv-venv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-venv-

      - name: 安装依赖
        run: uv sync --group dev

      - name: 运行 PR 受影响单元测试
        if: github.event_name == 'pull_request' && needs.changes.outputs.unit_test_mode == 'targeted'
        env:
          TEST_TARGETS: ${{ needs.changes.outputs.unit_test_targets }}
          TEST_REASON: ${{ needs.changes.outputs.unit_test_reason }}
        run: |
          mapfile -t TARGETS <<< "$TEST_TARGETS"
          if [[ "${#TARGETS[@]}" -eq 0 || -z "${TARGETS[0]}" ]]; then
            echo "快速测试计划没有目标，拒绝将空集合标记为成功"
            exit 1
          fi

          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "trace_id=${CI_TRACE_ID} mode=targeted reason=${TEST_REASON} targets=${TARGETS[*]}"
          # 收敛手段是范围而不是时间上界，上界只用于防止挂起。注意快速路径不带
          # --cov：完整路径里 kb-service 的 58s 全部来自覆盖率追踪放大（jieba 词典
          # 模块 35k 行字面量），无插桩时该套件仅约 0.3s。
          #
          # 每个目标必须独立成进程：各后端服务都以 `app` 作为顶层包名，且存在同名
          # 测试模块（如 api-gateway 与 conversation-service 都有 tests/unit/
          # test_bridge_logs.py）。合并进一个 pytest 进程时，先收集的服务会把
          # sys.modules['app'] 占为己有，后续服务要么 import file mismatch，
          # 要么导入到别的服务的 app 包（表现为 Table already defined、
          # ModuleNotFoundError: app.tools 等与本次变更无关的伪失败）。
          FAILED_TARGET=""
          for TARGET in "${TARGETS[@]}"; do
            echo "::group::pytest ${TARGET}"
            if ! timeout 240s uv run pytest "$TARGET" -q --no-cov -m "not integration and not slow"; then
              FAILED_TARGET="$TARGET"
              echo "::error::快速单元测试失败：${TARGET}"
            fi
            echo "::endgroup::"
          done
          FINISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "### PR 快速单元测试"
            echo
            echo "- 调用链：\`${CI_TRACE_ID}\`"
            echo "- 模式：受影响测试"
            echo "- 开始：${STARTED_AT}"
            echo "- 结束：${FINISHED_AT}"
            echo "- 目标：\`${TARGETS[*]}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$FAILED_TARGET" ]]; then
            echo "快速单元测试失败目标：${FAILED_TARGET}"
            exit 1
          fi

      - name: 运行完整单元测试（含覆盖率）
        if: github.event_name != 'pull_request' || needs.changes.outputs.unit_test_mode == 'full'
        run: |
          # 各服务 app/ 包名相同，pytest 单进程 sys.modules 会跨服务污染
          # 分进程运行保证各自 sys.modules 隔离，--cov-append 合并覆盖率。
          #
          # 三处实测结论（本机同一用例集合对照）：
          # 1) 覆盖率报告只在最后一批生成：--cov-append 已把数据累积进 .coverage，
          #    前 7 批重复渲染 xml/term-missing 是纯开销，codecov 消费的只是最后一次
          #    产出的 coverage.xml。
          # 2) addopts 默认 -n auto，但这些套件的固定成本（worker 启动 + 每个 worker
          #    重复导入与 conftest）高于并行收益，除 agent-service 外 -n0 都更快：
          #    tests/unit 1.95↔3.08 | api-gateway 8.00↔11.92 | case-service 0.58↔1.74
          #    conversation 1.35↔2.47 | kb-service 1.94↔2.97 | diagnosis 9.34↔11.69
          #    scheduler 0.71↔2.00（左 = -n0，右 = -n auto，单位秒）；agent-service
          #    4.57↔4.33 为平局，保留默认并行。若某套件在 CI 上反向变慢，删掉该行的
          #    -n0 即可回到默认。
          # 3) jieba 的 HMM 词典模块 finalseg/prob_emit.py 是 35226 行字面量：无插桩
          #    导入 0.01s，但在 coverage 追踪下需 25s（本机实测），CI 上该套件曾为此
          #    多付约 55s。jieba 属三方库、本不计入 backend 覆盖率，故把该文件移出
          #    插桩运行，单独用 --no-cov 验证分词契约。
          uv run pytest tests/unit/ \
            -n0 -x -q \
            --cov=backend --cov-append \
            -m "not integration and not slow"
          uv run pytest backend/api-gateway/tests/unit/ \
            -n0 -x -q \
            --cov=backend --cov-append \
            -m "not integration and not slow"
          uv run pytest backend/agent-service/tests/unit/ \
            -x -q \
            --cov=backend --cov-append \
            -m "not integration and not slow"
          uv run pytest backend/case-service/tests/unit/ \
            -n0 -x -q \
            --cov=backend --cov-append \
            -m "not integration and not slow"
          uv run pytest backend/conversation-service/tests/unit/ \
            -n0 -x -q \
            --cov=backend --cov-append \
            -m "not integration and not slow"
          uv run pytest backend/kb-service/tests/ \
            --ignore=backend/kb-service/tests/test_jieba_hci.py \
            -n0 -x -q \
            --cov=backend --cov-append \
            -m "not integration and not slow"
          uv run pytest backend/kb-service/tests/test_jieba_hci.py \
            -n0 -x -q --no-cov \
            -m "not integration and not slow"
          uv run pytest backend/diagnosis-service/tests/unit/ \
            -n0 -x -q \
            --cov=backend --cov-append \
            -m "not integration and not slow"
          uv run pytest backend/auth-service/app/tests/ \
            -n0 -x -q \
            --cov=backend --cov-append \
            -m "not integration and not slow"
          uv run pytest backend/shared/tests/ \
            -n0 -x -q \
            --cov=backend --cov-append \
            -m "not integration and not slow"
          # 最后一批：渲染报告并合并所有覆盖率后统一检查基线（≥60%），避免分批检查造成误报
          uv run pytest backend/scheduler-service/tests/unit/ \
            -n0 -x -q \
            --cov=backend --cov-report=xml --cov-report=term-missing --cov-append \
            --cov-fail-under=60 \
            -m "not integration and not slow"

      - name: 验证在线/离线诊断 KBD 样例闭环
        if: github.event_name != 'pull_request' || needs.changes.outputs.unit_test_mode == 'full'
        run: make diagnosis-sample-preflight

      - name: 验证 QFK Schema 到变量池契约矩阵
        if: github.event_name != 'pull_request' || needs.changes.outputs.unit_test_mode == 'full'
        run: PYTHONPATH=backend/agent-service:backend uv run pytest backend/agent-service/tests/integration/test_qfk_signal_contract_matrix.py -x -q

      - name: 校验部署配置契约
        run: REQUIRE_HELM=1 make config-contract-check

      # SRC-2026-5358 回归门禁：internal 管理面公网封禁护栏（独立 guard
      # Ingress + ipAllowList 中间件）必须在 chart 渲染产物中持续存在。
      # 任何人删除 ingress-internal-guard.yaml 或关掉默认开关都会在此失败。
      - name: 校验 internal 管理面公网封禁渲染契约
        run: uv run python scripts/verify/verify_internal_guard.py --require-helm

      # SRC-2026-5358 回归门禁（B1）：身份注入链不得回潮。删除 Nginx 注入与把
      # /api 收回网关在功能上完全"正常"，只有安全属性被悄悄丢掉，评审极难发现，
      # 故用渲染契约固化：注入 env、注入指令、/api 转发目标、管理入口封禁开关。
      - name: 校验网关身份重签渲染契约（B1）
        run: uv run python scripts/verify/verify_identity_resign.py --require-helm

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.unit_test_mode == 'full')
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  go-checks:
    # Go 验证独立成 job：它原本挂在 unit-tests 内（安装 Go 14s + hci_sim 33s +
    # offline-collector 4s ≈ 51s 实测），既不使用 uv 也不使用 .venv，却让 Python
    # 回归的关键路径为它排队。拆出后两者并行推进，unit-tests 不再支付这 51s。
    #
    # 触发条件只取决于 Go 输入：hci_sim/** 与 offline-collector/** 都不在 backend
    # filter 内，此前这类 PR 既不启动 unit-tests 也没有任何 Go 校验（零门禁），
    # merge_group 保持无条件执行，与 unit-tests 的合并队列语义一致：进队列的变更
    # 不做范围收敛。
    name: Go 运行时验证
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      needs.changes.outputs.go_code == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            backend/diagnosis-service/offline-collector/go.mod
            hci_sim/go.mod

      - name: 验证 Diagnosis Sample Lab（诊断样例实验室）Go Runtime
        working-directory: hci_sim
        run: |
          go test -p 4 ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -o /tmp/hci-sim-diagnosis-lab ./cmd/hci-sim

      - name: 运行离线采集 Go 运行时测试
        working-directory: backend/diagnosis-service/offline-collector
        run: |
          go test -p 4 ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="-s -w -buildid=" -o /tmp/hci-collect-linux-amd64 .
          test "$(sha256sum /tmp/hci-collect-linux-amd64 | cut -d' ' -f1)" = "$(sha256sum ../resources/bin/hci-collect-linux-amd64 | cut -d' ' -f1)"

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    # 集成门禁自守：PR 触及集成测试时无条件执行，避免快速单测计划（mode 可为
    # targeted/none）把整条集成测试门禁静默关掉。
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend_gate_required == 'true') ||
        github.event_name == 'merge_group' ||
        (github.event_name == 'pull_request' && needs.changes.outputs.unit_test_mode == 'full') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.integration_tests_changed == 'true')
      )

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 安装 uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39a
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 安装依赖
        run: uv sync --group dev

      - name: 准备诊断样例 PostgreSQL
        # make db-sync 会隐式构建 db-migrate（Dockerfile.migrations）。Runner 在海外，
        # 必须与 build-push-action 一致地传 MIRROR_MODE=off 走官方源：阿里云 CDN 边缘
        # 同步滞后时 apk upgrade 会命中 "HTTP 404: Not Found"（ca-certificates-bundle）而阻断构建。
        env:
          MIRROR_MODE: "off"
        run: |
          cp .env.example .env
          docker network inspect hci-troubleshoot-platform_default >/dev/null 2>&1 \
            || docker network create hci-troubleshoot-platform_default
          docker compose --env-file .env.example -f deploy/docker/docker-compose.yml up -d postgres
          make db-sync

      - name: 验证五篇 KBD 数据库闭环
        run: make diagnosis-sample-postgres-preflight

      - name: 运行集成测试
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          # 各服务分开进程运行，避免 app/ 命名空间跨服务污染
          uv run pytest tests/integration/ -x -q -m "integration"
          uv run pytest backend/conversation-service/tests/integration/ -x -q -m "integration"
          uv run pytest backend/scheduler-service/tests/integration/ -x -q -m "integration"
          uv run pytest backend/api-gateway/tests/integration/ -x -q -m "integration"

  security-tests:
    name: security-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    # 安全门禁自守：PR 触及 tests/security/** 时无条件执行（成因同 integration-tests）。
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend_gate_required == 'true') ||
        github.event_name == 'merge_group' ||
        (github.event_name == 'pull_request' && needs.changes.outputs.unit_test_mode == 'full') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.security_tests_changed == 'true')
      )
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 安装 uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39a
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 安装依赖
        run: uv sync --group dev

      - name: 运行 CORS 安全测试
        run: |
          uv run pytest tests/security/ -x -q -v

  release-metadata:
    name: 发布元数据产物
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, unit-tests, integration-tests, security-tests, go-checks]
    # backend_gate_required != 'true' 表示本轮变更不进入后端门禁输入，三个测试 job
    # 按设计 skipped；这种情况下 skipped 不是失败证据缺失，不得阻断发布元数据。
    # go-checks 只在 Go 输入变更时执行（skipped 表示本轮没有 Go 变更），因此它与
    # 后端门禁层取不同判定：跑过就必须成功，没跑不构成阻断理由。
    if: |
      always() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      (needs.go-checks.result == 'success' || needs.go-checks.result == 'skipped') &&
      (
        needs.changes.outputs.backend_gate_required != 'true' ||
        (needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' && needs.security-tests.result == 'success')
      )
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 生成发布元数据
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > release-metadata.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${GITHUB_REF_NAME}",
            "commit_sha": "${GITHUB_SHA}",
            "short_sha": "${SHORT_SHA}",
            "build_time_utc": "${BUILD_TIME}",
            "workflow": "CI",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}"
          }
          EOF

      - name: 上传发布元数据
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-metadata
          path: release-metadata.json

  # ─────────────────────────────────────────────────────────────────────────
  # Sprint 1 新增：镜像构建 + 安全扫描 + 自动晋级 dev（仅 main push 触发）
  # ─────────────────────────────────────────────────────────────────────────

  prepare:
    name: 准备构建元数据
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, unit-tests, integration-tests, security-tests, go-checks]
    # 与 release-metadata 保持同一判定：本轮变更不进入后端门禁输入时，三个测试
    # job 按设计 skipped，发布前置条件由 changes 的影响范围证据承担。go-checks
    # 同理：只有 Go 输入变更时才会执行，执行了就必须成功。
    if: |
      always() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      (needs.go-checks.result == 'success' || needs.go-checks.result == 'skipped') &&
      (
        needs.changes.outputs.backend_gate_required != 'true' ||
        (needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' && needs.security-tests.result == 'success')
      )
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      image_matrix: ${{ needs.changes.outputs.image_matrix }}
      has_images: ${{ needs.changes.outputs.has_images }}
      deploy_services: ${{ needs.changes.outputs.deploy_services }}
      has_deploy_services: ${{ needs.changes.outputs.has_deploy_services }}
      db_migrate: ${{ needs.changes.outputs.db_migrate }}
    steps:
      - name: 生成唯一镜像标签（日期-时间-sha7）
        id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build-and-push:
    name: 构建并推送镜像（${{ matrix.service }}）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.has_images == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.image_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建待扫描镜像
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            local/${{ matrix.service }}:${{ needs.prepare.outputs.image_tag }}
            local/${{ matrix.service }}:latest
          build-args: |
            SOURCE_SHA=${{ github.sha }}
            IMAGE_TAG=${{ needs.prepare.outputs.image_tag }}
            # GitHub 托管 Runner（海外）：镜像源脚本走官方源（deploy/docker/base/setup-mirror.sh），
            # mirrors.aliyun.com 从海外访问高延迟且偶发限流，仅本地开发（国内网络）使用。
            MIRROR_MODE=off

      # 扫描只提供安全信号，不得成为 GHCR 发布的单点故障；正式标签必须在
      # 构建成功后才能推送。扫描使用本地镜像，避免先发布后扫描的不可追溯窗口。
      - name: Trivy 镜像安全扫描（HIGH/CRITICAL，非阻断）
        id: scan
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        continue-on-error: true
        with:
          image-ref: local/${{ matrix.service }}:${{ needs.prepare.outputs.image_tag }}
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          version: v0.73.0
          format: sarif
          output: trivy-${{ matrix.service }}.sarif

      - name: 上传安全扫描结果（GitHub Security 标签页可见）
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

      - name: 推送已扫描镜像
        id: push
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          source_image="local/${{ matrix.service }}:${{ needs.prepare.outputs.image_tag }}"
          target_image="ghcr.io/${GITHUB_REPOSITORY}/${{ matrix.service }}"
          docker tag "${source_image}" "${target_image}:${{ needs.prepare.outputs.image_tag }}"
          docker tag "local/${{ matrix.service }}:latest" "${target_image}:latest"
          docker push "${target_image}:${{ needs.prepare.outputs.image_tag }}"
          docker push "${target_image}:latest"
          echo "已推送镜像：${target_image}:${{ needs.prepare.outputs.image_tag }}"

      - name: 镜像发布审计摘要
        if: always()
        run: |
          {
            echo "### 镜像发布审计"
            echo "- service: \`${{ matrix.service }}\`"
            echo "- source_sha: \`${GITHUB_SHA}\`"
            echo "- image_tag: \`${{ needs.prepare.outputs.image_tag }}\`"
            echo "- scan: \`${{ steps.scan.outcome }}\`"
            echo "- push: \`${{ steps.push.outcome }}\`"
            echo "- run_id: \`${GITHUB_RUN_ID}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # hci-sim 暂未迁入 hci-platform-env，由本仓库 Argo Application 直接消费。
  # dev/staging 各有独立 Argo Application，晋级请求按 service+environment 唯一，
  # 后续构建更新同一个 PR，禁止按 digest 堆积或允许旧候选乱序合并。
  #
  # 设计（第一性原理 + 对抗性审查）：
  #   1. digest 不可变是硬约束，不可放弃 → 仍固定 @sha256:。
  #   2. main ruleset 禁止 GITHUB_TOKEN 直接写 main → 不能隐式自动 push。
  #   3. digest 必须能反查 source SHA → 镜像 OCI label 与 GitOps annotation 双重绑定。
  #   4. 晋级请求不是部署完成证明 → 本 job 只持久化 promotion，ArgoCD 另行验收。
  #   5. 幂等键是 hci-sim+dev，而不是 digest → 固定分支/PR，新的候选取代旧候选。
  promote-hci-sim-dev:
    # Jobs API 依赖此稳定机器名记录服务构建基线，禁止按展示文案随意改名。
    name: hci-sim-promotion-request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare, build-and-push]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.build-and-push.result != 'cancelled' &&
      contains(needs.prepare.outputs.image_matrix, '"service":"hci-sim"') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.promote_target == 'dev' || inputs.promote_target == 'staging' || inputs.promote_target == 'both' || inputs.promote_target == 'all'))
      )
    permissions:
      contents: write
      packages: read
      pull-requests: write
    outputs:
      promotion_pr_url: ${{ steps.promote.outputs.pr_url }}
      promotion_recorded: ${{ steps.promote.outputs.promotion_recorded }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # 晋级 job 只在 main push/显式 main workflow_dispatch 上运行。
          # 使用仓库 owner 的 PAT 创建 promotion PR，避免 github-actions[bot]
          # 被 first_time_contributors 审批策略误判为外部首次贡献者。
          # 普通 pull_request 仍使用默认 GITHUB_TOKEN，不改变外部代码执行边界。
          token: ${{ secrets.ENV_REPO_PAT }}

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析并校验 manifest digest
        id: digest
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY}/hci-sim"
          tagged_image="${repository}:${IMAGE_TAG}"
          digest="$(docker buildx imagetools inspect "${tagged_image}" --format '{{.Manifest.Digest}}')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::未取得合法 OCI manifest digest：${digest}"
            exit 1
          fi
          immutable_image="${repository}@${digest}"
          # tag 只用于发现 digest；拉取与身份校验必须绑定同一个不可变引用，消除 TOCTOU 窗口。
          docker pull "${immutable_image}" >/dev/null
          actual_source_sha="$(docker image inspect "${immutable_image}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "${actual_source_sha}" != "${EXPECTED_SOURCE_SHA}" ]]; then
            echo "::error::镜像源码 revision 不匹配：expected=${EXPECTED_SOURCE_SHA} actual=${actual_source_sha}"
            exit 1
          fi
          echo "image=${immutable_image}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${actual_source_sha}" >> "${GITHUB_OUTPUT}"
          echo "hci-sim image=${immutable_image} source_sha=${actual_source_sha}"

      - name: 创建或更新唯一 hci-sim 非生产 promotion PR
        id: promote
        env:
          HCI_SIM_DIGEST: ${{ steps.digest.outputs.digest }}
          HCI_SIM_REPOSITORY: ghcr.io/${{ github.repository }}/hci-sim
          HCI_SIM_SOURCE_SHA: ${{ steps.digest.outputs.source_sha }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          EVENT_NAME: ${{ github.event_name }}
          PROMOTE_TARGET: ${{ inputs.promote_target }}
          # gh pr create/edit 必须使用与 checkout/push 相同的 owner PAT，
          # 否则 PR 作者仍会是 github-actions[bot]，继续触发审批门禁。
          GH_TOKEN: ${{ secrets.ENV_REPO_PAT }}
        run: |
          set -euo pipefail
          automation_actor="$(gh api user --jq '.login')"
          expected_actor="${GITHUB_REPOSITORY_OWNER}"
          if [[ "${automation_actor}" != "${expected_actor}" ]]; then
            echo "::error::ENV_REPO_PAT 必须属于仓库 owner：expected=${expected_actor} actual=${automation_actor}"
            exit 1
          fi
          echo "promotion PR automation actor=${automation_actor}（仓库 owner，可信来源）"
          echo "promotion_recorded=false" >> "${GITHUB_OUTPUT}"
          echo "pr_url=" >> "${GITHUB_OUTPUT}"

          if [[ "${EVENT_NAME}" == "push" ]]; then
            app_files=(
              "deploy/gitops/argo-apps/local/hci-sim-dev.yaml"
              "deploy/gitops/argo-apps/cloud/hci-sim-staging.yaml"
            )
            promotion_target="dev/staging"
            promotion_labels=("env:dev:sf" "env:staging:aihci")
          else
            case "${PROMOTE_TARGET}" in
              dev)
                app_files=("deploy/gitops/argo-apps/local/hci-sim-dev.yaml")
                promotion_target="dev"
                promotion_labels=("env:dev:sf")
                ;;
              staging)
                app_files=("deploy/gitops/argo-apps/cloud/hci-sim-staging.yaml")
                promotion_target="staging"
                promotion_labels=("env:staging:aihci")
                ;;
              both)
                app_files=(
                  "deploy/gitops/argo-apps/local/hci-sim-dev.yaml"
                  "deploy/gitops/argo-apps/cloud/hci-sim-staging.yaml"
                )
                promotion_target="dev/staging"
                promotion_labels=("env:dev:sf" "env:staging:aihci")
                ;;
              all)
                app_files=(
                  "deploy/gitops/argo-apps/local/hci-sim-dev.yaml"
                  "deploy/gitops/argo-apps/cloud/hci-sim-staging.yaml"
                )
                promotion_target="dev/staging"
                promotion_labels=("env:dev:sf" "env:staging:aihci")
                ;;
              *)
                echo "::error::无效的 hci-sim 晋级目标：${PROMOTE_TARGET}"
                exit 1
                ;;
            esac
          fi

          label_args=(--label "agent:codebuddy")
          for label in "${promotion_labels[@]}"; do
            label_args+=(--label "${label}")
          done

          # 每个目标 Application 都必须固定同一不可变 digest/source revision。
          all_pinned=1
          for app_file in "${app_files[@]}"; do
            grep -Fq "repository: ${HCI_SIM_REPOSITORY}" "${app_file}" || {
              echo "::error::Argo Application repository 未固定为 ${HCI_SIM_REPOSITORY}：${app_file}"
              exit 1
            }
            if ! grep -Fq "digest: \"${HCI_SIM_DIGEST}\"" "${app_file}" || \
               ! grep -Fq "hci-platform.dev/image-source-revision: \"${HCI_SIM_SOURCE_SHA}\"" "${app_file}"; then
              all_pinned=0
            fi
          done
          if [[ "${all_pinned}" == "1" ]]; then
            echo "hci-sim ${promotion_target} 已固定到 ${HCI_SIM_REPOSITORY}@${HCI_SIM_DIGEST} source=${HCI_SIM_SOURCE_SHA}"
            exit 0
          fi

          branch="ci/promote-hci-sim-non-prod"
          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git checkout -B "${branch}" "${GITHUB_SHA}"
          for app_file in "${app_files[@]}"; do
            python3 scripts/ci/update_hci_sim_promotion.py \
              --file "${app_file}" \
              --digest "${HCI_SIM_DIGEST}" \
              --source-sha "${HCI_SIM_SOURCE_SHA}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${app_files[@]}"
          git commit -m "ci(hci-sim): 晋级 ${promotion_target} 制品 ${HCI_SIM_DIGEST}

          [env:staging:aihci][agent:codebuddy]"
          git push --force-with-lease origin "HEAD:refs/heads/${branch}"

          body="$(cat <<EOF
          ## hci-sim ${promotion_target} 制品晋级

          本 PR 只记录已经构建完成的不可变制品，不代表 ArgoCD 已部署完成。

          - 源码提交：\`${HCI_SIM_SOURCE_SHA}\`
          - 镜像标签：\`${IMAGE_TAG}\`
          - 镜像：\`${HCI_SIM_REPOSITORY}@${HCI_SIM_DIGEST}\`
          - GitOps 文件：\`${app_files[*]}\`

          后续构建会更新本 PR，旧候选不得乱序合并；合并后仍需验证 ArgoCD Desired/Live digest。

          [env:staging:aihci][agent:codebuddy]
          EOF
          )"

          mapfile -t existing_prs < <(
            gh pr list --state open --head "${branch}" --base main --json url,author \
              --jq '.[] | [.url, .author.login] | @tsv'
          )
          if (( ${#existing_prs[@]} > 1 )); then
            echo "::error::发现多个 hci-sim ${promotion_target} promotion PR，拒绝选择不确定候选"
            exit 1
          elif (( ${#existing_prs[@]} == 1 )); then
            IFS=$'\t' read -r pr_url pr_author <<< "${existing_prs[0]}"
            if [[ "${pr_author}" != "${expected_actor}" ]]; then
              # PR 作者不可变；旧 bot-authored 候选必须关闭并由 owner PAT 重建，
              # 不能仅 push 新 commit 后误以为已进入可信来源。
              gh pr close "${pr_url}" --comment "自动晋级来源已迁移到仓库 owner；关闭旧 bot-authored 候选并重建。"
              pr_url="$(gh pr create \
                --head "${branch}" \
                --base main \
                --title "ci(hci-sim): 晋级 ${promotion_target} 制品 ${HCI_SIM_DIGEST}" \
                "${label_args[@]}" \
                --body "${body}")"
            else
              gh pr edit "${pr_url}" \
                --title "ci(hci-sim): 晋级 ${promotion_target} 制品 ${HCI_SIM_DIGEST}" \
                --body "${body}" \
                --add-label "agent:codebuddy" \
                $(printf -- '--add-label %q ' "${promotion_labels[@]}")
            fi
          else
            pr_url="$(gh pr create \
                --head "${branch}" \
                --base main \
                --title "ci(hci-sim): 晋级 ${promotion_target} 制品 ${HCI_SIM_DIGEST}" \
                "${label_args[@]}" \
                --body "${body}")"
          fi

          # 清理旧实现按 digest 生成的候选，防止人工误合并旧制品。
          legacy_prs="$(
            gh pr list --state open --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("ci/pin-hci-sim-digest-")) | .number'
          )"
          while IFS= read -r legacy_pr; do
            [[ -z "${legacy_pr}" ]] && continue
            gh pr close "${legacy_pr}" --comment "已由唯一 promotion PR ${pr_url} 取代，关闭旧 digest 候选以防乱序合并。"
          done <<< "${legacy_prs}"

          echo "已记录 hci-sim ${promotion_target} promotion：${pr_url}"
          echo "promotion_recorded=true" >> "${GITHUB_OUTPUT}"
          echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
          echo "promotion_target=${promotion_target}" >> "${GITHUB_OUTPUT}"

      - name: 汇总提示
        if: steps.promote.outputs.promotion_recorded == 'true'
        env:
          PR_URL: ${{ steps.promote.outputs.pr_url }}
          PROMOTION_TARGET: ${{ steps.promote.outputs.promotion_target }}
          SOURCE_SHA: ${{ steps.digest.outputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### hci-sim 非生产 promotion 结果"
            echo "- 状态：晋级请求已持久化（不代表部署完成）"
            echo "- source SHA：${SOURCE_SHA}"
            echo "- image digest：${IMAGE_DIGEST}"
            echo "- PR：${PR_URL}"
            echo "- 目标：${PROMOTION_TARGET}"
            echo "- 后续：合并后核验 ArgoCD Desired/Live digest 与 Pod revision。"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ─────────────────────────────────────────────────────────────────────────
  # db-migrate 镜像单独构建（仅 schema/extras/Dockerfile/脚本变更时触发）
  # 与 build-and-push 并行，互不阻塞
  # 详见 docs/solution/events/2026-04-10-解耦db-migrate镜像构建方案.md
  # ─────────────────────────────────────────────────────────────────────────
  build-db-migrate:
    name: 构建 db-migrate 镜像（仅 schema 变更时）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: prepare
    if: |
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.db_migrate == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      # 由 changes job 的完整 diff 决定；job 被跳过即表示无需 db-migrate。
      built: ${{ needs.prepare.outputs.db_migrate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # 必须配置 buildx（docker-container 驱动）：默认 docker 驱动不支持
      # type=gha 缓存导出，会报 Cache export is not supported for the docker driver。
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建待扫描 db-migrate 镜像
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: Dockerfile.migrations
          build-args: |
            MIRROR_MODE=off
          load: true
          push: false
          cache-from: type=gha,scope=db-migrate
          cache-to: type=gha,mode=max,scope=db-migrate
          tags: |
            local/db-migrate:${{ needs.prepare.outputs.image_tag }}
            local/db-migrate:latest

      # OS 层扫描只提供安全信号，不能阻断构建成功镜像的发布。
      - name: Trivy 镜像安全扫描（HIGH/CRITICAL，非阻断）
        id: scan
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        continue-on-error: true
        with:
          image-ref: local/db-migrate:${{ needs.prepare.outputs.image_tag }}
          exit-code: "0"
          severity: HIGH,CRITICAL
          vuln-type: os
          ignore-unfixed: true
          scanners: vuln
          version: v0.73.0
          format: sarif
          output: trivy-db-migrate.sarif

      - name: 上传安全扫描结果
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-db-migrate.sarif

      - name: Trivy db-migrate Atlas/library 扫描（信息性）
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        if: always()
        continue-on-error: true
        with:
          image-ref: local/db-migrate:${{ needs.prepare.outputs.image_tag }}
          exit-code: "0"
          severity: HIGH,CRITICAL
          vuln-type: library
          ignore-unfixed: true
          scanners: vuln
          version: v0.73.0
          format: sarif
          output: trivy-db-migrate-library.sarif

      - name: 上传 db-migrate Atlas/library 扫描结果
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-db-migrate-library.sarif

      - name: 推送已扫描 db-migrate 镜像
        id: push
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          target_image="ghcr.io/${GITHUB_REPOSITORY}/db-migrate"
          docker tag "local/db-migrate:${{ needs.prepare.outputs.image_tag }}" "${target_image}:${{ needs.prepare.outputs.image_tag }}"
          docker tag local/db-migrate:latest "${target_image}:latest"
          docker push "${target_image}:${{ needs.prepare.outputs.image_tag }}"
          docker push "${target_image}:latest"

      - name: db-migrate 发布审计摘要
        if: always()
        run: |
          {
            echo "### db-migrate 镜像发布审计"
            echo "- source_sha: \`${GITHUB_SHA}\`"
            echo "- image_tag: \`${{ needs.prepare.outputs.image_tag }}\`"
            echo "- scan: \`${{ steps.scan.outcome }}\`"
            echo "- push: \`${{ steps.push.outcome }}\`"
            echo "- run_id: \`${GITHUB_RUN_ID}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  auto-deploy-non-prod:
    name: 晋级非生产环境
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare, build-and-push, build-db-migrate]
    # push main 自动晋级 dev → staging；workflow_dispatch 只有显式选择目标时才晋级。
    # 手动发布仍须从 main 触发，避免把 feature 分支镜像写入环境仓库。
    # build-db-migrate 失败且本次确实应该构建（built==true）时阻止发布，避免传递一个实际没有推送的 tag
    # 晋级与镜像构建矩阵解耦：build-and-push 是 matrix job，
    # 单个服务构建失败不再阻断其余服务（含 admin-ui）晋级到非生产环境。
    # 已成功 push 的服务会在 env 仓库写入新 tag 并上线；未 push 的服务本次不更新，
    # 由下一轮成功发布补齐（resolve_release_baseline 的按服务补偿逻辑兜底）。
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.build-and-push.result != 'cancelled' &&
      (needs.build-db-migrate.result == 'success' || needs.build-db-migrate.result == 'skipped' || needs.build-db-migrate.outputs.built != 'true') &&
      (needs.prepare.outputs.has_deploy_services == 'true' || needs.prepare.outputs.db_migrate == 'true') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.promote_target != 'none')
      )
    steps:
      - name: 校验发布来源与目标
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          PROMOTE_TARGET: ${{ inputs.promote_target }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${REF_NAME}" != "refs/heads/main" ]]; then
            echo "::error::手动晋级必须从 main 分支触发，当前 ref=${REF_NAME}"
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "push" ]]; then
            echo "发布触发器：main push，目标环境：dev + staging（自动晋级；prod 仍需手动触发）"
          else
            echo "发布触发器：workflow_dispatch，目标环境：${PROMOTE_TARGET}"
          fi

      - name: Checkout 应用仓库（获取 sync-env-repo-tags.sh）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 直接推送镜像标签到环境仓库（dev 优先，串行执行）
        env:
          ENV_REPO_PAT: ${{ secrets.ENV_REPO_PAT }}
          EVENT_NAME: ${{ github.event_name }}
          PROMOTE_TARGET: ${{ inputs.promote_target }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          DB_MIGRATE_BUILT: ${{ needs.build-db-migrate.outputs.built }}
          SERVICES_CSV: ${{ needs.prepare.outputs.deploy_services }}
          HAS_DEPLOY_SERVICES: ${{ needs.prepare.outputs.has_deploy_services }}
        run: |
          set -euo pipefail
          if [[ -z "${ENV_REPO_PAT:-}" ]]; then
            echo "::error::未配置 ENV_REPO_PAT，无法写入 hci-platform-env"
            exit 1
          fi

          # 绕过 hci-platform-env workflow dispatch（私有仓库 Actions 分钟额度限制）
          # 改为在当前公开仓库（免费 Actions）中直接 clone → 调用脚本 → push
          if [[ "$DB_MIGRATE_BUILT" == "true" ]]; then
            echo "本次有 schema 变更，db-migrate tag：${IMAGE_TAG}"
            SKIP_DB_MIGRATE="false"
          else
            echo "本次无 schema 变更，跳过 db-migrate 更新"
            SKIP_DB_MIGRATE="true"
          fi

          # 空业务清单必须显式确认跳过；同时校验布尔输出与实际清单，避免发布范围漂移。
          if [[ "${HAS_DEPLOY_SERVICES}" == "true" ]]; then
            if [[ -z "${SERVICES_CSV}" ]]; then
              echo "::error::has_deploy_services=true，但 deploy_services 为空"
              exit 1
            fi
            SKIP_BUSINESS_TAGS="false"
          elif [[ "${HAS_DEPLOY_SERVICES}" == "false" ]]; then
            if [[ -n "${SERVICES_CSV}" ]]; then
              echo "::error::has_deploy_services=false，但 deploy_services 非空：${SERVICES_CSV}"
              exit 1
            fi
            SKIP_BUSINESS_TAGS="true"
          else
            echo "::error::has_deploy_services 非法：${HAS_DEPLOY_SERVICES:-<empty>}"
            exit 1
          fi

          # clone 环境仓库
          git clone "https://x-access-token:${ENV_REPO_PAT}@github.com/tomturing/hci-platform-env.git" env-repo
          cd env-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "${EVENT_NAME}" == "push" ]]; then
            ENVIRONMENTS=(dev staging)
          else
            case "${PROMOTE_TARGET}" in
              dev) ENVIRONMENTS=(dev) ;;
              staging) ENVIRONMENTS=(staging) ;;
              prod) ENVIRONMENTS=(prod) ;;
              both) ENVIRONMENTS=(dev staging) ;;
              all) ENVIRONMENTS=(dev staging prod) ;;
              *)
                echo "::error::无效的手动发布目标：${PROMOTE_TARGET}"
                exit 1
                ;;
            esac
          fi

          for env in "${ENVIRONMENTS[@]}"; do
            echo "========== 更新 ${env} 环境 =========="

            # 调用统一的同步脚本（含 BLOCKED_SERVICES 保护，防止 opsAgent 等独立仓库 tag 被覆盖）
            ENV_REPO_PATH="$(pwd)" \
            TARGET_ENV="${env}" \
            IMAGE_TAG="${IMAGE_TAG}" \
            SERVICES_CSV="${SERVICES_CSV}" \
            SKIP_BUSINESS_TAGS="${SKIP_BUSINESS_TAGS}" \
            SKIP_DB_MIGRATE="${SKIP_DB_MIGRATE}" \
              bash "$GITHUB_WORKSPACE/scripts/ops/sync-env-repo-tags.sh"

            VALUES_FILE="environments/${env}/values.yaml"
            verify_values_file() {
              local file="$1"
              local service actual
              local services=()
              if [[ -n "${SERVICES_CSV}" ]]; then
                IFS=',' read -r -a services <<< "${SERVICES_CSV}"
              fi

              for service in "${services[@]}"; do
                actual="$(awk -v key="${service}" '
                  $0 ~ "^" key ":$" { in_block=1; next }
                  in_block && $0 ~ /^[^[:space:]]/ { exit }
                  in_block && $0 ~ /^[[:space:]]+tag:[[:space:]]*/ {
                    value=$0
                    sub(/^.*tag:[[:space:]]*/, "", value)
                    gsub(/["[:space:]]/, "", value)
                    print value
                    exit
                  }
                ' "${file}")"
                if [[ "${actual}" != "${IMAGE_TAG}" ]]; then
                  echo "::error::${file} 的 ${service}.image.tag=${actual:-<missing>}，期望 ${IMAGE_TAG}"
                  return 1
                fi
              done

              if [[ "${SKIP_DB_MIGRATE}" != "true" ]]; then
                actual="$(awk '
                  /^dbMigrate:[[:space:]]*$/ { in_block=1; next }
                  in_block && /^[^[:space:]]/ { exit }
                  in_block && /^[[:space:]]+tag:[[:space:]]*/ {
                    value=$0
                    sub(/^.*tag:[[:space:]]*/, "", value)
                    gsub(/["[:space:]]/, "", value)
                    print value
                    exit
                  }
                ' "${file}")"
                if [[ "${actual}" != "${IMAGE_TAG}" ]]; then
                  echo "::error::${file} 的 dbMigrate.image.tag=${actual:-<missing>}，期望 ${IMAGE_TAG}"
                  return 1
                fi
              fi
            }

            # 先核验工作区，再提交，避免同步脚本漏更新时仍产生“成功”提交。
            verify_values_file "${VALUES_FILE}"
            if git diff --quiet "${VALUES_FILE}"; then
              echo "::error::${env} values.yaml 未发生镜像标签变更，拒绝宣称晋级成功（image_tag=${IMAGE_TAG}）"
              exit 1
            else
              git add "${VALUES_FILE}"
              git commit -m "chore(${env}): 自动更新镜像标签为 ${IMAGE_TAG} [skip ci]"
              # 推送前 rebase，避免并发提交导致 non-fast-forward 失败
              pushed=0
              for attempt in 1 2 3; do
                echo "第 ${attempt} 次同步远端并推送 ${env} 环境标签"
                if git pull --rebase origin main && git push origin main; then
                  pushed=1
                  echo "✅ ${env} 环境标签已推送"
                  break
                fi
                echo "⚠️ ${env} 环境标签推送失败，准备重试"
                sleep 2
              done
              if [[ "${pushed}" != "1" ]]; then
                echo "❌ ${env} 环境标签推送失败：多次重试后仍无法完成 rebase/push"
                exit 1
              fi

              # 推送成功后从远端 main 重新读取 values，确认环境仓库确实保存了本次 tag。
              git fetch origin main
              REMOTE_VALUES="$(mktemp)"
              trap 'rm -f "${REMOTE_VALUES}"' EXIT
              git show "origin/main:${VALUES_FILE}" > "${REMOTE_VALUES}"
              verify_values_file "${REMOTE_VALUES}"
              echo "${env} 环境仓库已确认：$(git rev-parse origin/main)"
            fi
          done

          {
            echo "### 非生产环境晋级结果"
            echo "- source_sha: \`${GITHUB_SHA}\`"
            echo "- image_tag: \`${IMAGE_TAG}\`"
            echo "- services: \`${SERVICES_CSV:-dbMigrate-only}\`"
            echo "- target: \`${ENVIRONMENTS[*]}\`"
            echo "- environment repository: \`tomturing/hci-platform-env\`"
            echo "- ArgoCD 将根据环境仓库 main 自动同步；请在发布后执行 Pod 镜像与源码核验。"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "✅ 非生产环境晋级完成：${ENVIRONMENTS[*]}（直接推送模式）"
