name: Env Repo Sync

on:
  workflow_dispatch:
    inputs:
      env_repo_name:
        description: "环境仓库名（格式：owner/repo）"
        required: true
      target_env:
        description: "目标环境（dev/staging/prod）"
        required: true
        default: "dev"
      image_tag:
        description: "镜像标签"
        required: true
      services_csv:
        description: "本次实际构建的业务服务列表（逗号分隔，须与 ghcr 已存在镜像一致）。纯 DB/文档/配置改动请留空并勾选 skip_business_tags"
        required: false
        default: ""
      skip_business_tags:
        description: "true=本次无业务镜像构建（如纯 DB/文档改动），跳过全部业务服务 tag 更新，仅同步 dbMigrate 等独立镜像"
        required: false
        default: "false"

concurrency:
  group: env-repo-sync-${{ inputs.env_repo_name }}-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  sync-env-repo:
    name: 同步环境仓库镜像标签
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 校验输入参数
        run: |
          if [[ -z "${{ inputs.env_repo_name }}" ]]; then
            echo "env_repo_name 不能为空，格式应为 owner/repo"
            exit 1
          fi
          # fail-safe：未给出业务服务清单时，必须显式声明 skip_business_tags，
          # 防止无差别把全量业务 tag 推进到 ghcr 不存在的镜像（导致 ArgoCD 卡死）。
          if [[ -z "${{ inputs.services_csv }}" && "${{ inputs.skip_business_tags }}" != "true" ]]; then
            echo "错误：services_csv 为空但 skip_business_tags != true。" >&2
            echo "纯 DB/文档/配置改动请勾选 skip_business_tags=true；" >&2
            echo "有业务镜像构建请通过 services_csv 传入实际构建的服务列表。" >&2
            exit 1
          fi

      - name: Checkout 应用仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout 环境仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.env_repo_name }}
          token: ${{ secrets.ENV_REPO_PAT }}
          path: env-repo

      - name: 同步镜像标签到环境仓库
        env:
          ENV_REPO_PATH: ${{ github.workspace }}/env-repo
          TARGET_ENV: ${{ inputs.target_env }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SERVICES_CSV: ${{ inputs.services_csv }}
          SKIP_BUSINESS_TAGS: ${{ inputs.skip_business_tags }}
        run: bash scripts/ops/sync-env-repo-tags.sh

      - name: 创建环境仓库 PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          token: ${{ secrets.ENV_REPO_PAT }}
          path: env-repo
          commit-message: "chore: 同步 ${{ inputs.target_env }} 环境镜像标签为 ${{ inputs.image_tag }}"
          title: "chore: 同步${{ inputs.target_env }}环境镜像标签 ${{ inputs.image_tag }}"
          body: |
            自动同步环境仓库镜像标签。

            - target_env: ${{ inputs.target_env }}
            - image_tag: ${{ inputs.image_tag }}
            - services_csv: ${{ inputs.services_csv }}

            请审核后合并。
          branch: chore/sync-${{ inputs.target_env }}-${{ inputs.image_tag }}
          base: main
