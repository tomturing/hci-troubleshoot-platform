name: Build terminal_bridge

# 在 terminal_bridge/ 源码变更（推送 main 或 PR）时，用 CI 交叉编译 windows/amd64 的
# terminal_bridge.exe，并自动回写到 customer-ui 下载目录：
#   frontend/customer/public/downloads/terminal_bridge.exe
# 全程不依赖本地环境（CI 用 ubuntu-latest + setup-go 交叉编译）。
#
# 防自触发：回写的文件路径在 frontend/ 下，不属于 terminal_bridge/** 监听范围，
# 因此自动提交不会再次触发本 workflow；提交信息另带 [skip ci] 双重保险。

on:
  push:
    branches: [main]
    paths:
      - 'terminal_bridge/**'
      - '.github/workflows/build-terminal-bridge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terminal_bridge/**'
      - '.github/workflows/build-terminal-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-terminal-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 terminal_bridge.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 便于回写时 rebase 远端最新，避免 non-fast-forward
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: terminal_bridge/go.sum

      - name: 交叉编译 terminal_bridge.exe (windows/amd64)
        run: bash scripts/build_terminal_bridge.sh

      - name: 回写并提交 exe（仅 push 到 main 时）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git add frontend/customer/public/downloads/terminal_bridge.exe
          if git diff --cached --quiet; then
            echo "exe 内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "build(terminal_bridge): 自动更新 windows exe [skip ci]"
          # 防止并发推送导致 non-fast-forward
          git pull --rebase origin main
          git push origin main
