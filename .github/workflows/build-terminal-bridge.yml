name: Build terminal_bridge

# 在 terminal_bridge/ 源码变更（推送 main 或 PR）时，用 CI 交叉编译 windows/amd64 的
# terminal_bridge.exe，并回写到 customer-ui 下载目录：
#   frontend/customer/public/downloads/terminal_bridge.exe
# 全程不依赖本地环境（CI 用 ubuntu-latest + setup-go 交叉编译）。
#
# 分支保护说明：main 受保护（必须经 PR + 必需状态检查），CI 不能直接 push 到 main。
# 因此本 workflow 在 push 到 main 触发时，会把新 exe 提交到一个机器人分支并开启 PR，
# 由 review / 自动合并合入；合入后的 push 会触发 ci.yml 重建 customer-ui 镜像，
# 从而把最新 exe 分发到下载目录（无需本地装 Go）。
#
# 防自触发：回写的 exe 落在 frontend/ 下，不属于 terminal_bridge/** 监听范围，
# 合入时不会再次触发本 workflow；机器人 PR 的提交信息带 [skip docs] 仅用于跳过文档校验。

on:
  push:
    branches: [main]
    paths:
      - 'terminal_bridge/**'
      - '.github/workflows/build-terminal-bridge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terminal_bridge/**'
      - '.github/workflows/build-terminal-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-terminal-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 terminal_bridge.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 便于切分支/回写时 rebase 远端最新
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: terminal_bridge/go.sum

      - name: Go 格式与单元测试
        working-directory: terminal_bridge
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [[ -n "$UNFORMATTED" ]]; then
            echo "以下 Go 文件未经 gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
          go test ./...

      - name: 交叉编译 terminal_bridge.exe (windows/amd64)
        run: bash scripts/build_terminal_bridge.sh

      - name: 回写 exe 并开启 PR（仅 push 到 main 时，遵守分支保护）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 忽略文件 mode 差异，避免 Linux 构建的 0644 与仓库 0755 误判为“有变化”
          git config core.fileMode false
          git add frontend/customer/public/downloads/terminal_bridge.exe
          if git diff --cached --quiet; then
            echo "exe 内容无变化，跳过提交"
            exit 0
          fi
          BRANCH="ci/auto-terminal-bridge-exe"
          # 在 HEAD 上新建/复用机器人分支，保留已暂存的 exe
          git branch -f "$BRANCH"
          git checkout "$BRANCH"
          git commit -m "build(terminal_bridge): 自动更新 windows exe [skip docs]"
          git push -f origin "$BRANCH"
          # 复用已存在的机器人 PR，避免重复
          PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            # 注意：部分 runner 的 gh 版本较旧，gh pr create 不支持 --json，故此处不传 --json
            gh pr create --head "$BRANCH" --base main \
              --title "build(terminal_bridge): 自动更新 windows exe" \
              --body "由 CI 自动生成，更新 customer-ui 下载目录的 terminal_bridge.exe。[skip docs]" \
              --label "agent:codebuddy" --label "env:dev:windows11-gpu"
            PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          fi
          echo "已创建/更新 PR #$PR，合并后 ci.yml 会自动重建 customer-ui 镜像以分发最新 exe"
          gh pr merge --auto --squash "$PR" 2>/dev/null || echo "（未启用自动合并，请手动合并该 PR）"
