name: 构建 hci-openclaw（手动触发）

# hci-openclaw 是外部固定版本依赖，不跟随每次业务代码 push 重新构建。
# 仅在需要升级 openclaw 版本时，由人工 workflow_dispatch 触发。
#
# 触发方式：GitHub Actions 页面 → 本 workflow → Run workflow
# 参数说明：
#   openclaw_ref：上游 openclaw 仓库的 git tag / branch（默认 v2026.3.24）

on:
    workflow_dispatch:
        inputs:
            openclaw_ref:
                description: "上游 openclaw 版本 tag（如 v2026.3.24）"
                required: true
                default: "v2026.3.24"

concurrency:
    group: build-hci-openclaw-${{ inputs.openclaw_ref }}
    cancel-in-progress: false

jobs:
    build-hci-openclaw:
        name: 构建并推送 hci-openclaw 镜像
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
            security-events: write
        steps:
            - name: Clone openclaw 上游源码（固定版本）
              run: |
                  git clone --depth=1 --branch "${{ inputs.openclaw_ref }}" \
                    https://github.com/openclaw/openclaw.git _ext_openclaw

            - name: 登录 GitHub Container Registry
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  # 首次创建新包需要 PAT（write:packages scope）
                  # GITHUB_TOKEN 只能推送已存在的包，无法创建新包
                  password: ${{ secrets.GHCR_PAT }}

            - name: 构建待扫描镜像
              id: build
              uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
              with:
                  context: _ext_openclaw
                  load: true
                  push: false
                  tags: |
                      local/hci-openclaw:${{ inputs.openclaw_ref }}
                      local/hci-openclaw:latest

            - name: Trivy 镜像安全扫描（仅上报，不阻断）
              id: scan
              uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
              continue-on-error: true
              with:
                  image-ref: local/hci-openclaw:${{ inputs.openclaw_ref }}
                  exit-code: "0"
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  scanners: vuln
                  version: v0.73.0
                  format: sarif
                  output: trivy-hci-openclaw.sarif

            - name: 上传安全扫描结果（GitHub Security 标签页可见）
              uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
              if: always() && hashFiles('trivy-hci-openclaw.sarif') != ''
              continue-on-error: true
              with:
                  sarif_file: trivy-hci-openclaw.sarif

            - name: 推送已扫描镜像
              id: push
              if: always() && steps.build.outcome == 'success'
              run: |
                  set -euo pipefail
                  target_image="ghcr.io/${GITHUB_REPOSITORY}/hci-openclaw"
                  docker tag "local/hci-openclaw:${{ inputs.openclaw_ref }}" "${target_image}:${{ inputs.openclaw_ref }}"
                  docker tag local/hci-openclaw:latest "${target_image}:latest"
                  docker push "${target_image}:${{ inputs.openclaw_ref }}"
                  docker push "${target_image}:latest"

            - name: 镜像发布审计摘要
              if: always()
              run: |
                  {
                    echo "### hci-openclaw 镜像发布审计"
                    echo "- source_ref: \`${{ inputs.openclaw_ref }}\`"
                    echo "- scan: \`${{ steps.scan.outcome }}\`"
                    echo "- push: \`${{ steps.push.outcome }}\`"
                    echo "- run_id: \`${GITHUB_RUN_ID}\`"
                  } >> "${GITHUB_STEP_SUMMARY}"
