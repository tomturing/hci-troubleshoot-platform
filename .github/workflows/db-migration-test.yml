name: DB Schema 声明式验证

on:
  pull_request:
    branches: [main]
    paths:
      # Schema 对象变更时触发（Ptah Compat 管理）
      - "database/desired_schema.sql"
      - "database/tests/**"
      - "database/licenses/**"
      # Atlas 迁移与完整性哈希变化同样必须触发，避免只改 migration 绕过验证
      - "database/atlas-migrations/**"
      # 数据迁移变更时触发（migration-runner 管理）
      - "database/data-migrations/**"
      # 迁移镜像 Dockerfile 变更时触发
      - "Dockerfile.migrations"
      # 入口脚本变更时触发
      - "scripts/db-migrate.sh"
      - "scripts/migration-runner.sh"
      - ".github/workflows/db-migration-test.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-schema-declarative-test:
    name: Ptah Compat 声明式 Schema 验证
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: hci_test
          POSTGRES_PASSWORD: ci_test_pass
          POSTGRES_DB: hci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgres://hci_test:ci_test_pass@localhost:5432/hci_test?sslmode=disable"
      # DEV_URL：独立临时数据库，Ptah 用于规范化 Schema SQL、预演变更及自动清理
      DEV_URL: "postgres://hci_test:ci_test_pass@localhost:5432/atlas_dev?sslmode=disable"

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # 升级验证需要读取 PR 基线（手动运行时为 origin/main）。
          fetch-depth: 0

      # ── Step 1: 构建迁移镜像 + 准备 dev 数据库 ─────────────────────────
      - name: 构建 Ptah Compat 迁移镜像
        run: |
          docker --context default build --build-arg MIRROR_MODE=off \
            -f Dockerfile.migrations -t hci-db-migrate-verify .
          docker --context default run --rm --entrypoint test hci-db-migrate-verify \
            -s /usr/share/licenses/ptah/LICENSE

      - name: 准备 Ptah Compat dev 数据库
        run: |
          # 与目标库同版本的独立临时库；扩展由期望状态管理，无需手动安装或重置。
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "CREATE DATABASE atlas_dev;"

      # ── Step 2: 声明式 Schema 全量应用 ───────────────────────────────────
      # 使用真实部署入口：空库 Schema 引导 → 版本化数据迁移 → Schema 最终收敛。
      - name: 全量迁移（Ptah Compat + 数据迁移）
        run: |
          docker --context default run --rm --network host --user 65534:65534 \
            -e DATABASE_URL -e DEV_URL hci-db-migrate-verify

      # ── Step 3: Schema 完整性验证 ─────────────────────────────────────────
      # 验证核心业务表存在，废弃表未被创建
      # 注意：仅验证核心业务表，动态资源类表（dynamic_resource_*）和辅助表（bridge_execution_logs 等）由 Ptah Compat 自动管理
      - name: Schema 完整性检查
        run: |
          EXPECTED_TABLES=(
            "user" "customer" "case" "conversation" "message"
            "diagnostic_item" "tool_result" "audit_log" "session"
            "system_prompt" "tool_definition" "kb_category"
            "kbd_entry" "sop_document"
            "environment" "assistant_evaluation"
            # 新增核心表（PR #613 补充）
            "kbd_image" "sop_execution" "skill_definition"
            "migration_history" "terminal_operation" "prompt_slot"
            "fact" "claim_evidence_link"
          )
          DEPRECATED_TABLES=(
            "kb_chunk" "kb_document" "kb_sop_node" "kb_synonym"
            "raw_cases" "knowledge_atoms" "prompt_audit" "sop_chunk"
            # hci-sim 已迁至独立库（database/hci-sim-migrations/000001_control_plane.sql，
            # 以 control_plane/fixture/artifact/audit schema 重建等价表），主库 agent_test_*
            # 为迁移遗留孤儿表，backend 零引用，已从 desired_schema.sql 删除并由
            # atlas-migrations/20260813000000_drop_orphan_agent_test_tables.sql 清理。
            "agent_test_scenario" "agent_test_fixture_bundle"
            "agent_test_fixture_dependency" "agent_test_fixture_provenance"
            "agent_test_fixture_approval" "agent_test_fixture_audit"
            "agent_test_artifact" "agent_test_artifact_scan" "agent_test_artifact_approval"
            "agent_test_fixture_stale_outbox"
            "agent_test_run" "agent_test_run_attempt" "agent_test_run_event"
            "agent_test_run_result" "agent_test_runtime_instance"
          )

          MISSING=0
          for TABLE in "${EXPECTED_TABLES[@]}"; do
            COUNT=$(psql "$DATABASE_URL" -t -c \
              "SELECT COUNT(*) FROM pg_tables WHERE schemaname='public' AND tablename='$TABLE';" \
              | tr -d '[:space:]')
            if [ "$COUNT" -eq "1" ]; then
              echo "  ✅ $TABLE"
            else
              echo "  ❌ $TABLE（缺失）"
              MISSING=$((MISSING + 1))
            fi
          done

          for TABLE in "${DEPRECATED_TABLES[@]}"; do
            COUNT=$(psql "$DATABASE_URL" -t -c \
              "SELECT COUNT(*) FROM pg_tables WHERE schemaname='public' AND tablename='$TABLE';" \
              | tr -d '[:space:]')
            if [ "$COUNT" -eq "0" ]; then
              echo "  ✅ $TABLE（正确：废弃表未创建）"
            else
              echo "  ❌ $TABLE（废弃表意外存在）"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "❌ Schema 完整性检查失败（$MISSING 项异常）"
            exit 1
          fi
          echo "✅ 所有 ${#EXPECTED_TABLES[@]} 张业务表正确，${#DEPRECATED_TABLES[@]} 张废弃表未创建"

      - name: 验证函数、触发器及 pgvector 行为
        run: psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f database/tests/ptah-schema.sql

      # ── Step 4: 幂等性验证 ────────────────────────────────────────────────
      # 重复执行真实入口，再读取结构化报告的变更数量；不匹配日志文案或忽略退出码。
      - name: 幂等性验证（ptah-compat schema diff）
        run: |
          docker --context default run --rm --network host --user 65534:65534 \
            -e DATABASE_URL -e DEV_URL hci-db-migrate-verify
          DIFF=$(docker --context default run --rm --network host --user 65534:65534 \
            --entrypoint ptah-compat hci-db-migrate-verify schema diff \
            --from "$DATABASE_URL" \
            --to file:///desired_schema.sql \
            --dev-url "$DEV_URL" \
            --exclude "schema_migrations,alembic_version,atlas_schema_revisions" \
            --format '{{ len .Changes }}')
          if [ "$DIFF" != "0" ]; then
            echo "❌ 幂等性验证失败，待变更数量: $DIFF"
            exit 1
          fi
          echo "✅ 幂等性验证通过：DB 与期望 Schema 完全一致，无待变更项"

      - name: 从 PR 基线升级存量数据库
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          # 使用相邻版本的真实部署入口，避免永久只验证首次替换 Atlas 的历史基线。
          git worktree add --detach "$RUNNER_TEMP/db-upgrade-base" "$BASE_REVISION"
          docker --context default build --build-arg MIRROR_MODE=off \
            -f "$RUNNER_TEMP/db-upgrade-base/Dockerfile.migrations" \
            -t hci-db-migrate-base "$RUNNER_TEMP/db-upgrade-base"
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "CREATE DATABASE hci_upgrade;"
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "CREATE DATABASE hci_upgrade_dev;"
          export DATABASE_URL="postgres://hci_test:ci_test_pass@localhost:5432/hci_upgrade?sslmode=disable"
          export DEV_URL="postgres://hci_test:ci_test_pass@localhost:5432/hci_upgrade_dev?sslmode=disable"
          docker --context default run --rm --network host --user 65534:65534 \
            -e DATABASE_URL -e DEV_URL hci-db-migrate-base
          CHECKSUM=$(psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -tAc \
            "SELECT checksum FROM migration_history WHERE version='035';")
          test -n "$CHECKSUM"
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -c \
            "INSERT INTO \"user\"(client_id,metadata) VALUES ('ptah-upgrade-sentinel','{\"preserve\":\"user-data\"}');"
          docker --context default run --rm --network host --user 65534:65534 \
            -e DATABASE_URL -e DEV_URL hci-db-migrate-verify
          test "$CHECKSUM" = "$(psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -tAc \
            "SELECT checksum FROM migration_history WHERE version='035';")"
          test "$(psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM \"user\" WHERE client_id='ptah-upgrade-sentinel' AND metadata='{\"preserve\":\"user-data\"}'::jsonb;")" = "1"
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f database/tests/ptah-schema.sql
          DIFF=$(docker --context default run --rm --network host --user 65534:65534 \
            --entrypoint ptah-compat hci-db-migrate-verify schema diff \
            --from "$DATABASE_URL" --to file:///desired_schema.sql --dev-url "$DEV_URL" \
            --exclude "schema_migrations,alembic_version,atlas_schema_revisions" \
            --format '{{ len .Changes }}')
          test "$DIFF" = "0"
          echo "✅ 升级保留存量数据和迁移历史，业务行为正常且 Schema diff 为零"
