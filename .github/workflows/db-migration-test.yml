name: DB Schema 声明式验证

on:
  pull_request:
    branches: [main]
    paths:
      # 表结构变更时触发（Atlas 声明式管理，无迁移版本目录）
      - "database/desired_schema.sql"
      # 函数/触发器变更时触发（psql 管理）
      - "database/desired_extras.sql"
      # 数据迁移变更时触发（migration-runner 管理）
      - "database/data-migrations/**"
      # 种子数据变更时触发（PostSync db-seed 管理；新表的初始数据只需走这里）
      - "database/seeds/**"
      # 变量契约巡检脚本与其依赖的契约模型变更时触发
      - "scripts/verify/sop_variable_contract_check.py"
      - "backend/shared/models/sop_variable.py"
      # 迁移镜像 Dockerfile 变更时触发
      - "Dockerfile.migrations"
      # 入口脚本变更时触发
      - "scripts/db-migrate.sh"
      - "scripts/migration-runner.sh"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-schema-declarative-test:
    name: Atlas 声明式 Schema 验证
    runs-on: ubuntu-latest
    # 新增「存量库升级路径」实跑 db-migrate.sh，多一轮 Atlas apply + 全量迁移
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: hci_test
          POSTGRES_PASSWORD: ci_test_pass
          POSTGRES_DB: hci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgres://hci_test:ci_test_pass@localhost:5432/hci_test?sslmode=disable"
      # DEV_URL：独立空数据库，Atlas 用于规范化 Schema SQL
      DEV_URL: "postgres://hci_test:ci_test_pass@localhost:5432/atlas_dev?sslmode=disable"

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      # ── Step 1: 安装 Atlas CLI + 准备 dev 数据库 ─────────────────────────
      - name: 安装 Atlas CLI
        run: |
          # 与 Dockerfile.migrations 多阶段构建同源对齐（arigaio/atlas:1.1.6-community），
          # 直接抽取镜像内 /atlas 二进制，避免依赖 atlasgo.sh 分发（该渠道已下架 1.1.6 CLI）。
          ATLAS_IMAGE="arigaio/atlas:1.1.6-community"
          docker create --name atlas-extract "$ATLAS_IMAGE" /dev/null
          docker cp atlas-extract:/atlas /usr/local/bin/atlas
          docker rm -f atlas-extract
          chmod +x /usr/local/bin/atlas
          atlas version

      - name: 准备 Atlas dev 数据库
        run: |
          # 创建独立的 Atlas dev 数据库（Atlas 用于规范化 DDL，需与目标库同版本）
          psql "$DATABASE_URL" -c "CREATE DATABASE atlas_dev;"
          # 两个数据库都需要安装 extensions（desired_schema.sql 使用 vector 类型）
          # hci_test（主库）：Atlas apply 时实际执行建表，需要 vector 类型
          # atlas_dev（dev库）：Atlas 规范化 DDL 时也需要 vector 类型
          for DB_URL in "$DATABASE_URL" "$DEV_URL"; do
            psql "$DB_URL" -c "
              CREATE EXTENSION IF NOT EXISTS vector;
              CREATE EXTENSION IF NOT EXISTS pgcrypto;
              CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
              CREATE EXTENSION IF NOT EXISTS pg_trgm;
            "
          done
          echo "✅ hci_test 和 atlas_dev 扩展安装完成"

      # ── Step 2: 声明式 Schema 全量应用 ───────────────────────────────────
      # 空库先由 Atlas 建表，再执行数据迁移和触发器；与 db-migrate.sh 的冷启动结果一致。
      - name: 全量迁移（函数 → Atlas → 触发器）
        run: |
          echo ">>> Step 2a: 应用函数"
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f database/desired_extras.sql

          echo ">>> Step 2b: Atlas schema apply"
          atlas schema apply \
            --url "$DATABASE_URL" \
            --to "file://database/desired_schema.sql" \
            --dev-url "$DEV_URL" \
            --exclude "schema_migrations,alembic_version,atlas_schema_revisions" \
            --auto-approve

          echo ">>> Step 2c: 应用触发器"
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f database/desired_extras.sql
          echo "✅ Schema 全量应用成功"

          # ── Step 2d: 执行数据迁移（验证 SQL 正确性）────────────────────────────
          echo ">>> Step 2d: 执行数据迁移"
          for MIG_FILE in database/data-migrations/*.sql; do
            if [ -f "$MIG_FILE" ]; then
              echo "  执行: $MIG_FILE"
              psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f "$MIG_FILE" || {
                echo "❌ 数据迁移失败: $MIG_FILE"
                exit 1
              }
            fi
          done
          echo "✅ 数据迁移执行成功"

          # ── Step 2e: 执行种子数据（模拟 PostSync db-seed）────────────────────
          # 与 db-seed Job 一致：按文件名顺序全量执行 seeds/*.sql。
          # 关键：seeds 在 Schema 收敛之后跑，这正是「新表 + 初始数据」应有的落点；
          # data-migrations（Step 2d）在存量库中跑在 Atlas 之前，不能碰本次新建的表。
          echo ">>> Step 2e: 执行种子数据（database/seeds/*.sql）"
          for SEED_FILE in $(ls database/seeds/*.sql | sort); do
            echo "  执行: $SEED_FILE"
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f "$SEED_FILE" || {
              echo "❌ 种子数据失败: $SEED_FILE"
              exit 1
            }
          done
          echo "✅ 种子数据执行成功"

      # ── Step 2f: 字典种子内容断言 ─────────────────────────────────────────
      # 把「字典应有几项、哪项兜底、有无互斥项」锁进门禁，避免 seed 与
      # desired_schema 注释 / 前端文案 / 设计文档四处漂移。
      - name: 字典种子内容断言（log_collect_scenario）
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          DECLARE
            n_total int;
            n_exclusive int;
            v_other_exclusive boolean;
            v_other_rank int;
          BEGIN
            SELECT count(*) INTO n_total FROM log_collect_scenario;
            IF n_total <> 10 THEN
              RAISE EXCEPTION '场景字典应有 10 行，实际 %', n_total;
            END IF;

            SELECT count(*) INTO n_exclusive FROM log_collect_scenario WHERE exclusive;
            IF n_exclusive <> 0 THEN
              RAISE EXCEPTION '当前不应有互斥项（other 已确认叠加语义），实际 % 行为 true', n_exclusive;
            END IF;

            SELECT exclusive, sort_order INTO v_other_exclusive, v_other_rank
              FROM log_collect_scenario WHERE value = 'other';
            IF v_other_exclusive IS NULL THEN
              RAISE EXCEPTION 'other 兜底项缺失';
            END IF;
            IF v_other_exclusive THEN
              RAISE EXCEPTION 'other 的 exclusive 必须为 false';
            END IF;
            IF v_other_rank <> 100 THEN
              RAISE EXCEPTION 'other 的 sort_order 应为 100，实际 %', v_other_rank;
            END IF;
          END $$;
          SQL
          echo "✅ 字典断言通过：10 行、无互斥项、other 为兜底且 ranked=100"

      # ── Step 3: Schema 完整性验证 ─────────────────────────────────────────
      # 验证核心业务表存在，废弃表未被创建
      # 注意：仅验证核心业务表，动态资源类表（dynamic_resource_*）和辅助表（bridge_execution_logs 等）由 Atlas 自动管理
      - name: Schema 完整性检查
        run: |
          EXPECTED_TABLES=(
            "user" "customer" "case" "conversation" "message"
            "diagnostic_item" "tool_result" "audit_log" "session"
            "system_prompt" "tool_definition" "kb_category"
            "kbd_entry" "sop_document"
            "environment"
            # 新增核心表（PR #613 补充）
            "kbd_image" "sop_execution" "skill_definition"
            "migration_history" "terminal_operation" "prompt_slot"
            "fact" "claim_evidence_link"
            # 2026-10-29（数据库设计 v7.54）：日志收集「故障场景」字典，客户面板勾选项文案来源
            "log_collect_scenario"
          )
          DEPRECATED_TABLES=(
            "kb_chunk" "kb_document" "kb_sop_node" "kb_synonym"
            "raw_cases" "knowledge_atoms" "prompt_audit" "sop_chunk"
            # 2026-10-26（数据库设计 v7.52）：评分体系从未落地运行（写入/读取链路已于
            # 2026-10-25 跨三个服务删除，前端评分卡一并移除，实库 0 行），表已从
            # desired_schema.sql 整表删除，故移入废弃清单。
            "assistant_evaluation"
            # hci-sim 已迁至独立库（database/hci-sim-migrations/000001_control_plane.sql，
            # 以 control_plane/fixture/artifact/audit schema 重建等价表），主库 agent_test_*
            # 为迁移遗留孤儿表，backend 零引用，已从 desired_schema.sql 删除。
            "agent_test_scenario" "agent_test_fixture_bundle"
            "agent_test_fixture_dependency" "agent_test_fixture_provenance"
            "agent_test_fixture_approval" "agent_test_fixture_audit"
            "agent_test_artifact" "agent_test_artifact_scan" "agent_test_artifact_approval"
            "agent_test_fixture_stale_outbox"
            "agent_test_run" "agent_test_run_attempt" "agent_test_run_event"
            "agent_test_run_result" "agent_test_runtime_instance"
          )

          MISSING=0
          for TABLE in "${EXPECTED_TABLES[@]}"; do
            COUNT=$(psql "$DATABASE_URL" -t -c \
              "SELECT COUNT(*) FROM pg_tables WHERE schemaname='public' AND tablename='$TABLE';" \
              | tr -d '[:space:]')
            if [ "$COUNT" -eq "1" ]; then
              echo "  ✅ $TABLE"
            else
              echo "  ❌ $TABLE（缺失）"
              MISSING=$((MISSING + 1))
            fi
          done

          for TABLE in "${DEPRECATED_TABLES[@]}"; do
            COUNT=$(psql "$DATABASE_URL" -t -c \
              "SELECT COUNT(*) FROM pg_tables WHERE schemaname='public' AND tablename='$TABLE';" \
              | tr -d '[:space:]')
            if [ "$COUNT" -eq "0" ]; then
              echo "  ✅ $TABLE（正确：废弃表未创建）"
            else
              echo "  ❌ $TABLE（废弃表意外存在）"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "❌ Schema 完整性检查失败（$MISSING 项异常）"
            exit 1
          fi
          echo "✅ 所有 ${#EXPECTED_TABLES[@]} 张业务表正确，${#DEPRECATED_TABLES[@]} 张废弃表未创建"

      # ── Step 4: 幂等性验证 ────────────────────────────────────────────────
      # atlas schema diff 输出为空 → 当前 DB 与期望 Schema 完全一致 → 幂等
      - name: 幂等性验证（atlas schema diff）
        run: |
          # atlas schema apply 使用 --dev-url 时会 DROP SCHEMA public CASCADE 清空 atlas_dev，
          # 导致 pgvector 注册在 public schema 的类型对象丢失（扩展条目仍在但类型消失）。
          # 重建 atlas_dev 数据库是最可靠的恢复方式。
          psql "$DATABASE_URL" -c "DROP DATABASE atlas_dev;"
          psql "$DATABASE_URL" -c "CREATE DATABASE atlas_dev;"
          psql "$DEV_URL" -c "
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
          "

          DIFF=$(atlas schema diff \
            --from "$DATABASE_URL" \
            --to "file://database/desired_schema.sql" \
            --dev-url "$DEV_URL" \
            --exclude "schema_migrations,alembic_version,atlas_schema_revisions" \
            2>&1 || true)

          if [ -z "$DIFF" ] || echo "$DIFF" | grep -q "Schemas are synced"; then
            echo "✅ 幂等性验证通过：DB 与期望 Schema 完全一致，无待变更项"
          else
            echo "❌ 幂等性验证失败：apply 后仍存在 diff："
            echo "$DIFF"
            exit 1
          fi

      # ── Step 5: SOP 变量声明契约巡检 ──────────────────────────────────────
      # 覆盖边界（必须写清，避免变成"假门禁"）：
      #   database/seeds 不含 sop_document 数据，CI 空库下本步只能验证
      #   "脚本可运行 + 契约模型可导入"，不会真正校验存量 SOP 定义。
      #   存量数据的契约门禁由另两层承担：
      #     1) 迁移文件内联 DO 断言（执行即校验，如 054 的收敛断言）
      #     2) 部署后对 staging/prod 跑同一脚本（见 docs 运维命令）
      #   一旦 seeds 引入 sop_document 样例，本步会自动从"跳过"升级为强校验。
      #
      # 拆成三步而非一步：本 job 全程只装了 Atlas，没有 uv（其余 workflow 都显式
      # astral-sh/setup-uv）。单步写法里 `uv run` 永远走不到，一旦 seeds 引入
      # sop_document 样例，门禁会在"真正开始校验"的第一秒以 `uv: command not found`
      # 失败——那不是契约失败，是环境缺失伪装成红灯。故用上一步的数量作为
      # 条件，只有真的有待校验数据时才装 uv。
      - name: 统计 SOP 变量声明数量
        id: sop_var_count
        run: |
          set -euo pipefail
          COUNT=$(psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM sop_document WHERE variable_schema IS NOT NULL AND jsonb_typeof(variable_schema) = 'array'")
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "⏭️ 跳过：库中无 SOP 变量声明（seeds 不含 sop_document 样例）"
            echo "   存量契约门禁由迁移内 DO 断言 + 部署后巡检承担"
          fi

      - name: 安装 uv（契约巡检）
        if: steps.sop_var_count.outputs.count != '0'
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39a
        with:
          version: "latest"
          enable-cache: true

      - name: SOP 变量声明契约巡检
        if: steps.sop_var_count.outputs.count != '0'
        run: |
          set -euo pipefail
          echo "检测到 ${{ steps.sop_var_count.outputs.count }} 份 SOP 变量声明，开始契约校验"
          uv run --no-project --with asyncpg --with pydantic \
            python scripts/verify/sop_variable_contract_check.py \
            --database-url "$DATABASE_URL" --status published

      # ── Step 6: 存量库升级路径（PreSync 两趟收敛回归门禁）──────────────────
      # Step 2 只覆盖「空库路径」：函数 → Atlas → 触发器 → 数据迁移 → 种子，
      # 而 scripts/db-migrate.sh 对存量库是「预迁移 → 函数 → Atlas → 最终迁移 →
      # 触发器 → 种子」。两者顺序不同：历史上 056~064 依赖 Atlas 新建的
      # log_collect_* 表，空库路径全绿、存量库 PreSync 却死锁且 CI 无从发现。
      # 本步构造「核心 Schema 已存在、新表缺失」的存量库，直接执行真实入口脚本，
      # 用可证伪断言钉住两趟收敛；若有人把入口改回单趟，这一步必然失败。
      - name: 存量库升级路径验证（db-migrate.sh 两趟收敛）
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -c "CREATE DATABASE legacy_test;"
          psql "$DATABASE_URL" -c "CREATE DATABASE atlas_dev_legacy;"
          LEGACY_URL="postgres://hci_test:ci_test_pass@localhost:5432/legacy_test?sslmode=disable"
          LEGACY_DEV_URL="postgres://hci_test:ci_test_pass@localhost:5432/atlas_dev_legacy?sslmode=disable"
          for DB_URL in "$LEGACY_URL" "$LEGACY_DEV_URL"; do
            psql -v ON_ERROR_STOP=1 "$DB_URL" -c "
              CREATE EXTENSION IF NOT EXISTS vector;
              CREATE EXTENSION IF NOT EXISTS pgcrypto;
              CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
              CREATE EXTENSION IF NOT EXISTS pg_trgm;
            "
          done

          # 先按完整 desired schema 建库，再删掉数据迁移依赖的新表，精确复现
          # 「存量库核心 Schema 已在、但本次新增表尚未创建」的现场。
          atlas schema apply \
            --url "$LEGACY_URL" \
            --to "file://$PWD/database/desired_schema.sql" \
            --dev-url "$LEGACY_DEV_URL" \
            --exclude "schema_migrations,alembic_version,atlas_schema_revisions" \
            --auto-approve
          psql -v ON_ERROR_STOP=1 "$LEGACY_URL" -c "
            DROP TABLE IF EXISTS log_collect_task CASCADE;
            DROP TABLE IF EXISTS log_collect_custom_scenario CASCADE;
            DROP TABLE IF EXISTS log_collect_default_scenario CASCADE;
          "

          DATABASE_URL="$LEGACY_URL" \
          DEV_URL="$LEGACY_DEV_URL" \
          SCHEMA_FILE="$PWD/database/desired_schema.sql" \
          EXTRAS_FILE="$PWD/database/desired_extras.sql" \
          MIGRATION_RUNNER="$PWD/scripts/migration-runner.sh" \
          MIGRATIONS_DIR="$PWD/database/data-migrations" \
          SEEDS_DIR="$PWD/database/seeds" \
            sh scripts/db-migrate.sh

          # 可证伪断言：全部版本均已登记，且被删的依赖表由 Atlas 重建。
          EXPECTED=$(ls database/data-migrations/*.sql | wc -l | tr -d ' ')
          ACTUAL=$(psql "$LEGACY_URL" -tAc "SELECT count(*) FROM migration_history" | tr -d ' ')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "❌ 存量库路径存在未登记迁移：expected=${EXPECTED} actual=${ACTUAL}"
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 "$LEGACY_URL" -c "
            SELECT to_regclass('public.log_collect_task') IS NOT NULL AS task_ready,
                   to_regclass('public.log_collect_custom_scenario') IS NOT NULL AS scenario_ready;
          "
          echo "✅ 存量库路径通过：${ACTUAL} 个迁移全部登记，依赖新表已重建"
