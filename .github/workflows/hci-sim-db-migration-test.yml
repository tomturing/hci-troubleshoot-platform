name: hci-sim DB 隔离迁移验证

on:
  pull_request:
    branches: [main]
    paths:
      - "database/hci-sim-migrations/**"
      - "hci_sim/internal/database/**"
      - "hci_sim/internal/reconciler/**"
      - "hci_sim/go.mod"
      - "hci_sim/go.sum"
      - "scripts/db/hci-sim-copy.sh"
      - "deploy/helm/hci-platform/templates/hci-sim-db-*.yaml"
      - "deploy/helm/hci-platform/templates/hooks/hci-sim-db-migrate-job.yaml"
      - "deploy/helm/hci-platform/values.yaml"
  workflow_dispatch:

concurrency:
  group: hci-sim-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    name: hci_sim migration and permission boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: hci_admin
          POSTGRES_PASSWORD: ci_admin_pass
          POSTGRES_DB: hci_troubleshoot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hci_admin -d hci_troubleshoot"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: hci_admin
      PGPASSWORD: ci_admin_pass
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: hci_sim/go.mod
          cache-dependency-path: hci_sim/go.sum
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.17.3
      - name: 创建目标数据库和迁移角色
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE hci_sim_migrator LOGIN PASSWORD 'mig_pass';"
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE hci_sim_runtime LOGIN PASSWORD 'run_pass';"
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE hci_sim OWNER hci_sim_migrator;"
      - name: 执行独立迁移
        run: |
          for migration in database/hci-sim-migrations/*.sql; do
            echo "执行迁移：$migration"
            psql -d hci_sim -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: 验证 Helm 迁移包与执行入口一致
        run: |
          helm template hci-platform deploy/helm/hci-platform \
            --namespace hci-dev \
            --set hciSimDatabase.enabled=true \
            --set hciSimDatabase.migratorPassword=mig_pass \
            --set hciSimDatabase.runtimePassword=run_pass \
            > /tmp/hci-platform-rendered.yaml
          for migration in database/hci-sim-migrations/*.sql; do
            name="$(basename "$migration")"
            grep -Fq "  ${name}: |" /tmp/hci-platform-rendered.yaml || {
              echo "未将迁移 ${name} 打包进 hci-sim-db-migrations ConfigMap" >&2
              exit 1
            }
          done
          # 迁移 SQL 是 PreSync Hook；普通触发器必须存在且不能是 Hook，
          # 否则 migration-only 提交会被 ArgoCD 判定为 Synced 而不启动同步。
          grep -Fq 'name: hci-sim-db-migration-trigger' /tmp/hci-platform-rendered.yaml
          grep -Fq 'ordinary-sync-trigger: "true"' /tmp/hci-platform-rendered.yaml
          grep -Fq 'for migration in /migrations/*.sql; do' /tmp/hci-platform-rendered.yaml
          ! grep -Fq '/migrations/000001_control_plane.sql' /tmp/hci-platform-rendered.yaml
      - name: 校验模块表和主库边界
        run: |
          expected_tables='artifact.approval artifact.metadata artifact.scan audit.entity_event control_plane.run control_plane.run_attempt control_plane.run_event control_plane.run_outbox control_plane.run_result control_plane.runtime_instance control_plane.scenario fixture.approval fixture.bundle fixture.bundle_activation fixture.bundle_template fixture.dependency fixture.provenance fixture.stale_outbox'
          actual_tables="$(psql -d hci_sim -Atc "SELECT table_schema || '.' || table_name FROM information_schema.tables WHERE table_schema IN ('control_plane','fixture','artifact','audit') AND table_type = 'BASE TABLE' ORDER BY 1" | tr '\n' ' ' | sed 's/[[:space:]]\+$//')"
          test "$actual_tables" = "$expected_tables"
          test "$(psql -d hci_troubleshoot -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'agent_test_%'")" = 0
          psql -d hci_sim -v ON_ERROR_STOP=1 -c "REVOKE ALL ON DATABASE hci_sim FROM PUBLIC; GRANT CONNECT ON DATABASE hci_sim TO hci_sim_runtime;"
          ! PGPASSWORD=run_pass psql -h localhost -U hci_sim_runtime -d hci_sim -c 'CREATE TABLE control_plane.must_fail(id int);'
          echo 'hci_sim migration and DDL negative check: PASS'
      - name: 校验 Runtime DML、幂等和 CAS
        env:
          HCI_SIM_TEST_DATABASE_URL: postgresql://hci_sim_runtime:run_pass@localhost:5432/hci_sim
        run: |
          psql -d hci_sim -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA control_plane, fixture, artifact, audit TO hci_sim_runtime; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA control_plane, fixture, artifact, audit TO hci_sim_runtime; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA control_plane, fixture, artifact, audit TO hci_sim_runtime;"
          cd hci_sim
          # 两个集成测试包共享同一个临时 PostgreSQL outbox；必须串行，避免一个包
          # 抢占另一个包刚写入的 SKIP LOCKED 消息而产生非确定性失败。
          go test -p 1 ./internal/database ./internal/reconciler -count=1
